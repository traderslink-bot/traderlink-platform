<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Pin bar candle shape</title>
  <desc id="desc">Clean candle diagram showing pin bar candles with small bodies and one dominant wick.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Pin bar candle shape</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Small body with one dominant wick that clearly stands out.</text>

  <g transform="translate(315 168)">
    <text x="-104" y="-24" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Upper wick pin bar</text>
    <line x1="0" y1="0" x2="0" y2="224" stroke="#d6e4ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-44" y="158" width="88" height="42" rx="7" fill="#ef4444"/>
    <text x="-122" y="260" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Small body, long upper wick.</text>
  </g>

  <g transform="translate(655 168)">
    <text x="-104" y="-24" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Lower wick pin bar</text>
    <line x1="0" y1="0" x2="0" y2="224" stroke="#d6e4ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-44" y="24" width="88" height="42" rx="7" fill="#22c55e"/>
    <text x="-122" y="260" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Small body, long lower wick.</text>
  </g>
</svg>
