<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Red to green move shape</title>
  <desc id="desc">Clean intraday candle diagram showing price starting below the prior close and then moving above it.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Red to green move</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Price begins below the reference line, then moves above it.</text>

  <line x1="110" y1="260" x2="850" y2="260" stroke="#9cc7ff" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="118" y="246" fill="#9cc7ff" font-family="Arial, sans-serif" font-size="16">Prior close line</text>

  <g stroke-width="4" stroke-linecap="round">
    <g stroke="#ef4444" fill="#ef4444"><line x1="230" y1="284" x2="230" y2="362"/><rect x="210" y="306" width="40" height="38" rx="5"/></g>
    <g stroke="#ef4444" fill="#ef4444"><line x1="330" y1="262" x2="330" y2="342"/><rect x="310" y="286" width="40" height="34" rx="5"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="430" y1="218" x2="430" y2="304"/><rect x="410" y="244" width="40" height="44" rx="5"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="530" y1="170" x2="530" y2="270"/><rect x="510" y="198" width="40" height="54" rx="5"/></g>
  </g>

  <path d="M238 340C330 322 426 282 532 212" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="584" y="224" fill="#d6e4ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Move above the line</text>
  <text x="584" y="252" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Red candles first, then green candles above.</text>
</svg>
