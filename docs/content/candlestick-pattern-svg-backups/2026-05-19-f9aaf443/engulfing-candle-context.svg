<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bullish and bearish engulfing candle shapes</title>
  <desc id="desc">Clean candle diagram showing bullish and bearish engulfing candle pairs where the second candle body is larger than the prior candle body.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Engulfing candle shapes</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">The second candle body clearly covers the prior candle body.</text>

  <g transform="translate(270 175)">
    <text x="-92" y="-26" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Bullish engulfing</text>
    <line x1="-60" y1="92" x2="-60" y2="188" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="-94" y="116" width="68" height="50" rx="6" fill="#ef4444"/>
    <line x1="62" y1="34" x2="62" y2="230" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="14" y="56" width="96" height="152" rx="7" fill="#22c55e"/>
    <rect x="2" y="44" width="120" height="176" rx="10" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="-132" y="266" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Large green body covers prior red body.</text>
  </g>

  <g transform="translate(690 175)">
    <text x="-92" y="-26" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Bearish engulfing</text>
    <line x1="-60" y1="34" x2="-60" y2="230" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="-108" y="56" width="96" height="152" rx="7" fill="#22c55e"/>
    <line x1="62" y1="30" x2="62" y2="234" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="14" y="38" width="96" height="184" rx="7" fill="#ef4444"/>
    <rect x="2" y="26" width="120" height="208" rx="10" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="-132" y="276" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Large red body covers prior green body.</text>
  </g>
</svg>
