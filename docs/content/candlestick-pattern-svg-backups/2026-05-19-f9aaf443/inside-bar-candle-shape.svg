<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Inside bar candle shape</title>
  <desc id="desc">Clean candle diagram showing an inside bar contained within the high and low of the prior mother candle.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Inside bar candle shape</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">The second candle stays fully inside the prior candle range.</text>

  <g transform="translate(360 150)">
    <text x="-82" y="-2" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="18" font-weight="700">Mother candle</text>
    <line x1="0" y1="20" x2="0" y2="260" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <rect x="-58" y="72" width="116" height="130" rx="7" fill="#64748b"/>
    <path d="M74 20H198M74 260H198" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="92" y="12" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">prior high</text>
    <text x="92" y="272" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">prior low</text>
  </g>

  <g transform="translate(575 150)">
    <text x="-52" y="-2" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="22" font-weight="700">Inside bar</text>
    <rect x="-78" y="48" width="156" height="184" rx="10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 7"/>
    <line x1="0" y1="82" x2="0" y2="200" stroke="#d6e4ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-44" y="112" width="88" height="52" rx="7" fill="#22c55e"/>
  </g>

  <text x="334" y="448" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="16">Highlighted candle remains inside the mother candle range.</text>
</svg>
