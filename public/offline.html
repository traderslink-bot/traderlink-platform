<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#011e56" />
    <title>Offline | TraderLink Platform</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        align-items: center;
        background: #f5f7fb;
        color: #162033;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        background: #fff;
        border: 1px solid #dfe4ec;
        border-radius: 16px;
        max-width: 520px;
        padding: 40px;
        text-align: center;
        width: 100%;
      }
      img { border-radius: 12px; height: 72px; width: 72px; }
      h1 { font-size: 30px; line-height: 1.2; margin: 22px 0 10px; }
      p { color: #5d687a; font-size: 16px; line-height: 1.55; margin: 0; }
      a {
        background: #011e56;
        border-radius: 8px;
        color: #fff;
        display: inline-block;
        font-size: 15px;
        font-weight: 700;
        margin-top: 28px;
        min-height: 42px;
        padding: 11px 20px;
        text-decoration: none;
      }
      @media (max-width: 480px) {
        body { padding: 16px; }
        main { padding: 30px 22px; }
        h1 { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <main>
      <img alt="" src="/icons/traderlink-192.png" />
      <h1>TraderLink is offline</h1>
      <p>
        Reconnect to update this page. Saved offline information will stay on
        this device when it is available.
      </p>
      <a href="/workspace">Try again</a>
    </main>
  </body>
</html>
