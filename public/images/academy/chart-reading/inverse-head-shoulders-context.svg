<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Inverse head and shoulders context</title><desc id="desc">Candlestick chart showing inverse head and shoulders structure with neckline, shoulders, head, volume, and failed-neckline review context.</desc><rect width="960" height="540" fill="#07111f"/><rect x="48" y="40" width="864" height="350" rx="10" fill="#0b1626" stroke="#1b3558"/><g stroke="#19304d"><path d="M80 100H880M80 160H880M80 220H880M80 280H880M80 340H880"/></g><rect x="112" y="142" width="660" height="30" fill="#1f6feb" opacity=".18"/><text x="126" y="132" fill="#9cc7ff" font-family="Arial" font-size="18">Neckline resistance</text><path d="M135 160C205 282 280 250 340 345C410 230 492 238 560 278C620 196 688 160 760 165" fill="none" stroke="#9cc7ff" stroke-width="3"/><text x="210" y="292" fill="#d6e4ff" font-family="Arial" font-size="16">Left shoulder</text><text x="342" y="356" fill="#d6e4ff" font-family="Arial" font-size="16">Head</text><text x="516" y="292" fill="#d6e4ff" font-family="Arial" font-size="16">Right shoulder</text><g stroke-width="3" stroke-linecap="round"><g stroke="#ef4444" fill="#ef4444"><line x1="205" y1="205" x2="205" y2="288"/><rect x="194" y="222" width="22" height="46" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="320" y1="295" x2="320" y2="356"/><rect x="309" y="310" width="22" height="28" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="500" y1="240" x2="500" y2="302"/><rect x="489" y="255" width="22" height="30" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="665" y1="130" x2="665" y2="205"/><rect x="654" y="146" width="22" height="42" rx="2"/></g></g><text x="600" y="254" fill="#d6e4ff" font-family="Arial" font-size="18">Review neckline hold or failure</text><rect x="48" y="414" width="864" height="82" rx="10" fill="#0b1626" stroke="#1b3558"/><g><rect x="197" y="452" width="22" height="31" fill="#ef4444" opacity=".75"/><rect x="312" y="435" width="22" height="48" fill="#22c55e" opacity=".75"/><rect x="492" y="450" width="22" height="33" fill="#22c55e" opacity=".75"/><rect x="657" y="420" width="22" height="63" fill="#22c55e" opacity=".75"/></g><text x="430" y="464" fill="#d6e4ff" font-family="Arial" font-size="19">Structure improves only if the neckline matters.</text></svg>
