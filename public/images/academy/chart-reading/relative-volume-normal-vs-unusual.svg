<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Normal volume compared with unusual relative volume</title>
  <desc id="desc">A dark trading dashboard style chart comparing normal activity with a high relative volume session using candles and volume bars.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Relative volume compares today's activity to normal</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">The same raw share volume can mean different things on different stocks or different days.</text>
  <rect x="70" y="118" width="350" height="306" rx="10" fill="#0a1322" stroke="#213858"/>
  <rect x="480" y="118" width="350" height="306" rx="10" fill="#0a1322" stroke="#213858"/>
