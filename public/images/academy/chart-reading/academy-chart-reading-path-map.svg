<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Academy Chart Reading Path Map</title>
  <desc id="desc">Dark Academy dashboard path map showing realistic red and green candlesticks, support and resistance zones, volume bars, and course steps for chart reading, candles, patterns, volume, and workflow.</desc>
