<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Failed Breakout At Resistance Example</title>
  <desc id="desc">Educational candlestick chart showing a breakout attempt above resistance that fails back below the zone.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Failed Breakout At Resistance</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Example only: a failed hold is a review point, not a prediction.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="158" width="626" height="42" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="158" x2="690" y2="158" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="200" x2="690" y2="200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="522" y="152" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Resistance zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="252" x2="96" y2="316"/>
      <rect x="86" y="270" width="20" height="30" rx="2"/>
      <line x1="162" y1="220" x2="162" y2="290"/>
      <rect x="152" y="240" width="20" height="32" rx="2"/>
      <line x1="228" y1="184" x2="228" y2="262"/>
      <rect x="218" y="204" width="20" height="36" rx="2"/>
      <line x1="294" y1="150" x2="294" y2="238"/>
      <rect x="284" y="172" width="20" height="42" rx="2"/>
      <line x1="360" y1="108" x2="360" y2="206"/>
      <rect x="350" y="132" width="20" height="46" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="426" y1="96" x2="426" y2="226"/>
      <rect x="416" y="126" width="20" height="74" rx="2"/>
      <line x1="492" y1="172" x2="492" y2="278"/>
      <rect x="482" y="196" width="20" height="56" rx="2"/>
      <line x1="558" y1="210" x2="558" y2="300"/>
      <rect x="548" y="232" width="20" height="44" rx="2"/>
      <line x1="624" y1="236" x2="624" y2="316"/>
      <rect x="614" y="254" width="20" height="38" rx="2"/>
    </g>
  </g>
  <path d="M96 296 C152 265 197 236 229 222 C269 203 314 177 361 152 C408 126 443 165 493 249 C530 310 580 278 625 288" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="342" y="96" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">Break attempt</text>
  <text x="422" y="242" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Fails back below resistance</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Volume fades after failed hold</text>
  <g fill="#1d4ed8" opacity=".8">
    <rect x="178" y="390" width="20" height="13"/>
    <rect x="218" y="386" width="20" height="17"/>
    <rect x="258" y="380" width="20" height="23"/>
    <rect x="298" y="371" width="20" height="32"/>
    <rect x="338" y="366" width="20" height="37"/>
    <rect x="378" y="374" width="20" height="29"/>
    <rect x="418" y="385" width="20" height="18"/>
    <rect x="458" y="389" width="20" height="14"/>
    <rect x="498" y="392" width="20" height="11"/>
    <rect x="538" y="390" width="20" height="13"/>
    <rect x="578" y="392" width="20" height="11"/>
  </g>
</svg>
