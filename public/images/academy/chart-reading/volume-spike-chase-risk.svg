<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Volume spike chase risk</title>
  <desc id="desc">A dark trading dashboard style candlestick chart showing a late chase after a volume spike far above nearby support.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Late entries after the first spike can create chase risk</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">The spike can be real while the late entry is still far from structure.</text>
  <line x1="76" y1="118" x2="824" y2="118" stroke="#182943"/>
  <line x1="76" y1="178" x2="824" y2="178" stroke="#182943"/>
  <line x1="76" y1="238" x2="824" y2="238" stroke="#182943"/>
  <line x1="76" y1="298" x2="824" y2="298" stroke="#182943"/>
  <rect x="80" y="246" width="744" height="32" fill="#2563eb" opacity="0.16"/>
  <line x1="80" y1="262" x2="824" y2="262" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="654" y="238" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">nearest structure</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="300" x2="112" y2="262" stroke="#22c55e"/><rect x="101" y="276" width="22" height="16" fill="#22c55e" rx="3"/>
    <line x1="154" y1="280" x2="154" y2="238" stroke="#22c55e"/><rect x="143" y="252" width="22" height="20" fill="#22c55e" rx="3"/>
    <line x1="196" y1="250" x2="196" y2="190" stroke="#22c55e"/><rect x="185" y="208" width="22" height="34" fill="#22c55e" rx="3"/>
    <line x1="238" y1="214" x2="238" y2="154" stroke="#22c55e"/><rect x="227" y="172" width="22" height="34" fill="#22c55e" rx="3"/>
    <line x1="280" y1="184" x2="280" y2="126" stroke="#22c55e"/><rect x="269" y="144" width="22" height="32" fill="#22c55e" rx="3"/>
    <line x1="322" y1="170" x2="322" y2="112" stroke="#ef4444"/><rect x="311" y="132" width="22" height="26" fill="#ef4444" rx="3"/>
    <line x1="364" y1="158" x2="364" y2="98" stroke="#22c55e"/><rect x="353" y="116" width="22" height="32" fill="#22c55e" rx="3"/>
    <line x1="406" y1="146" x2="406" y2="92" stroke="#22c55e"/><rect x="395" y="108" width="22" height="28" fill="#22c55e" rx="3"/>
    <line x1="448" y1="150" x2="448" y2="104" stroke="#ef4444"/><rect x="437" y="120" width="22" height="20" fill="#ef4444" rx="3"/>
    <line x1="490" y1="160" x2="490" y2="118" stroke="#ef4444"/><rect x="479" y="132" width="22" height="18" fill="#ef4444" rx="3"/>
    <line x1="532" y1="174" x2="532" y2="134" stroke="#ef4444"/><rect x="521" y="148" width="22" height="16" fill="#ef4444" rx="3"/>
  </g>
  <rect x="378" y="82" width="128" height="32" rx="16" fill="#2a1b1f" stroke="#fb7185"/>
  <text x="392" y="103" fill="#fecdd3" font-family="Arial, sans-serif" font-size="13">late chase area</text>
  <path d="M442 118 L442 246" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="454" y="214" fill="#fecdd3" font-family="Arial, sans-serif" font-size="14">far from structure</text>
  <line x1="76" y1="330" x2="824" y2="330" stroke="#2a3d5c"/>
  <g>
    <rect x="101" y="412" width="22" height="40" fill="#22c55e" opacity="0.55"/>
    <rect x="143" y="376" width="22" height="76" fill="#22c55e" opacity="0.7"/>
    <rect x="185" y="304" width="22" height="148" fill="#22c55e" opacity="1"/>
    <rect x="227" y="314" width="22" height="138" fill="#22c55e" opacity="0.92"/>
    <rect x="269" y="342" width="22" height="110" fill="#22c55e" opacity="0.76"/>
    <rect x="311" y="372" width="22" height="80" fill="#ef4444" opacity="0.62"/>
