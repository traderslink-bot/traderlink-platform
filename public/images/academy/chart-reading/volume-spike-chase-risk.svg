  <path d="M208 300 C278 318, 386 332, 532 338" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="330" y="316" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">volume fades after first burst</text>
