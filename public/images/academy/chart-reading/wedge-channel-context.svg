<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Wedge and channel pattern context</title><desc id="desc">Candlestick chart showing a rising channel and narrowing wedge with trendline context, volume bars, and educational review labels.</desc><rect width="960" height="540" fill="#07111f"/><rect x="48" y="40" width="864" height="350" rx="10" fill="#0b1626" stroke="#1b3558"/><g stroke="#19304d"><path d="M80 100H880M80 160H880M80 220H880M80 280H880M80 340H880"/></g><path d="M100 315L415 145M100 250L415 80" stroke="#9cc7ff" stroke-width="3"/><path d="M520 300L835 150M520 200L835 155" stroke="#9cc7ff" stroke-width="3"/><text x="120" y="92" fill="#d6e4ff" font-family="Arial" font-size="18">Channel: sloped range</text><text x="585" y="112" fill="#d6e4ff" font-family="Arial" font-size="18">Wedge: narrowing range</text><g stroke-width="3" stroke-linecap="round"><g stroke="#22c55e" fill="#22c55e"><line x1="140" y1="270" x2="140" y2="328"/><rect x="129" y="286" width="22" height="30" rx="2"/></g><g stroke="#ef4444" fill="#ef4444"><line x1="195" y1="212" x2="195" y2="280"/><rect x="184" y="228" width="22" height="34" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="250" y1="200" x2="250" y2="260"/><rect x="239" y="214" width="22" height="32" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="305" y1="145" x2="305" y2="224"/><rect x="294" y="160" width="22" height="48" rx="2"/></g><g stroke="#ef4444" fill="#ef4444"><line x1="360" y1="120" x2="360" y2="200"/><rect x="349" y="136" width="22" height="44" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="565" y1="240" x2="565" y2="306"/><rect x="554" y="254" width="22" height="36" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="625" y1="205" x2="625" y2="270"/><rect x="614" y="220" width="22" height="34" rx="2"/></g><g stroke="#ef4444" fill="#ef4444"><line x1="685" y1="182" x2="685" y2="238"/><rect x="674" y="195" width="22" height="28" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="745" y1="168" x2="745" y2="215"/><rect x="734" y="178" width="22" height="24" rx="2"/></g></g><text x="512" y="340" fill="#d6e4ff" font-family="Arial" font-size="18">Review compression, break, and failed break</text><rect x="48" y="414" width="864" height="82" rx="10" fill="#0b1626" stroke="#1b3558"/><g><rect x="132" y="462" width="22" height="21" fill="#22c55e" opacity=".75"/><rect x="187" y="450" width="22" height="33" fill="#ef4444" opacity=".75"/><rect x="297" y="431" width="22" height="52" fill="#22c55e" opacity=".75"/><rect x="557" y="456" width="22" height="27" fill="#22c55e" opacity=".75"/><rect x="617" y="464" width="22" height="19" fill="#22c55e" opacity=".75"/><rect x="677" y="470" width="22" height="13" fill="#ef4444" opacity=".75"/></g><text x="470" y="464" fill="#d6e4ff" font-family="Arial" font-size="19">Trendlines should clarify structure, not force it.</text></svg>
