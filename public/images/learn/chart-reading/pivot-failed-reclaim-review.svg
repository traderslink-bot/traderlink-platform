<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Pivot Failed Reclaim Review</title>
  <desc id="desc">Educational candlestick chart showing a failed reclaim and rejection around a pivot level zone with volume context.</desc>
