  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="812" y="132" width="88" height="220" rx="10" fill="#0b2035" stroke="#204d73"/>
    <text x="830" y="162" fill="#e6edf7" font-weight="700">Check</text>
    <text x="830" y="195" fill="#a7b6c8">Event?</text>
    <text x="830" y="225" fill="#a7b6c8">Size?</text>
    <text x="830" y="255" fill="#a7b6c8">Gap?</text>
    <text x="830" y="285" fill="#a7b6c8">Level?</text>
    <text x="830" y="315" fill="#a7b6c8">Thesis?</text>
  </g>
