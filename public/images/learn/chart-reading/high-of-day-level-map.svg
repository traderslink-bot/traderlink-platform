<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">High Of Day Level Map</title>
  <desc id="desc">Educational candlestick chart showing high of day as an intraday reference level with nearby premarket high and previous day high context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="318" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">High Of Day Level Map</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">HOD is reviewed with PMH, PDH, volume, and distance from support.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="116" x2="704" y2="116"/><line x1="58" y1="166" x2="704" y2="166"/><line x1="58" y1="216" x2="704" y2="216"/><line x1="58" y1="266" x2="704" y2="266"/>
  </g>
  <rect x="70" y="128" width="620" height="34" fill="#1d4ed8" opacity=".18"/>
  <line x1="70" y1="128" x2="690" y2="128" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="70" y1="162" x2="690" y2="162" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="70" y1="186" x2="690" y2="186" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 7" opacity=".8"/>
  <line x1="70" y1="112" x2="690" y2="112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7" opacity=".75"/>
  <text x="82" y="122" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Current HOD zone</text>
  <text x="558" y="106" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">PDH nearby</text>
  <text x="548" y="202" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12">PMH below</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="260" x2="96" y2="320"/><rect x="86" y="278" width="20" height="26" rx="2"/>
      <line x1="150" y1="218" x2="150" y2="288"/><rect x="140" y="238" width="20" height="32" rx="2"/>
      <line x1="204" y1="190" x2="204" y2="262"/><rect x="194" y="210" width="20" height="34" rx="2"/>
      <line x1="258" y1="152" x2="258" y2="226"/><rect x="248" y="172" width="20" height="34" rx="2"/>
      <line x1="312" y1="136" x2="312" y2="208"/><rect x="302" y="156" width="20" height="32" rx="2"/>
      <line x1="420" y1="154" x2="420" y2="224"/><rect x="410" y="174" width="20" height="32" rx="2"/>
      <line x1="528" y1="128" x2="528" y2="198"/><rect x="518" y="148" width="20" height="32" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="366" y1="130" x2="366" y2="214"/><rect x="356" y="152" width="20" height="42" rx="2"/>
      <line x1="474" y1="126" x2="474" y2="212"/><rect x="464" y="148" width="20" height="44" rx="2"/>
      <line x1="582" y1="122" x2="582" y2="214"/><rect x="572" y="146" width="20" height="46" rx="2"/>
    </g>
  </g>
  <path d="M96 304 L150 254 L204 228 L258 190 L312 172 L366 194 L420 190 L474 192 L528 164 L582 192" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".5"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="238" y="118" fill="#bbf7d0">HOD test</text>
    <text x="396" y="248" fill="#bbf7d0">Higher lows below level</text>
    <text x="552" y="244" fill="#fecaca">Rejection risk</text>
  </g>
  <g>
    <rect x="70" y="326" width="14" height="18" fill="#21c784" opacity=".7"/><rect x="96" y="318" width="14" height="26" fill="#21c784" opacity=".8"/><rect x="122" y="330" width="14" height="14" fill="#ef4444" opacity=".65"/><rect x="148" y="308" width="14" height="36" fill="#21c784" opacity=".86"/><rect x="174" y="302" width="14" height="42" fill="#21c784" opacity=".9"/><rect x="200" y="318" width="14" height="26" fill="#ef4444" opacity=".7"/><rect x="226" y="296" width="14" height="48" fill="#21c784" opacity=".95"/><rect x="252" y="304" width="14" height="40" fill="#21c784" opacity=".88"/><rect x="278" y="316" width="14" height="28" fill="#ef4444" opacity=".72"/><rect x="304" y="300" width="14" height="44" fill="#21c784" opacity=".9"/><rect x="330" y="312" width="14" height="32" fill="#21c784" opacity=".78"/><rect x="356" y="320" width="14" height="24" fill="#ef4444" opacity=".7"/><rect x="382" y="306" width="14" height="38" fill="#21c784" opacity=".85"/>
  </g>
  <rect x="28" y="362" width="704" height="50" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="385" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Review: did price build structure under HOD, or was the move already extended?</text>
  <text x="44" y="404" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">HOD is a reference level, not a trade instruction.</text>
</svg>
