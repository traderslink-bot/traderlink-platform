<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">New High Of Day Hold Versus Fail</title>
  <desc id="desc">Educational candlestick chart comparing a new high of day that holds with one that fails back below the old high.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="318" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">NHOD: Hold Versus Fail</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A new high is an attempt. Review whether price holds above old HOD.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="116" x2="704" y2="116"/><line x1="58" y1="166" x2="704" y2="166"/><line x1="58" y1="216" x2="704" y2="216"/><line x1="58" y1="266" x2="704" y2="266"/>
  </g>
  <rect x="70" y="166" width="620" height="34" fill="#1d4ed8" opacity=".18"/>
  <line x1="70" y1="166" x2="690" y2="166" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="70" y1="200" x2="690" y2="200" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="82" y="158" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Old HOD zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="260" x2="96" y2="318"/><rect x="86" y="278" width="20" height="26" rx="2"/>
      <line x1="150" y1="222" x2="150" y2="292"/><rect x="140" y="242" width="20" height="32" rx="2"/>
      <line x1="204" y1="190" x2="204" y2="260"/><rect x="194" y="210" width="20" height="32" rx="2"/>
      <line x1="258" y1="160" x2="258" y2="234"/><rect x="248" y="180" width="20" height="34" rx="2"/>
      <line x1="312" y1="122" x2="312" y2="200"/><rect x="302" y="142" width="20" height="38" rx="2"/>
      <line x1="420" y1="158" x2="420" y2="232"/><rect x="410" y="178" width="20" height="34" rx="2"/>
      <line x1="528" y1="128" x2="528" y2="204"/><rect x="518" y="148" width="20" height="36" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="366" y1="124" x2="366" y2="222"/><rect x="356" y="150" width="20" height="52" rx="2"/>
      <line x1="474" y1="126" x2="474" y2="218"/><rect x="464" y="150" width="20" height="48" rx="2"/>
      <line x1="582" y1="132" x2="582" y2="224"/><rect x="572" y="156" width="20" height="48" rx="2"/>
    </g>
  </g>
  <path d="M96 304 L150 258 L204 226 L258 196 L312 160 L366 202 L420 196 L474 198 L528 168 L582 204" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".5"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="274" y="112" fill="#bbf7d0">NHOD attempt</text>
    <text x="392" y="254" fill="#fecaca">Fail review</text>
    <text x="510" y="118" fill="#bbf7d0">Hold review</text>
  </g>
  <g>
    <rect x="70" y="326" width="14" height="18" fill="#21c784" opacity=".7"/><rect x="96" y="318" width="14" height="26" fill="#21c784" opacity=".8"/><rect x="122" y="330" width="14" height="14" fill="#ef4444" opacity=".65"/><rect x="148" y="308" width="14" height="36" fill="#21c784" opacity=".86"/><rect x="174" y="300" width="14" height="44" fill="#21c784" opacity=".92"/><rect x="200" y="316" width="14" height="28" fill="#ef4444" opacity=".72"/><rect x="226" y="292" width="14" height="52" fill="#21c784" opacity=".96"/><rect x="252" y="300" width="14" height="44" fill="#21c784" opacity=".9"/><rect x="278" y="312" width="14" height="32" fill="#ef4444" opacity=".72"/><rect x="304" y="296" width="14" height="48" fill="#21c784" opacity=".95"/>
  </g>
  <rect x="28" y="362" width="704" height="50" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="385" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Review: did the new high hold above old HOD, or did it fail back below?</text>
  <text x="44" y="404" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">The alert starts the review; it does not replace the plan.</text>
</svg>
