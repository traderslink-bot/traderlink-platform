<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">RVOL time of day comparison</title>
  <desc id="desc">A dark trading dashboard style chart comparing a normal time-of-day volume baseline with today's much higher volume activity.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">RVOL compares today with a normal baseline</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Time-of-day comparison asks whether activity is unusual by this point in the session.</text>
  <line x1="78" y1="118" x2="824" y2="118" stroke="#182943"/>
  <line x1="78" y1="178" x2="824" y2="178" stroke="#182943"/>
  <line x1="78" y1="238" x2="824" y2="238" stroke="#182943"/>
  <line x1="78" y1="298" x2="824" y2="298" stroke="#182943"/>
  <rect x="96" y="130" width="156" height="42" rx="10" fill="#0a1322" stroke="#213858"/>
  <text x="114" y="156" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">10:30 AM comparison</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="286" x2="112" y2="252" stroke="#22c55e"/><rect x="101" y="264" width="22" height="16" fill="#22c55e" rx="3"/>
    <line x1="154" y1="268" x2="154" y2="232" stroke="#22c55e"/><rect x="143" y="244" width="22" height="18" fill="#22c55e" rx="3"/>
    <line x1="196" y1="250" x2="196" y2="212" stroke="#22c55e"/><rect x="185" y="226" width="22" height="18" fill="#22c55e" rx="3"/>
    <line x1="238" y1="230" x2="238" y2="184" stroke="#22c55e"/><rect x="227" y="200" width="22" height="22" fill="#22c55e" rx="3"/>
    <line x1="280" y1="208" x2="280" y2="158" stroke="#22c55e"/><rect x="269" y="174" width="22" height="24" fill="#22c55e" rx="3"/>
    <line x1="322" y1="190" x2="322" y2="138" stroke="#ef4444"/><rect x="311" y="154" width="22" height="24" fill="#ef4444" rx="3"/>
    <line x1="364" y1="184" x2="364" y2="132" stroke="#22c55e"/><rect x="353" y="148" width="22" height="24" fill="#22c55e" rx="3"/>
    <line x1="406" y1="172" x2="406" y2="118" stroke="#22c55e"/><rect x="395" y="134" width="22" height="28" fill="#22c55e" rx="3"/>
  </g>
  <line x1="78" y1="330" x2="824" y2="330" stroke="#2a3d5c"/>
  <text x="78" y="350" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">volume by 10:30 AM</text>
  <rect x="120" y="396" width="92" height="56" fill="#64748b" opacity="0.7" rx="5"/>
  <rect x="258" y="300" width="92" height="152" fill="#22c55e" opacity="0.95" rx="5"/>
  <text x="122" y="382" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">normal</text>
  <text x="258" y="286" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">today</text>
  <path d="M212 424 C236 408, 244 360, 258 326" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="390" y="384" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">RVOL is high</text>
  <text x="390" y="410" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Current volume is far above the usual time-of-day baseline.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>
