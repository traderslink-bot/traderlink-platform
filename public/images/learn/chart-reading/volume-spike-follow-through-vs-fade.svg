    <line x1="344" y1="176" x2="344" y2="118" stroke="#22c55e"/><rect x="334" y="134" width="20" height="34" fill="#22c55e" rx="3"/>
    <line x1="526" y1="278" x2="526" y2="244" stroke="#22c55e"/><rect x="516" y="256" width="20" height="16" fill="#22c55e" rx="3"/>
    <line x1="564" y1="250" x2="564" y2="190" stroke="#22c55e"/><rect x="554" y="208" width="20" height="32" fill="#22c55e" rx="3"/>
    <line x1="602" y1="198" x2="602" y2="138" stroke="#22c55e"/><rect x="592" y="156" width="20" height="32" fill="#22c55e" rx="3"/>
