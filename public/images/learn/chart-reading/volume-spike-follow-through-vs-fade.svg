<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Volume spike follow-through versus fade</title>
  <desc id="desc">A dark trading dashboard style chart comparing a volume spike with follow-through and a volume spike that fades after the first burst.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">A spike needs follow-through review</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">The first burst can continue or fade; neither outcome is guaranteed.</text>
  <rect x="70" y="116" width="350" height="332" rx="10" fill="#0a1322" stroke="#213858"/>
  <rect x="480" y="116" width="350" height="332" rx="10" fill="#0a1322" stroke="#213858"/>
  <text x="94" y="146" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Spike with follow-through</text>
  <text x="504" y="146" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Spike that fades</text>
