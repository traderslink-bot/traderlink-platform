  <line x1="94" y1="246" x2="396" y2="246" stroke="#182943"/>
  <line x1="504" y1="190" x2="806" y2="190" stroke="#182943"/>
  <line x1="504" y1="246" x2="806" y2="246" stroke="#182943"/>
