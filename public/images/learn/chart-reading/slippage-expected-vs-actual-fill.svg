<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Expected price versus actual fill</title>
  <desc id="desc">A dark trading dashboard style chart showing the expected entry price and the actual fill price after slippage.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Slippage is the gap between expected and actual fill</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Execution review uses the real fill, not the ideal chart price.</text>
  <line x1="76" y1="128" x2="604" y2="128" stroke="#182943"/>
  <line x1="76" y1="188" x2="604" y2="188" stroke="#182943"/>
  <line x1="76" y1="248" x2="604" y2="248" stroke="#182943"/>
  <line x1="76" y1="308" x2="604" y2="308" stroke="#182943"/>
  <line x1="76" y1="242" x2="604" y2="242" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="430" y="234" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">expected $2.00</text>
  <line x1="76" y1="174" x2="604" y2="174" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="430" y="166" fill="#fecdd3" font-family="Arial, sans-serif" font-size="14">actual fill $2.08</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="292" x2="112" y2="248" stroke="#22c55e"/><rect x="101" y="264" width="22" height="20" fill="#22c55e" rx="3"/>
    <line x1="154" y1="270" x2="154" y2="220" stroke="#22c55e"/><rect x="143" y="238" width="22" height="22" fill="#22c55e" rx="3"/>
    <line x1="196" y1="246" x2="196" y2="188" stroke="#22c55e"/><rect x="185" y="208" width="22" height="28" fill="#22c55e" rx="3"/>
    <line x1="238" y1="214" x2="238" y2="152" stroke="#22c55e"/><rect x="227" y="172" width="22" height="32" fill="#22c55e" rx="3"/>
    <line x1="280" y1="190" x2="280" y2="132" stroke="#ef4444"/><rect x="269" y="152" width="22" height="26" fill="#ef4444" rx="3"/>
    <line x1="322" y1="184" x2="322" y2="126" stroke="#22c55e"/><rect x="311" y="144" width="22" height="28" fill="#22c55e" rx="3"/>
  </g>
  <line x1="76" y1="340" x2="604" y2="340" stroke="#2a3d5c"/>
  <g>
    <rect x="101" y="416" width="22" height="42" fill="#22c55e" opacity="0.6"/>
    <rect x="143" y="380" width="22" height="78" fill="#22c55e" opacity="0.74"/>
    <rect x="185" y="330" width="22" height="128" fill="#22c55e" opacity="0.95"/>
    <rect x="227" y="312" width="22" height="146" fill="#22c55e" opacity="1"/>
    <rect x="269" y="370" width="22" height="88" fill="#ef4444" opacity="0.68"/>
    <rect x="311" y="352" width="22" height="106" fill="#22c55e" opacity="0.78"/>
  </g>
  <rect x="642" y="144" width="182" height="184" rx="12" fill="#0a1322" stroke="#213858"/>
  <text x="666" y="178" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Fill review</text>
  <text x="666" y="214" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="14">Expected: $2.00</text>
  <text x="666" y="244" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="14">Filled: $2.08</text>
  <text x="666" y="274" fill="#fb7185" font-family="Arial, sans-serif" font-size="14">Slippage: $0.08</text>
  <text x="666" y="304" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">risk changed</text>
</svg>
