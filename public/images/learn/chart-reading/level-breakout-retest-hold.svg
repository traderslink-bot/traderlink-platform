<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Level Breakout Retest Hold Example</title>
  <desc id="desc">Educational candlestick chart showing price breaking above a level, retesting it, and holding above the zone.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Breakout Retest And Hold</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Example only: review whether old resistance holds as support.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="206" width="626" height="38" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="206" x2="690" y2="206" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="244" x2="690" y2="244" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="482" y="200" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Old resistance / retest zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="254" x2="96" y2="312"/>
      <rect x="86" y="272" width="20" height="26" rx="2"/>
      <line x1="162" y1="232" x2="162" y2="292"/>
      <rect x="152" y="248" width="20" height="28" rx="2"/>
      <line x1="228" y1="204" x2="228" y2="270"/>
      <rect x="218" y="222" width="20" height="30" rx="2"/>
      <line x1="294" y1="152" x2="294" y2="240"/>
      <rect x="284" y="172" width="20" height="48" rx="2"/>
      <line x1="426" y1="182" x2="426" y2="256"/>
      <rect x="416" y="202" width="20" height="34" rx="2"/>
      <line x1="492" y1="146" x2="492" y2="232"/>
      <rect x="482" y="166" width="20" height="44" rx="2"/>
      <line x1="558" y1="118" x2="558" y2="204"/>
      <rect x="548" y="138" width="20" height="42" rx="2"/>
      <line x1="624" y1="98" x2="624" y2="184"/>
      <rect x="614" y="116" width="20" height="42" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="360" y1="130" x2="360" y2="238"/>
      <rect x="350" y="154" width="20" height="62" rx="2"/>
    </g>
  </g>
  <path d="M96 298 C153 269 199 238 229 236 C274 233 312 178 361 212 C399 238 435 230 493 188 C534 158 579 135 625 142" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="268" y="140" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">Break above level</text>
  <text x="382" y="270" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Retest holds above zone</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Review: level -> break -> retest -> hold or failure</text>
</svg>
