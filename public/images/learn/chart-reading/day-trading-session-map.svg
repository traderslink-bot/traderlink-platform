<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Day Trading Session Workflow Map</title>
  <desc id="desc">Dark trading dashboard chart showing premarket, market open, midday, power hour, and after-hours sections with realistic red and green candlesticks and volume bars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <style>
      .panel{fill:url(#bg);stroke:#1e3354;stroke-width:1.5}
      .grid{stroke:#22324a;stroke-width:1;opacity:.7}
      .axis{stroke:#4b5f7d;stroke-width:1.2}
      .txt{fill:#d7e3f4;font-family:Arial,Helvetica,sans-serif}
      .small{font-size:12px}
      .label{font-size:13px;font-weight:700}
      .muted{fill:#8ea1bd}
      .blue{stroke:#38bdf8;fill:rgba(56,189,248,.12)}
      .zone{fill:rgba(56,189,248,.12);stroke:#38bdf8;stroke-width:1.5}
      .green{fill:#22c55e;stroke:#22c55e}
      .red{fill:#ef4444;stroke:#ef4444}
      .wickG{stroke:#22c55e;stroke-width:2}
      .wickR{stroke:#ef4444;stroke-width:2}
      .volG{fill:#22c55e;opacity:.45}
      .volR{fill:#ef4444;opacity:.45}
      .divider{stroke:#38bdf8;stroke-width:1.5;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect class="panel" x="14" y="14" width="732" height="402" rx="8"/>
  <text class="txt label" x="34" y="42">Day Trading Workflow: Prepare, Observe, Execute, Review</text>
  <text class="txt small muted" x="34" y="64">Session labels organize review. They are not trade instructions.</text>
  <g transform="translate(56 92)">
    <rect x="0" y="0" width="650" height="234" fill="#0d1728" stroke="#20344f"/>
    <g>
      <line class="grid" x1="0" y1="45" x2="650" y2="45"/>
      <line class="grid" x1="0" y1="90" x2="650" y2="90"/>
      <line class="grid" x1="0" y1="135" x2="650" y2="135"/>
      <line class="grid" x1="0" y1="180" x2="650" y2="180"/>
      <line class="axis" x1="0" y1="234" x2="650" y2="234"/>
    </g>
    <rect class="zone" x="42" y="80" width="188" height="64"/>
    <text class="txt small" x="50" y="100">Key levels mapped</text>
    <line class="divider" x1="130" y1="0" x2="130" y2="234"/>
    <line class="divider" x1="248" y1="0" x2="248" y2="234"/>
    <line class="divider" x1="426" y1="0" x2="426" y2="234"/>
    <line class="divider" x1="548" y1="0" x2="548" y2="234"/>
    <g>
      <line class="wickG" x1="28" y1="132" x2="28" y2="158"/><rect class="green" x="21" y="140" width="14" height="12"/>
      <line class="wickR" x1="54" y1="116" x2="54" y2="152"/><rect class="red" x="47" y="124" width="14" height="20"/>
      <line class="wickG" x1="80" y1="105" x2="80" y2="144"/><rect class="green" x="73" y="116" width="14" height="18"/>
      <line class="wickG" x1="106" y1="88" x2="106" y2="135"/><rect class="green" x="99" y="100" width="14" height="26"/>
      <line class="wickR" x1="144" y1="58" x2="144" y2="151"/><rect class="red" x="136" y="74" width="16" height="58"/>
      <line class="wickG" x1="174" y1="62" x2="174" y2="138"/><rect class="green" x="166" y="88" width="16" height="34"/>
      <line class="wickR" x1="204" y1="78" x2="204" y2="162"/><rect class="red" x="196" y="96" width="16" height="44"/>
      <line class="wickG" x1="234" y1="82" x2="234" y2="146"/><rect class="green" x="226" y="104" width="16" height="24"/>
      <line class="wickR" x1="272" y1="96" x2="272" y2="140"/><rect class="red" x="265" y="108" width="14" height="20"/>
      <line class="wickG" x1="302" y1="103" x2="302" y2="136"/><rect class="green" x="295" y="112" width="14" height="12"/>
      <line class="wickR" x1="332" y1="101" x2="332" y2="137"/><rect class="red" x="325" y="114" width="14" height="10"/>
      <line class="wickG" x1="362" y1="96" x2="362" y2="133"/><rect class="green" x="355" y="110" width="14" height="10"/>
      <line class="wickR" x1="392" y1="101" x2="392" y2="141"/><rect class="red" x="385" y="112" width="14" height="18"/>
      <line class="wickG" x1="440" y1="90" x2="440" y2="136"/><rect class="green" x="432" y="106" width="16" height="20"/>
      <line class="wickG" x1="472" y1="74" x2="472" y2="128"/><rect class="green" x="464" y="88" width="16" height="28"/>
      <line class="wickR" x1="504" y1="66" x2="504" y2="134"/><rect class="red" x="496" y="84" width="16" height="36"/>
      <line class="wickG" x1="536" y1="58" x2="536" y2="120"/><rect class="green" x="528" y="82" width="16" height="22"/>
      <line class="wickR" x1="572" y1="84" x2="572" y2="138"/><rect class="red" x="565" y="98" width="14" height="24"/>
      <line class="wickG" x1="602" y1="92" x2="602" y2="128"/><rect class="green" x="595" y="104" width="14" height="12"/>
      <line class="wickR" x1="632" y1="100" x2="632" y2="142"/><rect class="red" x="625" y="112" width="14" height="18"/>
    </g>
    <g transform="translate(0 250)">
      <rect class="volG" x="21" y="30" width="14" height="18"/><rect class="volR" x="47" y="22" width="14" height="26"/><rect class="volG" x="73" y="24" width="14" height="24"/><rect class="volG" x="99" y="14" width="14" height="34"/>
      <rect class="volR" x="136" y="0" width="16" height="48"/><rect class="volG" x="166" y="6" width="16" height="42"/><rect class="volR" x="196" y="8" width="16" height="40"/><rect class="volG" x="226" y="16" width="16" height="32"/>
      <rect class="volR" x="265" y="32" width="14" height="16"/><rect class="volG" x="295" y="34" width="14" height="14"/><rect class="volR" x="325" y="36" width="14" height="12"/><rect class="volG" x="355" y="35" width="14" height="13"/><rect class="volR" x="385" y="33" width="14" height="15"/>
      <rect class="volG" x="432" y="20" width="16" height="28"/><rect class="volG" x="464" y="12" width="16" height="36"/><rect class="volR" x="496" y="15" width="16" height="33"/><rect class="volG" x="528" y="10" width="16" height="38"/>
      <rect class="volR" x="565" y="28" width="14" height="20"/><rect class="volG" x="595" y="36" width="14" height="12"/><rect class="volR" x="625" y="34" width="14" height="14"/>
    </g>
  </g>
  <g class="txt small">
    <text x="70" y="384">Premarket: plan</text>
    <text x="188" y="384">Open: observe</text>
    <text x="316" y="384">Midday: filter</text>
    <text x="487" y="384">Power hour: reassess</text>
    <text x="612" y="384">After-hours: review risk</text>
  </g>
</svg>
