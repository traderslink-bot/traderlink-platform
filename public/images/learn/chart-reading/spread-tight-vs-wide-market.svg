<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Tight spread versus wide spread</title>
  <desc id="desc">A dark trading dashboard style comparison showing a tight bid ask spread and a wide bid ask spread beside realistic candles and volume.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Spread changes the real execution picture</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">The last price is not the same as the current bid and ask.</text>
  <rect x="70" y="122" width="350" height="318" rx="10" fill="#0a1322" stroke="#213858"/>
  <rect x="480" y="122" width="350" height="318" rx="10" fill="#0a1322" stroke="#213858"/>
  <text x="96" y="154" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Tight spread</text>
  <text x="506" y="154" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Wide spread</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="96" y="184" width="112" height="36" rx="8" fill="#0f2f25" stroke="#22c55e" opacity="0.9"/>
    <rect x="224" y="184" width="112" height="36" rx="8" fill="#33171f" stroke="#ef4444" opacity="0.9"/>
    <text x="116" y="207" fill="#bbf7d0">Bid $2.00</text>
    <text x="244" y="207" fill="#fecdd3">Ask $2.01</text>
    <text x="144" y="246" fill="#38bdf8">Spread: $0.01</text>
    <rect x="506" y="184" width="112" height="36" rx="8" fill="#0f2f25" stroke="#22c55e" opacity="0.9"/>
    <rect x="660" y="184" width="112" height="36" rx="8" fill="#33171f" stroke="#ef4444" opacity="0.9"/>
    <text x="526" y="207" fill="#bbf7d0">Bid $1.96</text>
    <text x="680" y="207" fill="#fecdd3">Ask $2.05</text>
    <text x="554" y="246" fill="#38bdf8">Spread: $0.09</text>
  </g>
  <line x1="96" y1="284" x2="340" y2="284" stroke="#2a3d5c"/>
  <line x1="506" y1="284" x2="750" y2="284" stroke="#2a3d5c"/>
  <g>
    <rect x="110" y="352" width="22" height="48" fill="#22c55e" opacity="0.68"/>
    <rect x="150" y="344" width="22" height="56" fill="#ef4444" opacity="0.64"/>
    <rect x="190" y="334" width="22" height="66" fill="#22c55e" opacity="0.74"/>
    <rect x="230" y="326" width="22" height="74" fill="#22c55e" opacity="0.8"/>
    <rect x="270" y="336" width="22" height="64" fill="#ef4444" opacity="0.66"/>
    <rect x="520" y="370" width="22" height="30" fill="#22c55e" opacity="0.5"/>
    <rect x="560" y="320" width="22" height="80" fill="#22c55e" opacity="0.82"/>
    <rect x="600" y="384" width="22" height="16" fill="#ef4444" opacity="0.44"/>
    <rect x="640" y="360" width="22" height="40" fill="#ef4444" opacity="0.54"/>
    <rect x="680" y="390" width="22" height="10" fill="#22c55e" opacity="0.42"/>
  </g>
  <text x="96" y="424" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">execution is closer to quote</text>
  <text x="506" y="424" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">execution cost is larger</text>
</svg>
