<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.0 0.0 760.0 540.0" role="img" aria-labelledby="title desc">
  <title id="title">Support Level Holding Example</title>
  <desc id="desc">Educational candlestick chart showing price testing a support zone and holding above it with volume context.</desc>
  <rect width="760" height="540.0" rx="18" fill="#07111f" />
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554" />
