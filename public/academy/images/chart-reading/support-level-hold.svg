<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Support Level Holding Example</title>
  <desc id="desc">Educational candlestick chart showing price testing a support zone and holding above it with volume context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Support Level Hold</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Example only: support is a zone, not an automatic bounce.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="244" width="626" height="44" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="244" x2="690" y2="244" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="288" x2="690" y2="288" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="542" y="238" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Support zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="202" x2="96" y2="278"/>
      <rect x="86" y="220" width="20" height="42" rx="2"/>
      <line x1="162" y1="174" x2="162" y2="264"/>
      <rect x="152" y="190" width="20" height="48" rx="2"/>
      <line x1="294" y1="196" x2="294" y2="282"/>
      <rect x="284" y="222" width="20" height="38" rx="2"/>
      <line x1="360" y1="160" x2="360" y2="264"/>
      <rect x="350" y="180" width="20" height="54" rx="2"/>
      <line x1="492" y1="190" x2="492" y2="276"/>
      <rect x="482" y="216" width="20" height="40" rx="2"/>
      <line x1="558" y1="148" x2="558" y2="252"/>
      <rect x="548" y="170" width="20" height="58" rx="2"/>
      <line x1="624" y1="132" x2="624" y2="230"/>
      <rect x="614" y="152" width="20" height="50" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="129" y1="154" x2="129" y2="252"/>
      <rect x="119" y="172" width="20" height="52" rx="2"/>
      <line x1="228" y1="158" x2="228" y2="274"/>
      <rect x="218" y="184" width="20" height="66" rx="2"/>
      <line x1="426" y1="148" x2="426" y2="268"/>
      <rect x="416" y="176" width="20" height="64" rx="2"/>
    </g>
  </g>
  <path d="M92 265 C148 218 196 185 232 250 C265 302 313 267 361 231 C407 198 444 237 493 255 C535 270 566 201 625 182" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="80" y="318" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Repeated tests near the zone</text>
  <text x="430" y="138" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Price holds above support</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Volume context</text>
  <g fill="#1d4ed8" opacity=".8">
    <rect x="158" y="392" width="20" height="11"/>
    <rect x="198" y="386" width="20" height="17"/>
    <rect x="238" y="380" width="20" height="23"/>
    <rect x="278" y="389" width="20" height="14"/>
    <rect x="318" y="383" width="20" height="20"/>
    <rect x="358" y="376" width="20" height="27"/>
    <rect x="398" y="390" width="20" height="13"/>
    <rect x="438" y="385" width="20" height="18"/>
    <rect x="478" y="379" width="20" height="24"/>
    <rect x="518" y="382" width="20" height="21"/>
    <rect x="558" y="374" width="20" height="29"/>
    <rect x="598" y="386" width="20" height="17"/>
  </g>
</svg>
