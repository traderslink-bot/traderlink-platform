<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Press release anatomy review</title>
  <desc id="desc">Dark dashboard showing a company press release with headline, timestamp, source, key details, risk language, and filing check beside a small candlestick chart.</desc>
  <rect width="960" height="560" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="904" height="504" rx="14" fill="#0b1628" stroke="#1d3557"/>
  <text x="52" y="66" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Press Release Anatomy</text>
  <text x="52" y="92" fill="#8fa7c8" font-family="Arial, sans-serif" font-size="14">Context the release details before relying on the first chart reaction.</text>

  <rect x="52" y="120" width="520" height="370" rx="10" fill="#081323" stroke="#172a46"/>
  <rect x="78" y="148" width="468" height="54" rx="8" fill="#10233c" stroke="#2d8cff"/>
  <text x="96" y="171" fill="#7bb4ff" font-family="Arial, sans-serif" font-size="12" font-weight="700">OFFICIAL COMPANY RELEASE</text>
  <text x="96" y="192" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Company announces strategic update</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="96" y="238" fill="#8fa7c8">Timestamp</text>
    <text x="258" y="238" fill="#e6f0ff">7:05 AM ET</text>
    <text x="96" y="274" fill="#8fa7c8">Source</text>
    <text x="258" y="274" fill="#e6f0ff">Company newsroom</text>
    <text x="96" y="310" fill="#8fa7c8">Key details</text>
    <text x="258" y="310" fill="#e6f0ff">Names, dates, terms</text>
    <text x="96" y="346" fill="#8fa7c8">Risk language</text>
    <text x="258" y="346" fill="#f5c26b">Forward-looking / financing</text>
    <text x="96" y="382" fill="#8fa7c8">Filing check</text>
    <text x="258" y="382" fill="#7bb4ff">8-K or offering context</text>
    <text x="96" y="418" fill="#8fa7c8">Market reaction</text>
    <text x="258" y="418" fill="#e6f0ff">Volume, levels, spread</text>
  </g>
  <rect x="78" y="442" width="468" height="28" rx="6" fill="#0d213a" stroke="#1d3557"/>
  <text x="96" y="461" fill="#8fa7c8" font-family="Arial, sans-serif" font-size="12">Context what is missing, not only what is emphasized.</text>

  <rect x="604" y="120" width="304" height="254" rx="10" fill="#081323" stroke="#172a46"/>
  <g stroke="#172a46" stroke-width="1">
    <line x1="628" y1="164" x2="884" y2="164"/>
    <line x1="628" y1="206" x2="884" y2="206"/>
    <line x1="628" y1="248" x2="884" y2="248"/>
    <line x1="628" y1="290" x2="884" y2="290"/>
    <line x1="628" y1="332" x2="884" y2="332"/>
  </g>
  <g stroke-linecap="round" stroke-width="3">
    <line x1="646" y1="304" x2="646" y2="338" stroke="#26c281"/><rect x="637" y="316" width="18" height="14" rx="2" fill="#26c281"/>
    <line x1="678" y1="294" x2="678" y2="332" stroke="#ef5350"/><rect x="669" y="304" width="18" height="20" rx="2" fill="#ef5350"/>
    <line x1="710" y1="266" x2="710" y2="318" stroke="#26c281"/><rect x="701" y="282" width="18" height="24" rx="2" fill="#26c281"/>
    <line x1="742" y1="222" x2="742" y2="292" stroke="#26c281"/><rect x="733" y="240" width="18" height="38" rx="2" fill="#26c281"/>
    <line x1="774" y1="192" x2="774" y2="280" stroke="#ef5350"/><rect x="765" y="214" width="18" height="50" rx="2" fill="#ef5350"/>
    <line x1="806" y1="210" x2="806" y2="296" stroke="#26c281"/><rect x="797" y="232" width="18" height="42" rx="2" fill="#26c281"/>
    <line x1="838" y1="232" x2="838" y2="310" stroke="#ef5350"/><rect x="829" y="250" width="18" height="40" rx="2" fill="#ef5350"/>
  </g>
  <rect x="604" y="388" width="304" height="102" rx="10" fill="#081323" stroke="#172a46"/>
  <text x="628" y="414" fill="#6f86a7" font-family="Arial, sans-serif" font-size="12">Volume after release</text>
  <g>
    <rect x="637" y="466" width="18" height="10" fill="#26c281" opacity=".55"/>
    <rect x="669" y="462" width="18" height="14" fill="#ef5350" opacity=".6"/>
    <rect x="701" y="448" width="18" height="28" fill="#26c281" opacity=".75"/>
    <rect x="733" y="414" width="18" height="62" fill="#26c281"/>
    <rect x="765" y="426" width="18" height="50" fill="#ef5350" opacity=".85"/>
    <rect x="797" y="440" width="18" height="36" fill="#26c281" opacity=".72"/>
    <rect x="829" y="456" width="18" height="20" fill="#ef5350" opacity=".65"/>
  </g>
</svg>
