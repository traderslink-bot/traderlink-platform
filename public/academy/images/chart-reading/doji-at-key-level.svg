<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Doji candle shape</title>
  <desc id="desc">Clean candle diagram showing one doji candle with the open and close nearly equal.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Doji candle shape</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Open and close are nearly the same, leaving a very thin real body.</text>

  <g transform="translate(480 155)">
    <line x1="0" y1="8" x2="0" y2="262" stroke="#d6e4ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-88" y="132" width="176" height="14" rx="6" fill="#d6e4ff"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#8ea6c8">
    <text x="244" y="214">Upper wick</text>
    <path d="M330 208L474 174" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="474" cy="174" r="4" fill="#38bdf8"/>
    <text x="620" y="300">Open close area</text>
    <path d="M616 294L568 294" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="568" cy="294" r="4" fill="#38bdf8"/>
    <text x="244" y="392">Lower wick</text>
    <path d="M330 386L474 408" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="474" cy="408" r="4" fill="#38bdf8"/>
  </g>
</svg>
