<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Practice Trading Feedback Loop</title>
  <desc id="desc">Dark trading dashboard visual showing a practice loop from lesson focus to simulated decision, practice note, rule adjustment, and next practice session with realistic candles and volume bars.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.panel{fill:#0f1a2b;stroke:#203651;stroke-width:1.5}.card{fill:#12263f;stroke:#2f80ed;stroke-width:1}.txt{fill:#d7e3f4;font-family:Arial,Helvetica,sans-serif}.small{font-size:12px}.label{font-size:13px;font-weight:700}.muted{fill:#8ea1bd}.grid{stroke:#22364f;opacity:.65}.zone{fill:rgba(56,189,248,.12);stroke:#38bdf8;stroke-width:1.5}.green{fill:#22c55e;stroke:#22c55e}.red{fill:#ef4444;stroke:#ef4444}.wickG{stroke:#22c55e;stroke-width:2}.wickR{stroke:#ef4444;stroke-width:2}.volG{fill:#22c55e;opacity:.45}.volR{fill:#ef4444;opacity:.45}.arrow{stroke:#38bdf8;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/></marker>
  </defs>
  <rect class="bg" width="760" height="430"/>
  <rect class="panel" x="14" y="14" width="732" height="402" rx="8"/>
  <text class="txt label" x="34" y="42">Practice Trading Loop: Focus, Simulate, Context, Adjust</text>
  <text class="txt small muted" x="34" y="64">Practice is a feedback loop. It is not proof that future live results will match.</text>
  <g transform="translate(42 92)">
    <rect x="0" y="0" width="365" height="210" fill="#0c1626" stroke="#203651"/>
    <line class="grid" x1="0" y1="42" x2="365" y2="42"/><line class="grid" x1="0" y1="84" x2="365" y2="84"/><line class="grid" x1="0" y1="126" x2="365" y2="126"/><line class="grid" x1="0" y1="168" x2="365" y2="168"/>
    <rect class="zone" x="44" y="72" width="260" height="18"/><text class="txt small" x="52" y="86">Planned decision zone</text>
    <line class="wickG" x1="36" y1="142" x2="36" y2="172"/><rect class="green" x="29" y="152" width="14" height="10"/>
    <line class="wickG" x1="64" y1="122" x2="64" y2="162"/><rect class="green" x="57" y="136" width="14" height="16"/>
    <line class="wickR" x1="92" y1="110" x2="92" y2="158"/><rect class="red" x="85" y="124" width="14" height="22"/>
    <line class="wickG" x1="120" y1="92" x2="120" y2="146"/><rect class="green" x="113" y="112" width="14" height="22"/>
    <line class="wickR" x1="148" y1="78" x2="148" y2="150"/><rect class="red" x="141" y="94" width="14" height="38"/>
    <line class="wickG" x1="176" y1="86" x2="176" y2="140"/><rect class="green" x="169" y="104" width="14" height="24"/>
    <line class="wickG" x1="204" y1="72" x2="204" y2="130"/><rect class="green" x="197" y="92" width="14" height="26"/>
    <line class="wickR" x1="232" y1="68" x2="232" y2="138"/><rect class="red" x="225" y="86" width="14" height="36"/>
    <line class="wickG" x1="260" y1="90" x2="260" y2="132"/><rect class="green" x="253" y="104" width="14" height="14"/>
    <line class="wickR" x1="288" y1="96" x2="288" y2="148"/><rect class="red" x="281" y="112" width="14" height="20"/>
    <line class="wickG" x1="316" y1="88" x2="316" y2="136"/><rect class="green" x="309" y="104" width="14" height="18"/>
    <g transform="translate(0 224)">
      <rect class="volG" x="29" y="30" width="14" height="18"/><rect class="volG" x="57" y="24" width="14" height="24"/><rect class="volR" x="85" y="22" width="14" height="26"/><rect class="volG" x="113" y="16" width="14" height="32"/><rect class="volR" x="141" y="10" width="14" height="38"/><rect class="volG" x="169" y="18" width="14" height="30"/><rect class="volG" x="197" y="12" width="14" height="36"/><rect class="volR" x="225" y="14" width="14" height="34"/><rect class="volG" x="253" y="28" width="14" height="20"/><rect class="volR" x="281" y="26" width="14" height="22"/><rect class="volG" x="309" y="24" width="14" height="24"/>
    </g>
  </g>
  <g>
    <rect class="card" x="462" y="94" width="214" height="46" rx="6"/><text class="txt small" x="480" y="120">1. Pick one practice focus</text>
    <rect class="card" x="462" y="156" width="214" height="46" rx="6"/><text class="txt small" x="480" y="182">2. Make a simulated decision</text>
    <rect class="card" x="462" y="218" width="214" height="46" rx="6"/><text class="txt small" x="480" y="244">3. Context plan vs actual</text>
    <rect class="card" x="462" y="280" width="214" height="46" rx="6"/><text class="txt small" x="480" y="306">4. Adjust one rule</text>
    <path class="arrow" d="M676 118 C718 150 718 274 676 306"/>
    <path class="arrow" d="M462 303 C420 324 384 310 360 284"/>
    <text class="txt small muted" x="462" y="352">Repeat with the same focus before adding complexity.</text>
  </g>
</svg>
