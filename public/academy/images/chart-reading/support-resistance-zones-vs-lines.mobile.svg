</svg><text x="30" y="1828" fill="#dbeafe" font-family="Arial" font-size="34">Better: zones capture real</text><text x="30" y="1872" fill="#dbeafe" font-family="Arial" font-size="34">reaction areas</text><text x="30" y="1950" fill="#dbeafe" font-family="Arial" font-size="34">Use zones to make the chart easier</text><text x="30" y="1994" fill="#dbeafe" font-family="Arial" font-size="34">to read. The level should help</text><text x="30" y="2038" fill="#dbeafe" font-family="Arial" font-size="34">decisions, not create false</text><text x="30" y="2082" fill="#dbeafe" font-family="Arial" font-size="34">precision.</text></svg>