  <rect x="635" y="225" width="470" height="46" fill="#3b82f6" opacity="0.18" /><line x1="635" y1="248" x2="1105" y2="248" stroke="#60a5fa" stroke-width="3" stroke-dasharray="10 8" />
  <rect x="635" y="468" width="470" height="46" fill="#10b981" opacity="0.18" /><line x1="635" y1="491" x2="1105" y2="491" stroke="#34d399" stroke-width="3" stroke-dasharray="10 8" />
  <g>
    <line x1="125" y1="440" x2="125" y2="530" stroke="#22c55e" stroke-width="4" /><rect x="113" y="475" width="24" height="32" fill="#22c55e" /><line x1="180" y1="385" x2="180" y2="505" stroke="#22c55e" stroke-width="4" /><rect x="168" y="425" width="24" height="55" fill="#22c55e" /><line x1="235" y1="300" x2="235" y2="445" stroke="#22c55e" stroke-width="4" /><rect x="223" y="345" width="24" height="70" fill="#22c55e" /><line x1="290" y1="230" x2="290" y2="365" stroke="#ef4444" stroke-width="4" /><rect x="278" y="270" width="24" height="65" fill="#ef4444" /><line x1="345" y1="230" x2="345" y2="380" stroke="#22c55e" stroke-width="4" /><rect x="333" y="285" width="24" height="60" fill="#22c55e" /><line x1="400" y1="265" x2="400" y2="420" stroke="#ef4444" stroke-width="4" /><rect x="388" y="310" width="24" height="75" fill="#ef4444" /><line x1="455" y1="410" x2="455" y2="530" stroke="#22c55e" stroke-width="4" /><rect x="443" y="455" width="24" height="42" fill="#22c55e" /><line x1="510" y1="385" x2="510" y2="525" stroke="#22c55e" stroke-width="4" /><rect x="498" y="430" width="24" height="60" fill="#22c55e" />
    <line x1="670" y1="440" x2="670" y2="530" stroke="#22c55e" stroke-width="4" /><rect x="658" y="475" width="24" height="32" fill="#22c55e" /><line x1="730" y1="385" x2="730" y2="505" stroke="#22c55e" stroke-width="4" /><rect x="718" y="425" width="24" height="55" fill="#22c55e" /><line x1="790" y1="300" x2="790" y2="445" stroke="#22c55e" stroke-width="4" /><rect x="778" y="345" width="24" height="70" fill="#22c55e" /><line x1="850" y1="225" x2="850" y2="365" stroke="#ef4444" stroke-width="4" /><rect x="838" y="270" width="24" height="65" fill="#ef4444" /><line x1="910" y1="230" x2="910" y2="380" stroke="#22c55e" stroke-width="4" /><rect x="898" y="285" width="24" height="60" fill="#22c55e" /><line x1="970" y1="265" x2="970" y2="420" stroke="#ef4444" stroke-width="4" /><rect x="958" y="310" width="24" height="75" fill="#ef4444" /><line x1="1030" y1="410" x2="1030" y2="530" stroke="#22c55e" stroke-width="4" /><rect x="1018" y="455" width="24" height="42" fill="#22c55e" />
  </g>
  <g font-family="Arial"><rect x="95" y="720" width="1010" height="26" rx="10" fill="#122238" /></g>
</svg><text x="30" y="1048" fill="#dbeafe" font-family="Arial" font-size="34">Problem: exact lines miss nearby</text><text x="30" y="1092" fill="#dbeafe" font-family="Arial" font-size="34">reactions</text><text x="30" y="1170" fill="#dbeafe" font-family="Arial" font-size="40">Cleaner Zones</text><svg xmlns="http://www.w3.org/2000/svg" x="20" y="1198" width="680" height="585" viewBox="620 155 500 430">
  <title id="title">Support And Resistance Zones Versus Exact Lines</title>
