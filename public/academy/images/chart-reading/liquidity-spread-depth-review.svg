    <line x1="360" y1="230" x2="360" y2="170" stroke="#ef4444"/><rect x="349" y="192" width="22" height="24" fill="#ef4444" rx="3"/>
    <line x1="402" y1="246" x2="402" y2="190" stroke="#22c55e"/><rect x="391" y="210" width="22" height="24" fill="#22c55e" rx="3"/>
