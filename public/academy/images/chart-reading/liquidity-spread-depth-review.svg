  <line x1="72" y1="308" x2="548" y2="308" stroke="#182943"/>
  <rect x="72" y="210" width="476" height="30" fill="#2563eb" opacity="0.16"/>
  <line x1="72" y1="225" x2="548" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="402" y="206" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">planned area</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="108" y1="292" x2="108" y2="248" stroke="#22c55e"/><rect x="97" y="264" width="22" height="20" fill="#22c55e" rx="3"/>
