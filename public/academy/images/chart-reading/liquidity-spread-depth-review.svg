    <text x="728" y="224" fill="#fecdd3">$2.04</text>
    <rect x="618" y="246" width="56" height="20" fill="#22c55e" opacity="0.55" rx="4"/>
    <rect x="714" y="246" width="38" height="20" fill="#ef4444" opacity="0.55" rx="4"/>
    <text x="622" y="282" fill="#8ea6c8">thin size near price</text>
    <text x="622" y="314" fill="#8ea6c8">spread affects entry</text>
    <text x="622" y="346" fill="#8ea6c8">exit may be harder</text>
    <text x="622" y="378" fill="#8ea6c8">size must match depth</text>
  </g>
  <path d="M548 225 C582 218, 592 214, 618 218" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="610" y="460" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Last price is not the same as clean execution.</text>
