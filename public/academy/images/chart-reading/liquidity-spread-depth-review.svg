    <line x1="192" y1="248" x2="192" y2="194" stroke="#ef4444"/><rect x="181" y="214" width="22" height="24" fill="#ef4444" rx="3"/>
    <line x1="234" y1="260" x2="234" y2="204" stroke="#22c55e"/><rect x="223" y="224" width="22" height="24" fill="#22c55e" rx="3"/>
