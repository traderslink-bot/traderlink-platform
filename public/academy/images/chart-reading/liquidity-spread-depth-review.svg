  <rect x="594" y="122" width="230" height="314" rx="12" fill="#0a1322" stroke="#213858"/>
  <text x="618" y="154" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Depth and spread check</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="622" y="190" fill="#bbf7d0">Bid</text>
    <text x="714" y="190" fill="#fecdd3">Ask</text>
    <rect x="618" y="204" width="82" height="28" fill="#0f2f25" rx="5"/>
    <rect x="714" y="204" width="82" height="28" fill="#33171f" rx="5"/>
