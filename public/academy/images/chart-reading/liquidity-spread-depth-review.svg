  <line x1="72" y1="340" x2="548" y2="340" stroke="#2a3d5c"/>
  <g>
    <rect x="97" y="416" width="22" height="42" fill="#22c55e" opacity="0.6"/>
    <rect x="139" y="380" width="22" height="78" fill="#22c55e" opacity="0.74"/>
