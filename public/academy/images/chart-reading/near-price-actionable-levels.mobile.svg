  <text x="36" y="754.6481481481482" font-family="Arial" font-size="36" fill="#64748b">1. Far resistance: track later</text>
  <text x="36" y="813.6481481481482" font-family="Arial" font-size="36" fill="#9fd1ff">2. Nearest Actionable Resistance</text>
  <text x="36" y="872.6481481481482" font-family="Arial" font-size="36" fill="#b5f5de">3. Nearest Actionable Support</text>
  <text x="36" y="931.6481481481482" font-family="Arial" font-size="36" fill="#64748b">4. Far support: track later</text>
  <text x="36" y="990.6481481481482" font-family="Arial" font-size="36" fill="#d7ecff">5. Closest resistance can affect</text>
  <text x="36" y="1035.6481481481483" font-family="Arial" font-size="36" fill="#d7ecff">the next decision</text>
  <text x="36" y="1094.6481481481483" font-family="Arial" font-size="36" fill="#c9f7e7">6. Closest support defines nearby</text>
  <text x="36" y="1139.6481481481483" font-family="Arial" font-size="36" fill="#c9f7e7">risk</text>
  <text x="36" y="1198.6481481481483" font-family="Arial" font-size="36" fill="#9fb4c9">Keep levels that can affect the</text>
  <text x="36" y="1243.6481481481483" font-family="Arial" font-size="36" fill="#9fb4c9">current plan. Save far-away levels</text>
  <text x="36" y="1288.6481481481483" font-family="Arial" font-size="36" fill="#9fb4c9">for later.</text>
