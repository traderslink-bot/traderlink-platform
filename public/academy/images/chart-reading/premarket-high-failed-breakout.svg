  <rect x="28" y="362" width="704" height="50" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="385" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Review: did regular-session volume hold above PMH, or did the breakout fail?</text>
  <text x="44" y="404" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">A failed PMH break is context for review, not automatic reversal.</text>
