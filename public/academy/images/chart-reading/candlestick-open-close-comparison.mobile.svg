<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1403" viewBox="0 0 600 1403" role="img"><title>Green and red candle open close comparison</title><desc>Enlarged labels with original plotted shapes for small screens.</desc><rect width="600" height="1403" rx="14" fill="#07111f"/><text x="20" y="70" font-size="42" fill="#e8f1ff" font-family="Arial,sans-serif">Green and red candle open</text><text x="20" y="122" font-size="42" fill="#e8f1ff" font-family="Arial,sans-serif">close comparison</text><svg x="0" y="138" width="600" height="600" viewBox="0 0 480 480"><rect xmlns="http://www.w3.org/2000/svg" width="960" height="540" fill="#07111f" />
