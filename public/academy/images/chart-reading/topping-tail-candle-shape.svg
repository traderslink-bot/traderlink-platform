<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Topping tail candle shape</title>
  <desc id="desc">Clean candle diagram showing a topping tail candle with a long upper tail and body near the lower part of the candle.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Topping tail candle shape</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Price traded higher, then closed back near the lower part of the candle range.</text>
  <g transform="translate(480 150)">
    <line x1="0" y1="0" x2="0" y2="250" stroke="#d6e4ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-54" y="158" width="108" height="64" rx="6" fill="#ef4444"/>
    <text x="-176" y="306" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="16">Long upper tail, body near the bottom.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#8ea6c8">
    <text x="238" y="192">Upper tail is the feature</text>
    <path d="M390 186L476 168" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="476" cy="168" r="4" fill="#38bdf8"/>
    <text x="628" y="332">Body closes away from the high</text>
    <path d="M624 326L536 330" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="536" cy="330" r="4" fill="#38bdf8"/>
  </g>
</svg>
