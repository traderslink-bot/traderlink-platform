<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Hidden execution cost from a wide spread</title>
  <desc id="desc">A dark trading dashboard style chart showing a planned level, bid ask spread, and hidden cost when entering across a wide spread.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Wide spreads can change planned risk</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A fill at the ask can be far from the level the trader planned around.</text>
  <line x1="76" y1="128" x2="560" y2="128" stroke="#182943"/>
  <line x1="76" y1="188" x2="560" y2="188" stroke="#182943"/>
  <line x1="76" y1="248" x2="560" y2="248" stroke="#182943"/>
  <line x1="76" y1="308" x2="560" y2="308" stroke="#182943"/>
  <rect x="76" y="226" width="484" height="30" fill="#2563eb" opacity="0.16"/>
  <line x1="76" y1="241" x2="560" y2="241" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="394" y="220" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">planned level</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="294" x2="112" y2="248" stroke="#22c55e"/><rect x="101" y="264" width="22" height="20" fill="#22c55e" rx="3"/>
    <line x1="154" y1="270" x2="154" y2="222" stroke="#22c55e"/><rect x="143" y="238" width="22" height="22" fill="#22c55e" rx="3"/>
    <line x1="196" y1="250" x2="196" y2="198" stroke="#ef4444"/><rect x="185" y="216" width="22" height="24" fill="#ef4444" rx="3"/>
    <line x1="238" y1="262" x2="238" y2="210" stroke="#22c55e"/><rect x="227" y="228" width="22" height="22" fill="#22c55e" rx="3"/>
    <line x1="280" y1="236" x2="280" y2="178" stroke="#22c55e"/><rect x="269" y="198" width="22" height="26" fill="#22c55e" rx="3"/>
    <line x1="322" y1="218" x2="322" y2="160" stroke="#ef4444"/><rect x="311" y="180" width="22" height="26" fill="#ef4444" rx="3"/>
    <line x1="364" y1="228" x2="364" y2="170" stroke="#ef4444"/><rect x="353" y="190" width="22" height="24" fill="#ef4444" rx="3"/>
  </g>
  <line x1="76" y1="340" x2="560" y2="340" stroke="#2a3d5c"/>
  <g>
    <rect x="101" y="416" width="22" height="42" fill="#22c55e" opacity="0.6"/>
    <rect x="143" y="382" width="22" height="76" fill="#22c55e" opacity="0.74"/>
    <rect x="185" y="400" width="22" height="58" fill="#ef4444" opacity="0.62"/>
    <rect x="227" y="392" width="22" height="66" fill="#22c55e" opacity="0.66"/>
    <rect x="269" y="360" width="22" height="98" fill="#22c55e" opacity="0.86"/>
    <rect x="311" y="410" width="22" height="48" fill="#ef4444" opacity="0.58"/>
    <rect x="353" y="424" width="22" height="34" fill="#ef4444" opacity="0.5"/>
  </g>
  <rect x="604" y="126" width="220" height="278" rx="12" fill="#0a1322" stroke="#213858"/>
  <text x="628" y="158" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Quote check</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="628" y="184" width="78" height="32" fill="#0f2f25" rx="6"/>
    <rect x="724" y="184" width="78" height="32" fill="#33171f" rx="6"/>
    <text x="640" y="205" fill="#bbf7d0">Bid 1.96</text>
    <text x="736" y="205" fill="#fecdd3">Ask 2.05</text>
    <text x="628" y="248" fill="#38bdf8">Spread: $0.09</text>
    <text x="628" y="286" fill="#e8f1ff">Planned level: $2.00</text>
    <text x="628" y="318" fill="#fecdd3">Fill at ask: $2.05</text>
    <text x="628" y="350" fill="#8ea6c8">Risk changed before price moved</text>
  </g>
  <path d="M560 241 C594 232, 604 222, 628 208" fill="none" stroke="#38bdf8" stroke-width="3"/>
</svg>
