<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Failed Breakout Review</title>
  <desc id="desc">Educational candlestick chart showing a breakout attempt that fails back below the breakout level.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Failed Breakout Review</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Failed hold: compare level quality, volume, and follow-through.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="176" width="626" height="40" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="176" x2="690" y2="176" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="216" x2="690" y2="216" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="520" y="170" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Breakout level zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="244" x2="96" y2="302"/>
      <rect x="86" y="262" width="20" height="26" rx="2"/>
      <line x1="162" y1="218" x2="162" y2="278"/>
      <rect x="152" y="234" width="20" height="28" rx="2"/>
      <line x1="228" y1="196" x2="228" y2="260"/>
      <rect x="218" y="212" width="20" height="30" rx="2"/>
      <line x1="294" y1="154" x2="294" y2="236"/>
      <rect x="284" y="174" width="20" height="40" rx="2"/>
      <line x1="360" y1="122" x2="360" y2="206"/>
      <rect x="350" y="142" width="20" height="42" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="426" y1="118" x2="426" y2="236"/>
      <rect x="416" y="146" width="20" height="64" rx="2"/>
      <line x1="492" y1="184" x2="492" y2="280"/>
      <rect x="482" y="206" width="20" height="48" rx="2"/>
      <line x1="558" y1="214" x2="558" y2="302"/>
      <rect x="548" y="236" width="20" height="42" rx="2"/>
      <line x1="624" y1="230" x2="624" y2="310"/>
      <rect x="614" y="248" width="20" height="38" rx="2"/>
    </g>
  </g>
  <path d="M96 286 C150 252 195 226 229 228 C267 231 310 181 361 162 C403 146 438 172 493 254 C532 309 579 274 625 284" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="328" y="112" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">Break attempt</text>
  <text x="424" y="258" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Fails below level</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Review: did the plan define failure before entry?</text>
  <g fill="#1d4ed8" opacity=".8">
    <rect x="520" y="392" width="20" height="11"/>
    <rect x="560" y="390" width="20" height="13"/>
    <rect x="600" y="392" width="20" height="11"/>
  </g>
