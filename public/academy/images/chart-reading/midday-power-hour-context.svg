    <rect class="zone" x="70" y="88" width="330" height="54"/><text class="txt small" x="82" y="108">Midday range / lower urgency</text>
    <line class="line" x1="438" y1="0" x2="438" y2="230"/><text class="txt small" x="410" y="18">Final hour</text>
    <line class="wickG" x1="38" y1="78" x2="38" y2="154"/><rect class="green" x="30" y="106" width="16" height="28"/>
    <line class="wickR" x1="72" y1="96" x2="72" y2="150"/><rect class="red" x="65" y="112" width="14" height="22"/>
    <line class="wickG" x1="106" y1="100" x2="106" y2="138"/><rect class="green" x="99" y="114" width="14" height="10"/>
