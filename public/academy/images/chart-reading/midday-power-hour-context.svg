    <line class="wickG" x1="452" y1="84" x2="452" y2="134"/><rect class="green" x="444" y="102" width="16" height="20"/>
    <line class="wickG" x1="486" y1="66" x2="486" y2="126"/><rect class="green" x="478" y="88" width="16" height="26"/>
    <line class="wickR" x1="520" y1="62" x2="520" y2="142"/><rect class="red" x="512" y="82" width="16" height="42"/>
    <line class="wickG" x1="554" y1="80" x2="554" y2="132"/><rect class="green" x="546" y="98" width="16" height="18"/>
