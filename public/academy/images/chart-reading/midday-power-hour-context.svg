    <line class="wickG" x1="174" y1="104" x2="174" y2="140"/><rect class="green" x="167" y="116" width="14" height="10"/>
    <line class="wickR" x1="208" y1="102" x2="208" y2="142"/><rect class="red" x="201" y="114" width="14" height="12"/>
    <line class="wickG" x1="242" y1="98" x2="242" y2="138"/><rect class="green" x="235" y="112" width="14" height="12"/>
    <line class="wickR" x1="276" y1="104" x2="276" y2="146"/><rect class="red" x="269" y="116" width="14" height="14"/>
    <line class="wickG" x1="310" y1="96" x2="310" y2="136"/><rect class="green" x="303" y="110" width="14" height="14"/>
    <line class="wickR" x1="344" y1="100" x2="344" y2="148"/><rect class="red" x="337" y="114" width="14" height="18"/>
