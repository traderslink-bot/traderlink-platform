  <text x="36" y="799.6481481481482" font-family="Arial" font-size="36" fill="#d7ecff">1. Repeated rejection area</text>
  <text x="36" y="858.6481481481482" font-family="Arial" font-size="36" fill="#c9f7e7">2. Repeated bounce area</text>
  <text x="36" y="917.6481481481482" font-family="Arial" font-size="36" fill="#d7ecff">3. Second clear reaction</text>
  <text x="36" y="976.6481481481482" font-family="Arial" font-size="36" fill="#9fb4c9">Start with the most obvious</text>
  <text x="36" y="1021.6481481481482" font-family="Arial" font-size="36" fill="#9fb4c9">reactions. A useful level should</text>
  <text x="36" y="1066.6481481481483" font-family="Arial" font-size="36" fill="#9fb4c9">be visible before the trade, not</text>
  <text x="36" y="1111.6481481481483" font-family="Arial" font-size="36" fill="#9fb4c9">invented after it.</text>
