  <text x="36" y="56" font-family="Arial" font-size="53" fill="#f8fbff">Mark The Obvious</text>
  <text x="36" y="122.25" font-family="Arial" font-size="53" fill="#f8fbff">Reactions First</text>
  <text x="36" y="188.5" font-family="Arial" font-size="36" fill="#9fb4c9">Start with the areas where price</text>
  <text x="36" y="233.5" font-family="Arial" font-size="36" fill="#9fb4c9">clearly reacted more than once.</text>
  <text x="36" y="278.5" font-family="Arial" font-size="36" fill="#9fb4c9">Ignore tiny noise candles.</text>
