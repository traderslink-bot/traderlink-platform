<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Bid and ask quote mechanics</title>
  <desc id="desc">A dark trading dashboard style visual showing bid, ask, spread, last price, quote depth, candles, and volume.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Bid and ask are the live quote, not the last candle</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">The last trade can differ from the price available to enter or exit now.</text>
  <line x1="72" y1="128" x2="548" y2="128" stroke="#182943"/>
  <line x1="72" y1="188" x2="548" y2="188" stroke="#182943"/>
  <line x1="72" y1="248" x2="548" y2="248" stroke="#182943"/>
  <line x1="72" y1="308" x2="548" y2="308" stroke="#182943"/>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="108" y1="292" x2="108" y2="248" stroke="#22c55e"/><rect x="97" y="264" width="22" height="20" fill="#22c55e" rx="3"/>
    <line x1="150" y1="268" x2="150" y2="220" stroke="#22c55e"/><rect x="139" y="236" width="22" height="22" fill="#22c55e" rx="3"/>
    <line x1="192" y1="248" x2="192" y2="196" stroke="#ef4444"/><rect x="181" y="214" width="22" height="24" fill="#ef4444" rx="3"/>
    <line x1="234" y1="256" x2="234" y2="204" stroke="#22c55e"/><rect x="223" y="224" width="22" height="22" fill="#22c55e" rx="3"/>
    <line x1="276" y1="230" x2="276" y2="174" stroke="#22c55e"/><rect x="265" y="194" width="22" height="24" fill="#22c55e" rx="3"/>
    <line x1="318" y1="222" x2="318" y2="168" stroke="#ef4444"/><rect x="307" y="188" width="22" height="22" fill="#ef4444" rx="3"/>
  </g>
  <line x1="72" y1="340" x2="548" y2="340" stroke="#2a3d5c"/>
  <g>
    <rect x="97" y="416" width="22" height="42" fill="#22c55e" opacity="0.6"/>
    <rect x="139" y="382" width="22" height="76" fill="#22c55e" opacity="0.74"/>
    <rect x="181" y="402" width="22" height="56" fill="#ef4444" opacity="0.62"/>
    <rect x="223" y="392" width="22" height="66" fill="#22c55e" opacity="0.68"/>
    <rect x="265" y="366" width="22" height="92" fill="#22c55e" opacity="0.82"/>
    <rect x="307" y="410" width="22" height="48" fill="#ef4444" opacity="0.58"/>
  </g>
  <rect x="594" y="122" width="230" height="318" rx="12" fill="#0a1322" stroke="#213858"/>
  <text x="618" y="154" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Quote panel</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="618" y="190" fill="#8ea6c8">Last trade</text>
    <text x="742" y="190" fill="#e8f1ff">$2.00</text>
    <rect x="618" y="212" width="82" height="34" fill="#0f2f25" rx="6"/>
    <rect x="718" y="212" width="82" height="34" fill="#33171f" rx="6"/>
    <text x="632" y="234" fill="#bbf7d0">Bid 1.98</text>
    <text x="732" y="234" fill="#fecdd3">Ask 2.03</text>
    <text x="618" y="278" fill="#38bdf8">Spread: $0.05</text>
    <rect x="618" y="304" width="58" height="18" fill="#22c55e" opacity="0.55" rx="4"/>
    <text x="686" y="318" fill="#8ea6c8">bid size</text>
    <rect x="718" y="338" width="46" height="18" fill="#ef4444" opacity="0.55" rx="4"/>
    <text x="618" y="352" fill="#8ea6c8">ask size</text>
    <text x="618" y="390" fill="#8ea6c8">Quote is what matters for fills.</text>
  </g>
</svg>
