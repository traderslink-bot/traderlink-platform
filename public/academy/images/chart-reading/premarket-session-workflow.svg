    <rect class="zone" x="36" y="64" width="420" height="14"/><text class="txt small" x="462" y="76">PMH zone</text>
    <rect class="zone" x="36" y="148" width="420" height="16"/><text class="txt small" x="462" y="161">PML zone</text>
    <line class="line" x1="392" y1="0" x2="392" y2="230"/><text class="txt small" x="366" y="18">Open</text>
    <line class="wickG" x1="34" y1="150" x2="34" y2="176"/><rect class="green" x="27" y="158" width="14" height="10"/>
    <line class="wickG" x1="62" y1="126" x2="62" y2="170"/><rect class="green" x="55" y="142" width="14" height="18"/>
    <line class="wickR" x1="90" y1="112" x2="90" y2="164"/><rect class="red" x="83" y="126" width="14" height="28"/>
    <line class="wickG" x1="118" y1="96" x2="118" y2="150"/><rect class="green" x="111" y="116" width="14" height="24"/>
    <line class="wickG" x1="146" y1="72" x2="146" y2="138"/><rect class="green" x="139" y="94" width="14" height="30"/>
    <line class="wickR" x1="174" y1="64" x2="174" y2="142"/><rect class="red" x="167" y="82" width="14" height="44"/>
    <line class="wickG" x1="202" y1="88" x2="202" y2="146"/><rect class="green" x="195" y="110" width="14" height="20"/>
    <line class="wickR" x1="230" y1="104" x2="230" y2="164"/><rect class="red" x="223" y="120" width="14" height="30"/>
    <line class="wickG" x1="258" y1="116" x2="258" y2="158"/><rect class="green" x="251" y="130" width="14" height="14"/>
    <line class="wickR" x1="286" y1="108" x2="286" y2="164"/><rect class="red" x="279" y="124" width="14" height="28"/>
    <line class="wickG" x1="314" y1="92" x2="314" y2="146"/><rect class="green" x="307" y="110" width="14" height="24"/>
    <line class="wickG" x1="342" y1="76" x2="342" y2="134"/><rect class="green" x="335" y="98" width="14" height="22"/>
    <line class="wickR" x1="370" y1="66" x2="370" y2="142"/><rect class="red" x="363" y="84" width="14" height="44"/>
    <line class="wickG" x1="414" y1="58" x2="414" y2="138"/><rect class="green" x="406" y="84" width="16" height="34"/>
    <line class="wickR" x1="446" y1="70" x2="446" y2="158"/><rect class="red" x="438" y="96" width="16" height="42"/>
    <line class="wickR" x1="478" y1="114" x2="478" y2="178"/><rect class="red" x="470" y="134" width="16" height="26"/>
