  </g>
  <g>
    <rect class="note" x="602" y="102" width="118" height="60" rx="6"/><text class="txt small" x="616" y="126">Catalyst</text><text class="txt small muted" x="616" y="146">Read source</text>
    <rect class="note" x="602" y="180" width="118" height="60" rx="6"/><text class="txt small" x="616" y="204">Liquidity</text><text class="txt small muted" x="616" y="224">Check spread</text>
    <rect class="note" x="602" y="258" width="118" height="60" rx="6"/><text class="txt small" x="616" y="282">Context</text><text class="txt small muted" x="616" y="302">Did plan hold?</text>
  </g>
</svg>
