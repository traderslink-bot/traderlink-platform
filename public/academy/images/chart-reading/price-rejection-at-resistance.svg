<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Price Rejection At Resistance</title>
  <desc id="desc">Educational candlestick chart showing price pushing into resistance and rejecting back below the zone.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Price Rejection At Resistance</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Example only: rejection is a review event, not automatic reversal.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="132" width="626" height="40" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="132" x2="690" y2="132" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="172" x2="690" y2="172" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="524" y="126" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Resistance zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="258" x2="96" y2="318"/>
      <rect x="86" y="276" width="20" height="28" rx="2"/>
      <line x1="162" y1="224" x2="162" y2="292"/>
      <rect x="152" y="242" width="20" height="32" rx="2"/>
      <line x1="228" y1="190" x2="228" y2="260"/>
      <rect x="218" y="208" width="20" height="34" rx="2"/>
      <line x1="294" y1="138" x2="294" y2="230"/>
      <rect x="284" y="160" width="20" height="48" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="360" y1="92" x2="360" y2="214"/>
      <rect x="350" y="124" width="20" height="64" rx="2"/>
      <line x1="426" y1="132" x2="426" y2="246"/>
      <rect x="416" y="160" width="20" height="62" rx="2"/>
      <line x1="492" y1="190" x2="492" y2="278"/>
      <rect x="482" y="210" width="20" height="42" rx="2"/>
      <line x1="558" y1="214" x2="558" y2="296"/>
      <rect x="548" y="232" width="20" height="40" rx="2"/>
      <line x1="624" y1="224" x2="624" y2="302"/>
      <rect x="614" y="242" width="20" height="36" rx="2"/>
    </g>
  </g>
  <path d="M96 302 C152 264 198 228 229 224 C268 219 309 157 361 185 C411 212 445 242 493 252 C535 263 581 260 625 278" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="308" y="91" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Wick rejects above level</text>
  <text x="424" y="296" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Follow-through confirms failed hold</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Review: what level rejected, and did price hold or fail after the wick?</text>
</svg>
