  <line x1="78" y1="260" x2="678" y2="260" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7" />
  <line x1="78" y1="205" x2="678" y2="205" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 7" opacity=".85" />
  <text x="88" y="142" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Gap zone</text>
  <text x="520" y="199" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12">Gap midpoint</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="112" y1="149" x2="112" y2="181" /><rect x="102" y="158" width="20" height="14" />
      <line x1="220" y1="176" x2="220" y2="202" /><rect x="210" y="185" width="20" height="14" />
      <line x1="328" y1="174" x2="328" y2="202" /><rect x="318" y="183" width="20" height="14" />
      <line x1="436" y1="165" x2="436" y2="197" /><rect x="426" y="174" width="20" height="14" />
      <line x1="544" y1="150" x2="544" y2="182" /><rect x="534" y="159" width="20" height="14" />
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="166" y1="160" x2="166" y2="192" /><rect x="156" y="169" width="20" height="14" />
      <line x1="274" y1="175" x2="274" y2="202" /><rect x="264" y="184" width="20" height="14" />
      <line x1="382" y1="174" x2="382" y2="202" /><rect x="372" y="183" width="20" height="14" />
      <line x1="490" y1="167" x2="490" y2="199" /><rect x="480" y="176" width="20" height="14" />
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="122" y="132" fill="#c8d7ee">Price enters gap</text>
    <text x="286" y="235" fill="#fecaca">Partial fill stops above midpoint</text>
    <text x="452" y="125" fill="#bbf7d0">Rebounds within gap</text>
  </g>
