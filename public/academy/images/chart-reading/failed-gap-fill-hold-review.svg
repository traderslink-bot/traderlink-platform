<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Failed Gap Fill Hold Review</title>
  <desc id="desc">Educational candlestick chart showing price entering a gap area but failing to continue filling the gap and holding above the gap midpoint.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="318" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Failed Gap Fill Review</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A gap can partially fill and still hold above the full gap area.</text>
  <g stroke="#18304e" stroke-width="1"><line x1="58" y1="116" x2="704" y2="116"/><line x1="58" y1="166" x2="704" y2="166"/><line x1="58" y1="216" x2="704" y2="216"/><line x1="58" y1="266" x2="704" y2="266"/></g>
  <rect x="78" y="150" width="600" height="110" fill="#1d4ed8" opacity=".14"/>
  <line x1="78" y1="150" x2="678" y2="150" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="78" y1="260" x2="678" y2="260" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="78" y1="205" x2="678" y2="205" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 7" opacity=".85"/>
  <text x="88" y="142" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Gap zone</text>
  <text x="520" y="199" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12">Midpoint hold</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="112" y1="138" x2="112" y2="212"/><rect x="102" y="158" width="20" height="34" rx="2"/>
      <line x1="220" y1="174" x2="220" y2="246"/><rect x="210" y="194" width="20" height="34" rx="2"/>
      <line x1="328" y1="204" x2="328" y2="276"/><rect x="318" y="224" width="20" height="34" rx="2"/>
      <line x1="436" y1="188" x2="436" y2="260"/><rect x="426" y="208" width="20" height="34" rx="2"/>
      <line x1="544" y1="164" x2="544" y2="236"/><rect x="534" y="184" width="20" height="34" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="166" y1="132" x2="166" y2="228"/><rect x="156" y="158" width="20" height="50" rx="2"/>
      <line x1="274" y1="178" x2="274" y2="268"/><rect x="264" y="202" width="20" height="46" rx="2"/>
      <line x1="382" y1="196" x2="382" y2="282"/><rect x="372" y="218" width="20" height="42" rx="2"/>
      <line x1="490" y1="164" x2="490" y2="250"/><rect x="480" y="186" width="20" height="42" rx="2"/>
    </g>
  </g>
  <path d="M112 176 L166 208 L220 212 L274 248 L328 242 L382 260 L436 224 L490 228 L544 202" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".5"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="286" y="304" fill="#fecaca">Fill attempt stalls</text>
    <text x="452" y="176" fill="#bbf7d0">Gap holds for now</text>
  </g>
  <g><rect x="84" y="310" width="14" height="34" fill="#ef4444" opacity=".82"/><rect x="118" y="302" width="14" height="42" fill="#ef4444" opacity=".9"/><rect x="152" y="318" width="14" height="26" fill="#21c784" opacity=".7"/><rect x="186" y="326" width="14" height="18" fill="#ef4444" opacity=".62"/><rect x="220" y="312" width="14" height="32" fill="#21c784" opacity=".78"/></g>
  <rect x="28" y="376" width="704" height="36" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="399" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Review: did the gap fill complete, partially fill, or fail and hold?</text>
</svg>
