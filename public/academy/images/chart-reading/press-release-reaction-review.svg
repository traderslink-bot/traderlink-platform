<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Press release market reaction review</title>
  <desc id="desc">Dark trading dashboard showing a press release headline, realistic candlesticks, volume burst, fade area, spread notes, and reaction checks.</desc>
  <rect width="960" height="560" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="904" height="504" rx="14" fill="#0b1628" stroke="#1d3557"/>
  <text x="52" y="66" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Press Release Reaction Review</text>
  <text x="52" y="92" fill="#8fa7c8" font-family="Arial, sans-serif" font-size="14">The release explains attention. The chart shows whether the first reaction held or faded.</text>

  <rect x="52" y="118" width="856" height="54" rx="10" fill="#081323" stroke="#172a46"/>
  <text x="78" y="151" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Official release hits scanner before the open</text>
  <text x="830" y="151" fill="#7bb4ff" font-family="Arial, sans-serif" font-size="13" text-anchor="end">Read full text</text>

  <rect x="52" y="196" width="642" height="270" rx="10" fill="#081323" stroke="#172a46"/>
  <g stroke="#172a46" stroke-width="1">
    <line x1="76" y1="238" x2="670" y2="238"/>
    <line x1="76" y1="280" x2="670" y2="280"/>
    <line x1="76" y1="322" x2="670" y2="322"/>
    <line x1="76" y1="364" x2="670" y2="364"/>
    <line x1="76" y1="406" x2="670" y2="406"/>
  </g>
  <g stroke-linecap="round" stroke-width="3">
    <line x1="102" y1="386" x2="102" y2="424" stroke="#26c281"/><rect x="92" y="400" width="20" height="16" rx="2" fill="#26c281"/>
    <line x1="138" y1="374" x2="138" y2="416" stroke="#26c281"/><rect x="128" y="388" width="20" height="18" rx="2" fill="#26c281"/>
    <line x1="174" y1="330" x2="174" y2="398" stroke="#26c281"/><rect x="164" y="350" width="20" height="34" rx="2" fill="#26c281"/>
    <line x1="210" y1="284" x2="210" y2="372" stroke="#26c281"/><rect x="200" y="306" width="20" height="48" rx="2" fill="#26c281"/>
    <line x1="246" y1="246" x2="246" y2="350" stroke="#ef5350"/><rect x="236" y="270" width="20" height="62" rx="2" fill="#ef5350"/>
    <line x1="282" y1="254" x2="282" y2="352" stroke="#26c281"/><rect x="272" y="278" width="20" height="50" rx="2" fill="#26c281"/>
    <line x1="318" y1="268" x2="318" y2="374" stroke="#ef5350"/><rect x="308" y="292" width="20" height="58" rx="2" fill="#ef5350"/>
    <line x1="354" y1="304" x2="354" y2="392" stroke="#ef5350"/><rect x="344" y="322" width="20" height="50" rx="2" fill="#ef5350"/>
    <line x1="390" y1="326" x2="390" y2="406" stroke="#ef5350"/><rect x="380" y="344" width="20" height="42" rx="2" fill="#ef5350"/>
    <line x1="426" y1="334" x2="426" y2="410" stroke="#26c281"/><rect x="416" y="352" width="20" height="34" rx="2" fill="#26c281"/>
    <line x1="462" y1="342" x2="462" y2="416" stroke="#ef5350"/><rect x="452" y="360" width="20" height="36" rx="2" fill="#ef5350"/>
    <line x1="498" y1="350" x2="498" y2="422" stroke="#ef5350"/><rect x="488" y="366" width="20" height="34" rx="2" fill="#ef5350"/>
    <line x1="534" y1="356" x2="534" y2="424" stroke="#26c281"/><rect x="524" y="372" width="20" height="26" rx="2" fill="#26c281"/>
    <line x1="570" y1="360" x2="570" y2="426" stroke="#ef5350"/><rect x="560" y="376" width="20" height="28" rx="2" fill="#ef5350"/>
  </g>
  <path d="M204 230 L224 206 L244 230" fill="none" stroke="#2d8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="166" y="202" fill="#7bb4ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Initial reaction</text>
  <rect x="326" y="260" width="150" height="36" rx="7" fill="#15345c" opacity=".72" stroke="#2d8cff"/>
  <text x="401" y="283" fill="#d8eaff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Fade move</text>

  <rect x="52" y="478" width="642" height="34" rx="8" fill="#081323" stroke="#172a46"/>
  <g>
    <rect x="92" y="500" width="20" height="6" fill="#26c281" opacity=".5"/>
    <rect x="128" y="497" width="20" height="9" fill="#26c281" opacity=".55"/>
    <rect x="164" y="486" width="20" height="20" fill="#26c281" opacity=".75"/>
    <rect x="200" y="476" width="20" height="30" fill="#26c281"/>
    <rect x="236" y="480" width="20" height="26" fill="#ef5350" opacity=".9"/>
    <rect x="272" y="486" width="20" height="20" fill="#26c281" opacity=".72"/>
    <rect x="308" y="492" width="20" height="14" fill="#ef5350" opacity=".68"/>
    <rect x="344" y="496" width="20" height="10" fill="#ef5350" opacity=".58"/>
    <rect x="380" y="498" width="20" height="8" fill="#ef5350" opacity=".54"/>
    <rect x="416" y="499" width="20" height="7" fill="#26c281" opacity=".5"/>
    <rect x="452" y="500" width="20" height="6" fill="#ef5350" opacity=".5"/>
    <rect x="488" y="501" width="20" height="5" fill="#ef5350" opacity=".5"/>
  </g>

  <rect x="718" y="196" width="190" height="270" rx="10" fill="#081323" stroke="#172a46"/>
  <text x="740" y="228" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Reaction Notes</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#8fa7c8">
    <text x="740" y="264">Was full release read?</text>
    <text x="740" y="300">Were details specific?</text>
    <text x="740" y="336">Any related filing?</text>
    <text x="740" y="372">Did volume continue?</text>
    <text x="740" y="408">Was spread workable?</text>
  </g>
  <rect x="740" y="430" width="146" height="20" rx="5" fill="#0d213a" stroke="#2d8cff"/>
  <text x="813" y="444" fill="#7bb4ff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Reaction checklist</text>
</svg>
