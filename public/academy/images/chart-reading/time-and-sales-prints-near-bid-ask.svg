<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Time and sales prints near bid and ask</title>
  <desc id="desc">A dark trading dashboard showing time and sales prints near bid and ask quotes beside price candles and volume.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Time and sales shows actual prints</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Level 2 shows displayed interest; the tape shows completed trades.</text>
  <line x1="72" y1="128" x2="508" y2="128" stroke="#182943"/>
  <line x1="72" y1="188" x2="508" y2="188" stroke="#182943"/>
  <line x1="72" y1="248" x2="508" y2="248" stroke="#182943"/>
  <line x1="72" y1="308" x2="508" y2="308" stroke="#182943"/>
