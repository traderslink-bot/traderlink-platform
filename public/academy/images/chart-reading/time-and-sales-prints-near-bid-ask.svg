    <line x1="280" y1="232" x2="280" y2="176" stroke="#22c55e"/><rect x="269" y="196" width="22" height="24" fill="#22c55e" rx="3"/>
    <line x1="322" y1="220" x2="322" y2="164" stroke="#22c55e"/><rect x="311" y="184" width="22" height="24" fill="#22c55e" rx="3"/>
