<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Stock catalyst headline versus chart reaction</title>
  <desc id="desc">Dark trading dashboard showing a catalyst headline, red and green candlesticks, a volume burst, a failed hold label, and filing check notes.</desc>
  <rect width="960" height="560" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="904" height="504" rx="14" fill="#0b1628" stroke="#1d3557"/>
  <text x="52" y="66" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Headline Versus Reaction</text>
  <text x="52" y="92" fill="#8fa7c8" font-family="Arial, sans-serif" font-size="14">A catalyst starts the read. The chart, volume, filings, and liquidity add context.</text>

  <rect x="52" y="118" width="856" height="74" rx="10" fill="#081323" stroke="#172a46"/>
  <text x="78" y="148" fill="#7bb4ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">CATALYST HEADLINE</text>
  <text x="78" y="174" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Company announces partnership update before the open</text>
  <rect x="690" y="137" width="190" height="34" rx="7" fill="#10233c" stroke="#2d8cff"/>
  <text x="785" y="159" fill="#d8eaff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Read full details</text>

  <rect x="52" y="216" width="620" height="250" rx="10" fill="#081323" stroke="#172a46"/>
  <g stroke="#172a46" stroke-width="1">
    <line x1="76" y1="252" x2="648" y2="252"/>
    <line x1="76" y1="290" x2="648" y2="290"/>
    <line x1="76" y1="328" x2="648" y2="328"/>
    <line x1="76" y1="366" x2="648" y2="366"/>
    <line x1="76" y1="404" x2="648" y2="404"/>
  </g>
  <rect x="376" y="250" width="178" height="38" rx="7" fill="#15345c" opacity=".7" stroke="#2d8cff"/>
  <text x="465" y="274" fill="#d8eaff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">First reaction fades</text>

  <g stroke-linecap="round" stroke-width="3">
