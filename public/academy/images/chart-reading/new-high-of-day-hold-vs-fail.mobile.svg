  <text x="36" y="128.25" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="36">A new high is an attempt. Check</text>
  <text x="36" y="173.25" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="36">whether price holds above old HOD.</text>
