<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Time and sales speed fade review</title>
  <desc id="desc">A dark trading dashboard showing tape speed increasing during a volume burst and fading afterward beside candles and volume.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Tape speed can increase and fade</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A fast tape is context; slowing prints after a burst can change the review.</text>
  <line x1="72" y1="128" x2="520" y2="128" stroke="#182943"/>
  <line x1="72" y1="188" x2="520" y2="188" stroke="#182943"/>
  <line x1="72" y1="248" x2="520" y2="248" stroke="#182943"/>
  <line x1="72" y1="308" x2="520" y2="308" stroke="#182943"/>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="292" x2="112" y2="248" stroke="#22c55e"/><rect x="101" y="264" width="22" height="20" fill="#22c55e" rx="3"/>
    <line x1="154" y1="268" x2="154" y2="216" stroke="#22c55e"/><rect x="143" y="236" width="22" height="24" fill="#22c55e" rx="3"/>
    <line x1="196" y1="240" x2="196" y2="178" stroke="#22c55e"/><rect x="185" y="200" width="22" height="30" fill="#22c55e" rx="3"/>
    <line x1="238" y1="210" x2="238" y2="144" stroke="#22c55e"/><rect x="227" y="166" width="22" height="34" fill="#22c55e" rx="3"/>
    <line x1="280" y1="194" x2="280" y2="132" stroke="#ef4444"/><rect x="269" y="152" width="22" height="28" fill="#ef4444" rx="3"/>
    <line x1="322" y1="200" x2="322" y2="150" stroke="#ef4444"/><rect x="311" y="168" width="22" height="22" fill="#ef4444" rx="3"/>
    <line x1="364" y1="214" x2="364" y2="166" stroke="#22c55e"/><rect x="353" y="184" width="22" height="20" fill="#22c55e" rx="3"/>
  </g>
  <line x1="72" y1="340" x2="520" y2="340" stroke="#2a3d5c"/>
  <g>
    <rect x="101" y="418" width="22" height="40" fill="#22c55e" opacity="0.58"/>
    <rect x="143" y="372" width="22" height="86" fill="#22c55e" opacity="0.76"/>
    <rect x="185" y="306" width="22" height="152" fill="#22c55e" opacity="1"/>
    <rect x="227" y="296" width="22" height="162" fill="#22c55e" opacity="1"/>
    <rect x="269" y="372" width="22" height="86" fill="#ef4444" opacity="0.66"/>
    <rect x="311" y="402" width="22" height="56" fill="#ef4444" opacity="0.54"/>
    <rect x="353" y="414" width="22" height="44" fill="#22c55e" opacity="0.5"/>
  </g>
  <rect x="560" y="122" width="264" height="318" rx="12" fill="#0a1322" stroke="#213858"/>
  <text x="584" y="154" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Tape pace review</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="584" y="196" fill="#bbf7d0">Burst: many ask prints</text>
    <rect x="584" y="210" width="176" height="18" fill="#22c55e" opacity="0.7" rx="4"/>
    <rect x="584" y="236" width="194" height="18" fill="#22c55e" opacity="0.8" rx="4"/>
    <rect x="584" y="262" width="158" height="18" fill="#22c55e" opacity="0.65" rx="4"/>
    <text x="584" y="316" fill="#fecdd3">After burst: tape slows</text>
    <rect x="584" y="330" width="82" height="18" fill="#ef4444" opacity="0.55" rx="4"/>
    <rect x="584" y="356" width="52" height="18" fill="#ef4444" opacity="0.45" rx="4"/>
    <text x="584" y="404" fill="#8ea6c8">Review the change, not one print.</text>
  </g>
</svg>
