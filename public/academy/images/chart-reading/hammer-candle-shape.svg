<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Hammer candle shape</title>
  <desc id="desc">Clean candle diagram showing a hammer candle with a small body near the top and a long lower wick.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Hammer candle shape</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Small body near the top of the range, with a long lower wick.</text>
  <g transform="translate(480 150)">
    <line x1="0" y1="62" x2="0" y2="270" stroke="#d6e4ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-54" y="44" width="108" height="58" rx="6" fill="#22c55e"/>
    <text x="-164" y="320" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="16">Long lower wick below a small body.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#8ea6c8">
    <text x="628" y="220">Small body near top</text>
    <path d="M624 214L538 216" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="538" cy="216" r="4" fill="#38bdf8"/>
    <text x="238" y="372">Long lower wick</text>
    <path d="M352 366L472 400" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="472" cy="400" r="4" fill="#38bdf8"/>
  </g>
</svg>
