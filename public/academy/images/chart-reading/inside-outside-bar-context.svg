<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Inside bar and outside bar candle shapes</title>
  <desc id="desc">Clean candle diagram comparing an inside bar contained within the prior candle range and an outside bar that expands beyond the prior candle range.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Inside bar vs outside bar</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Compare the second candle range with the candle immediately before it.</text>

  <g transform="translate(250 175)">
    <text x="-72" y="-24" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Inside bar</text>
    <line x1="-48" y1="0" x2="-48" y2="210" stroke="#d6e4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="-88" y="44" width="80" height="112" rx="5" fill="#22c55e"/>
    <line x1="62" y1="62" x2="62" y2="174" stroke="#d6e4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="28" y="92" width="68" height="46" rx="5" fill="#ef4444"/>
    <rect x="10" y="0" width="104" height="210" fill="none" stroke="#9cc7ff" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="-140" y="250" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Second candle stays inside the prior range.</text>
  </g>

  <g transform="translate(675 175)">
    <text x="-78" y="-24" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Outside bar</text>
    <line x1="-50" y1="62" x2="-50" y2="178" stroke="#d6e4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="-84" y="90" width="68" height="54" rx="5" fill="#22c55e"/>
    <line x1="62" y1="0" x2="62" y2="210" stroke="#d6e4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="22" y="40" width="80" height="124" rx="5" fill="#ef4444"/>
    <rect x="10" y="0" width="104" height="210" fill="none" stroke="#9cc7ff" stroke-width="2"/>
    <text x="-142" y="250" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Second candle expands beyond the prior range.</text>
  </g>
</svg>
