<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Pivot Level Reaction Map</title>
  <desc id="desc">Educational candlestick chart showing price reacting around a clear pivot level zone with volume context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="318" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Pivot Level Reaction Map</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A pivot zone is useful when price reacts around it more than once.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="116" x2="704" y2="116"/>
    <line x1="58" y1="166" x2="704" y2="166"/>
    <line x1="58" y1="216" x2="704" y2="216"/>
    <line x1="58" y1="266" x2="704" y2="266"/>
  </g>
  <rect x="74" y="198" width="612" height="36" fill="#1d4ed8" opacity=".18"/>
  <line x1="74" y1="198" x2="686" y2="198" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="74" y1="234" x2="686" y2="234" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="84" y="190" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Pivot zone from visible reactions</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="250" x2="96" y2="314"/><rect x="86" y="268" width="20" height="28" rx="2"/>
      <line x1="150" y1="210" x2="150" y2="284"/><rect x="140" y="230" width="20" height="34" rx="2"/>
      <line x1="204" y1="190" x2="204" y2="260"/><rect x="194" y="210" width="20" height="32" rx="2"/>
      <line x1="312" y1="214" x2="312" y2="282"/><rect x="302" y="232" width="20" height="30" rx="2"/>
      <line x1="420" y1="190" x2="420" y2="258"/><rect x="410" y="208" width="20" height="32" rx="2"/>
      <line x1="474" y1="156" x2="474" y2="230"/><rect x="464" y="176" width="20" height="34" rx="2"/>
      <line x1="528" y1="138" x2="528" y2="210"/><rect x="518" y="158" width="20" height="34" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="258" y1="166" x2="258" y2="238"/><rect x="248" y="184" width="20" height="34" rx="2"/>
      <line x1="366" y1="158" x2="366" y2="236"/><rect x="356" y="178" width="20" height="38" rx="2"/>
      <line x1="582" y1="136" x2="582" y2="224"/><rect x="572" y="158" width="20" height="46" rx="2"/>
      <line x1="636" y1="190" x2="636" y2="268"/><rect x="626" y="210" width="20" height="38" rx="2"/>
    </g>
  </g>
  <path d="M96 294 L150 246 L204 226 L258 216 L312 252 L366 216 L420 224 L474 192 L528 176 L582 204 L636 248" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".5"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="142" y="302" fill="#bbf7d0">Hold area</text>
    <path d="M178 292 L198 236" stroke="#bbf7d0" stroke-width="2"/>
    <text x="246" y="154" fill="#fecaca">Reject area</text>
    <path d="M288 160 L266 188" stroke="#fecaca" stroke-width="2"/>
    <text x="438" y="144" fill="#bbf7d0">Reclaim area</text>
    <path d="M480 150 L480 174" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <g>
    <rect x="58" y="316" width="14" height="18" fill="#21c784" opacity=".7"/>
    <rect x="84" y="306" width="14" height="28" fill="#21c784" opacity=".8"/>
    <rect x="110" y="318" width="14" height="16" fill="#ef4444" opacity=".65"/>
    <rect x="136" y="300" width="14" height="34" fill="#21c784" opacity=".85"/>
    <rect x="162" y="312" width="14" height="22" fill="#21c784" opacity=".75"/>
    <rect x="188" y="320" width="14" height="14" fill="#ef4444" opacity=".65"/>
    <rect x="214" y="300" width="14" height="34" fill="#ef4444" opacity=".85"/>
    <rect x="240" y="292" width="14" height="42" fill="#ef4444" opacity=".92"/>
    <rect x="266" y="316" width="14" height="18" fill="#21c784" opacity=".65"/>
    <rect x="292" y="306" width="14" height="28" fill="#21c784" opacity=".75"/>
    <rect x="318" y="318" width="14" height="16" fill="#ef4444" opacity=".65"/>
    <rect x="344" y="294" width="14" height="40" fill="#ef4444" opacity=".9"/>
    <rect x="370" y="310" width="14" height="24" fill="#21c784" opacity=".7"/>
    <rect x="396" y="304" width="14" height="30" fill="#21c784" opacity=".8"/>
    <rect x="422" y="288" width="14" height="46" fill="#21c784" opacity=".95"/>
    <rect x="448" y="292" width="14" height="42" fill="#21c784" opacity=".9"/>
    <rect x="474" y="306" width="14" height="28" fill="#ef4444" opacity=".7"/>
    <rect x="500" y="310" width="14" height="24" fill="#21c784" opacity=".7"/>
    <rect x="526" y="316" width="14" height="18" fill="#ef4444" opacity=".65"/>
    <rect x="552" y="294" width="14" height="40" fill="#ef4444" opacity=".88"/>
    <rect x="578" y="300" width="14" height="34" fill="#ef4444" opacity=".85"/>
  </g>
  <rect x="28" y="362" width="704" height="50" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="385" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Context: was the pivot visible before the trade, and how did price react around it?</text>
  <text x="44" y="404" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Pivot zones are context areas, not automatic outcomes.</text>
</svg>
