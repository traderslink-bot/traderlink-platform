<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bullish and bearish engulfing candle shapes</title>
  <desc id="desc">Clean candle diagram showing bullish and bearish engulfing candle pairs where the second candle body is larger than the prior candle body.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Engulfing candle shapes</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">The second candle body fully overtakes the prior candle body.</text>

  <g transform="translate(270 175)">
    <text x="-92" y="-26" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Bullish engulfing</text>
    <line x1="-56" y1="88" x2="-56" y2="190" stroke="#d6e4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="-90" y="112" width="68" height="54" rx="5" fill="#ef4444"/>
    <line x1="58" y1="42" x2="58" y2="226" stroke="#d6e4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="14" y="64" width="88" height="138" rx="5" fill="#22c55e"/>
    <rect x="4" y="54" width="108" height="158" rx="8" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="0" y="238" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="15" font-weight="700">Engulfing candle</text>
    <text x="-140" y="268" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Large green body covers the prior red body.</text>
  </g>

  <g transform="translate(690 175)">
    <text x="-92" y="-26" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Bearish engulfing</text>
    <line x1="-56" y1="42" x2="-56" y2="226" stroke="#d6e4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="-100" y="64" width="88" height="138" rx="5" fill="#22c55e"/>
    <line x1="58" y1="40" x2="58" y2="226" stroke="#d6e4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="14" y="46" width="88" height="174" rx="5" fill="#ef4444"/>
    <rect x="4" y="36" width="108" height="194" rx="8" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="0" y="246" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="15" font-weight="700">Engulfing candle</text>
    <text x="-142" y="276" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Large red body covers the prior green body.</text>
  </g>
</svg>
