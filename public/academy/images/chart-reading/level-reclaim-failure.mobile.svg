<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 760 913.2727272727273">
  <title id="title">Level Reclaim Failure</title>
  <desc id="desc">Educational candlestick chart showing price reclaiming a level briefly and then failing back below the zone.</desc>
  <rect width="760" height="913.2727272727273" rx="18" fill="#07111f" />
  <text x="36" y="54" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="53" font-weight="700">Level Reclaim Failure</text>
  <text x="36" y="128.25" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="36">A reclaim can fail if price cannot</text>
  <text x="36" y="173.25" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="36">stay above the level.</text>
  <svg x="0" y="222.25" width="760" height="421.02272727272725" viewBox="28 40 704 390.0" overflow="hidden">
