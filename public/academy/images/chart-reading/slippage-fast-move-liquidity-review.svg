<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Slippage during a fast move with thin liquidity</title>
  <desc id="desc">A dark trading dashboard style chart showing slippage during a fast candle with widening spread, thin depth, and volume spike context.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Fast moves can make slippage worse</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Thin depth and a widening spread can move the actual fill away from the plan.</text>
  <line x1="76" y1="128" x2="560" y2="128" stroke="#182943"/>
  <line x1="76" y1="188" x2="560" y2="188" stroke="#182943"/>
  <line x1="76" y1="248" x2="560" y2="248" stroke="#182943"/>
  <line x1="76" y1="308" x2="560" y2="308" stroke="#182943"/>
  <line x1="76" y1="246" x2="560" y2="246" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="382" y="238" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">planned entry</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="296" x2="112" y2="254" stroke="#22c55e"/><rect x="101" y="268" width="22" height="20" fill="#22c55e" rx="3"/>
    <line x1="154" y1="274" x2="154" y2="224" stroke="#22c55e"/><rect x="143" y="242" width="22" height="22" fill="#22c55e" rx="3"/>
    <line x1="196" y1="246" x2="196" y2="184" stroke="#22c55e"/><rect x="185" y="206" width="22" height="30" fill="#22c55e" rx="3"/>
    <line x1="238" y1="202" x2="238" y2="124" stroke="#22c55e"/><rect x="227" y="148" width="22" height="44" fill="#22c55e" rx="3"/>
    <line x1="280" y1="176" x2="280" y2="104" stroke="#ef4444"/><rect x="269" y="128" width="22" height="34" fill="#ef4444" rx="3"/>
    <line x1="322" y1="168" x2="322" y2="96" stroke="#22c55e"/><rect x="311" y="120" width="22" height="34" fill="#22c55e" rx="3"/>
  </g>
  <rect x="300" y="88" width="116" height="30" rx="15" fill="#2a1b1f" stroke="#fb7185"/>
  <text x="314" y="108" fill="#fecdd3" font-family="Arial, sans-serif" font-size="13">fill slipped</text>
  <line x1="76" y1="340" x2="560" y2="340" stroke="#2a3d5c"/>
  <g>
    <rect x="101" y="418" width="22" height="40" fill="#22c55e" opacity="0.56"/>
    <rect x="143" y="382" width="22" height="76" fill="#22c55e" opacity="0.7"/>
    <rect x="185" y="316" width="22" height="142" fill="#22c55e" opacity="1"/>
    <rect x="227" y="300" width="22" height="158" fill="#22c55e" opacity="1"/>
    <rect x="269" y="372" width="22" height="86" fill="#ef4444" opacity="0.66"/>
    <rect x="311" y="386" width="22" height="72" fill="#22c55e" opacity="0.62"/>
  </g>
  <rect x="600" y="126" width="226" height="292" rx="12" fill="#0a1322" stroke="#213858"/>
  <text x="624" y="158" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Execution check</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="624" y="198" fill="#e8f1ff">Expected: $3.00</text>
    <text x="624" y="228" fill="#fecdd3">Actual fill: $3.12</text>
    <text x="624" y="258" fill="#38bdf8">Spread widened</text>
    <text x="624" y="288" fill="#8ea6c8">Depth was thin</text>
    <text x="624" y="318" fill="#8ea6c8">Volume spiked quickly</text>
    <text x="624" y="348" fill="#8ea6c8">Order risk</text>
  </g>
</svg>
