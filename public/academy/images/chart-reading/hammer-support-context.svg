<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Hammer and bottoming tail candle shapes</title>
  <desc id="desc">Clean candle diagram showing hammer and bottoming tail candle shapes with long lower wicks and small bodies near the top of the range.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Hammer / bottoming tail shape</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Look for a small body near the top of the candle and a long lower wick.</text>

  <g transform="translate(310 170)">
    <text x="-78" y="-20" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Green hammer</text>
    <line x1="0" y1="28" x2="0" y2="250" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="-44" y="42" width="88" height="54" rx="5" fill="#22c55e"/>
    <text x="-126" y="288" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="16">Long lower wick below a small body.</text>
  </g>

  <g transform="translate(660 170)">
    <text x="-72" y="-20" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Red hammer</text>
    <line x1="0" y1="28" x2="0" y2="250" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="-44" y="42" width="88" height="54" rx="5" fill="#ef4444"/>
    <text x="-130" y="288" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="16">Color can vary; the shape is the clue.</text>
  </g>
</svg>
