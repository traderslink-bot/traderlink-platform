<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Low Of Day Failed Breakdown</title>
  <desc id="desc">Educational candlestick chart showing price breaking below low of day and reclaiming back above the level with volume context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="318" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Failed Breakdown At LOD</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A fresh low can fail if price quickly reclaims the prior LOD.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="116" x2="704" y2="116"/><line x1="58" y1="166" x2="704" y2="166"/><line x1="58" y1="216" x2="704" y2="216"/><line x1="58" y1="266" x2="704" y2="266"/>
  </g>
  <rect x="72" y="250" width="620" height="34" fill="#1d4ed8" opacity=".18"/>
  <line x1="72" y1="250" x2="692" y2="250" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="72" y1="284" x2="692" y2="284" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="82" y="244" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Prior LOD zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="96" y1="142" x2="96" y2="222"/><rect x="86" y="162" width="20" height="40"/>
      <line x1="150" y1="184" x2="150" y2="264"/><rect x="140" y="204" width="20" height="40"/>
      <line x1="204" y1="224" x2="204" y2="304"/><rect x="194" y="244" width="20" height="40"/>
      <line x1="312" y1="252" x2="312" y2="336"/><rect x="302" y="274" width="20" height="42"/>
    </g>
    <g stroke="#21c784" fill="#21c784">
      <line x1="258" y1="204" x2="258" y2="276"/><rect x="248" y="224" width="20" height="34"/>
      <line x1="366" y1="236" x2="366" y2="310"/><rect x="356" y="256" width="20" height="34"/>
      <line x1="420" y1="220" x2="420" y2="292"/><rect x="410" y="240" width="20" height="34"/>
      <line x1="474" y1="194" x2="474" y2="266"/><rect x="464" y="214" width="20" height="34"/>
      <line x1="528" y1="176" x2="528" y2="248"/><rect x="518" y="196" width="20" height="34"/>
    </g>
  </g>
  <path d="M96 182 L150 244 L204 284 L258 240 L312 316 L366 272 L420 256 L474 230 L528 214" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".5"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="276" y="348" fill="#fecaca">New LOD print</text><path d="M318 340 L316 318" stroke="#fecaca" stroke-width="2"/>
    <text x="372" y="216" fill="#bbf7d0">Reclaims prior LOD</text><path d="M430 222 L420 242" stroke="#bbf7d0" stroke-width="2"/>
    <text x="500" y="154" fill="#bbf7d0">Reclaim response</text>
  </g>
  <g>
    <rect x="70" y="326" width="14" height="18" fill="#ef4444" opacity=".7"/><rect x="96" y="314" width="14" height="30" fill="#ef4444" opacity=".85"/><rect x="122" y="330" width="14" height="14" fill="#21c784" opacity=".62"/><rect x="148" y="306" width="14" height="38" fill="#ef4444" opacity=".88"/><rect x="174" y="296" width="14" height="48" fill="#ef4444" opacity=".95"/><rect x="200" y="318" width="14" height="26" fill="#21c784" opacity=".7"/><rect x="226" y="286" width="14" height="58" fill="#ef4444" opacity=".98"/><rect x="252" y="300" width="14" height="44" fill="#21c784" opacity=".88"/><rect x="278" y="304" width="14" height="40" fill="#21c784" opacity=".86"/><rect x="304" y="312" width="14" height="32" fill="#21c784" opacity=".78"/><rect x="330" y="322" width="14" height="22" fill="#ef4444" opacity=".65"/>
  </g>
  <rect x="28" y="362" width="704" height="50" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="385" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Check: did the breakdown hold below LOD, or did price reclaim the level?</text>
  <text x="44" y="404" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Failed LOD break: compare the break, reclaim, and follow-through.</text>
</svg>
