<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Red-to-green move shape</title>
  <desc id="desc">Clean intraday candle diagram showing price starting red below the prior close and then reclaiming green above it.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Red-to-green move</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Price starts below the prior close, then reclaims above it.</text>
  <line x1="110" y1="250" x2="850" y2="250" stroke="#9cc7ff" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="118" y="238" fill="#9cc7ff" font-family="Arial, sans-serif" font-size="16">Prior close / red-green line</text>
  <g stroke-width="4" stroke-linecap="round">
    <g stroke="#ef4444" fill="#ef4444"><line x1="240" y1="268" x2="240" y2="356"/><rect x="222" y="292" width="36" height="42" rx="4"/></g>
    <g stroke="#ef4444" fill="#ef4444"><line x1="335" y1="246" x2="335" y2="334"/><rect x="317" y="274" width="36" height="38" rx="4"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="430" y1="214" x2="430" y2="306"/><rect x="412" y="238" width="36" height="48" rx="4"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="525" y1="168" x2="525" y2="268"/><rect x="507" y="196" width="36" height="54" rx="4"/></g>
  </g>
  <path d="M250 335C340 318 430 280 526 205" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="570" y="224" fill="#d6e4ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Reclaim above the line</text>
  <text x="570" y="252" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">The green candle is the visible shift.</text>
</svg>
