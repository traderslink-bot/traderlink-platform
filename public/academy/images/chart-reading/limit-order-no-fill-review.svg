<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Limit order no-fill review</title>
  <desc id="desc">A dark trading dashboard style chart showing price moving away from a limit order that does not fill.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Price control can create no-fill review</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A limit order may protect price, but it may not participate if price moves away.</text>
  <line x1="76" y1="128" x2="604" y2="128" stroke="#182943"/>
  <line x1="76" y1="188" x2="604" y2="188" stroke="#182943"/>
  <line x1="76" y1="248" x2="604" y2="248" stroke="#182943"/>
  <line x1="76" y1="308" x2="604" y2="308" stroke="#182943"/>
  <line x1="76" y1="252" x2="604" y2="252" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="430" y="244" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">limit price</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="292" x2="112" y2="252" stroke="#22c55e"/><rect x="101" y="266" width="22" height="18" fill="#22c55e" rx="3"/>
    <line x1="154" y1="270" x2="154" y2="224" stroke="#22c55e"/><rect x="143" y="240" width="22" height="20" fill="#22c55e" rx="3"/>
    <line x1="196" y1="248" x2="196" y2="194" stroke="#22c55e"/><rect x="185" y="214" width="22" height="24" fill="#22c55e" rx="3"/>
    <line x1="238" y1="220" x2="238" y2="164" stroke="#22c55e"/><rect x="227" y="184" width="22" height="26" fill="#22c55e" rx="3"/>
    <line x1="280" y1="194" x2="280" y2="138" stroke="#22c55e"/><rect x="269" y="158" width="22" height="26" fill="#22c55e" rx="3"/>
    <line x1="322" y1="176" x2="322" y2="120" stroke="#ef4444"/><rect x="311" y="140" width="22" height="24" fill="#ef4444" rx="3"/>
    <line x1="364" y1="168" x2="364" y2="110" stroke="#22c55e"/><rect x="353" y="130" width="22" height="28" fill="#22c55e" rx="3"/>
  </g>
  <rect x="152" y="270" width="126" height="30" rx="15" fill="#12345a" stroke="#38bdf8"/>
  <text x="168" y="290" fill="#d8ecff" font-family="Arial, sans-serif" font-size="13">order not filled</text>
  <line x1="76" y1="340" x2="604" y2="340" stroke="#2a3d5c"/>
  <g>
    <rect x="101" y="416" width="22" height="42" fill="#22c55e" opacity="0.6"/>
    <rect x="143" y="384" width="22" height="74" fill="#22c55e" opacity="0.74"/>
    <rect x="185" y="348" width="22" height="110" fill="#22c55e" opacity="0.9"/>
    <rect x="227" y="328" width="22" height="130" fill="#22c55e" opacity="1"/>
    <rect x="269" y="344" width="22" height="114" fill="#22c55e" opacity="0.9"/>
    <rect x="311" y="382" width="22" height="76" fill="#ef4444" opacity="0.64"/>
    <rect x="353" y="354" width="22" height="104" fill="#22c55e" opacity="0.82"/>
  </g>
  <rect x="642" y="144" width="182" height="184" rx="12" fill="#0a1322" stroke="#213858"/>
  <text x="666" y="178" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Review prompt</text>
  <text x="666" y="216" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="14">Price control helped</text>
  <text x="666" y="246" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="14">Fill did not happen</text>
  <text x="666" y="276" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Did trader chase after?</text>
</svg>
