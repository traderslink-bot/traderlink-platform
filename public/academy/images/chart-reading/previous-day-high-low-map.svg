  <line x1="68" y1="300" x2="694" y2="300" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="82" y="130" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="12" font-weight="700">PDH reference zone</text>
  <text x="82" y="320" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="12" font-weight="700">PDL reference zone</text>
