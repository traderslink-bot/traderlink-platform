  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Yesterday's range becomes today's objective reference map.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="116" x2="704" y2="116"/>
    <line x1="58" y1="166" x2="704" y2="166"/>
    <line x1="58" y1="216" x2="704" y2="216"/>
