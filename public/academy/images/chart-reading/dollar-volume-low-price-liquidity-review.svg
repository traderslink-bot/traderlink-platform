<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Dollar volume liquidity review for a low-priced stock</title>
  <desc id="desc">A dark trading dashboard style chart showing a low-priced stock with large share volume, modest dollar volume, wide spread, and thin depth.</desc>
  <rect width="900" height="520" fill="#08111f"/>
  <rect x="24" y="24" width="852" height="472" rx="18" fill="#0d1728" stroke="#1e3557" stroke-width="2"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Dollar volume adds liquidity context</text>
  <text x="44" y="84" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Large share volume on a low-priced stock can still have spread and depth risk.</text>
  <line x1="72" y1="128" x2="548" y2="128" stroke="#182943"/>
  <line x1="72" y1="188" x2="548" y2="188" stroke="#182943"/>
  <line x1="72" y1="248" x2="548" y2="248" stroke="#182943"/>
  <line x1="72" y1="308" x2="548" y2="308" stroke="#182943"/>
  <rect x="72" y="218" width="476" height="30" fill="#2563eb" opacity="0.16"/>
  <line x1="72" y1="233" x2="548" y2="233" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="402" y="214" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="14">spread/depth area</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="108" y1="292" x2="108" y2="252" stroke="#22c55e"/><rect x="97" y="266" width="22" height="18" fill="#22c55e" rx="3"/>
    <line x1="150" y1="270" x2="150" y2="220" stroke="#22c55e"/><rect x="139" y="238" width="22" height="22" fill="#22c55e" rx="3"/>
    <line x1="192" y1="244" x2="192" y2="180" stroke="#22c55e"/><rect x="181" y="200" width="22" height="34" fill="#22c55e" rx="3"/>
    <line x1="234" y1="212" x2="234" y2="154" stroke="#22c55e"/><rect x="223" y="172" width="22" height="30" fill="#22c55e" rx="3"/>
    <line x1="276" y1="198" x2="276" y2="142" stroke="#ef4444"/><rect x="265" y="160" width="22" height="26" fill="#ef4444" rx="3"/>
    <line x1="318" y1="220" x2="318" y2="164" stroke="#ef4444"/><rect x="307" y="184" width="22" height="24" fill="#ef4444" rx="3"/>
    <line x1="360" y1="236" x2="360" y2="184" stroke="#22c55e"/><rect x="349" y="202" width="22" height="22" fill="#22c55e" rx="3"/>
  </g>
  <line x1="72" y1="340" x2="548" y2="340" stroke="#2a3d5c"/>
  <g>
    <rect x="97" y="414" width="22" height="44" fill="#22c55e" opacity="0.6"/>
    <rect x="139" y="374" width="22" height="84" fill="#22c55e" opacity="0.78"/>
    <rect x="181" y="312" width="22" height="146" fill="#22c55e" opacity="1"/>
    <rect x="223" y="330" width="22" height="128" fill="#22c55e" opacity="0.9"/>
    <rect x="265" y="386" width="22" height="72" fill="#ef4444" opacity="0.64"/>
    <rect x="307" y="410" width="22" height="48" fill="#ef4444" opacity="0.56"/>
    <rect x="349" y="394" width="22" height="64" fill="#22c55e" opacity="0.62"/>
  </g>
  <rect x="590" y="122" width="238" height="318" rx="12" fill="#0a1322" stroke="#213858"/>
  <text x="616" y="154" fill="#bcd7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Liquidity check</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="616" y="194" fill="#e8f1ff">Share volume: 12M</text>
    <text x="616" y="224" fill="#e8f1ff">Avg price: $0.35</text>
    <text x="616" y="254" fill="#38bdf8">Dollar volume: ~$4.2M</text>
    <line x1="616" y1="274" x2="800" y2="274" stroke="#2a3d5c"/>
    <text x="616" y="306" fill="#bbf7d0">Bid: $0.34</text>
    <text x="716" y="306" fill="#fecdd3">Ask: $0.38</text>
    <text x="616" y="338" fill="#8ea6c8">Spread matters</text>
    <text x="616" y="368" fill="#8ea6c8">Depth still thin</text>
    <text x="616" y="398" fill="#8ea6c8">Size needs depth</text>
  </g>
  <path d="M370 344 C446 332, 526 302, 590 286" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="96" y="474" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">High share volume does not automatically mean clean execution.</text>
</svg>
