<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Specific versus vague press release details</title>
  <desc id="desc">Dark trading dashboard comparing specific press release details with vague language, plus realistic red and green candlesticks and volume reaction context.</desc>
  <rect width="960" height="560" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="904" height="504" rx="14" fill="#0b1628" stroke="#1d3557"/>
  <text x="52" y="66" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Specific Details Versus Vague Language</text>
  <text x="52" y="92" fill="#8fa7c8" font-family="Arial, sans-serif" font-size="14">Details help you understand the catalyst before reacting to the first move.</text>

  <rect x="52" y="122" width="260" height="268" rx="10" fill="#081323" stroke="#1f6f55"/>
  <text x="78" y="158" fill="#26c281" font-family="Arial, sans-serif" font-size="17" font-weight="700">More Specific</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#d8eaff">
    <text x="78" y="196">Named customer</text>
    <text x="78" y="228">Signed agreement</text>
    <text x="78" y="260">Contract value</text>
    <text x="78" y="292">Delivery timeline</text>
    <text x="78" y="324">Related filing</text>
    <text x="78" y="356">Clear milestone</text>
  </g>
  <rect x="340" y="122" width="260" height="268" rx="10" fill="#081323" stroke="#8a5b1f"/>
  <text x="366" y="158" fill="#f5c26b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Needs More Context</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#d8eaff">
    <text x="366" y="196">No named party</text>
    <text x="366" y="228">Plans or intends</text>
    <text x="366" y="260">No financial terms</text>
    <text x="366" y="292">Future possibility</text>
    <text x="366" y="324">Missing timeline</text>
    <text x="366" y="356">Risk buried later</text>
  </g>

  <rect x="628" y="122" width="280" height="268" rx="10" fill="#081323" stroke="#172a46"/>
  <g stroke="#172a46" stroke-width="1">
    <line x1="650" y1="164" x2="886" y2="164"/>
    <line x1="650" y1="204" x2="886" y2="204"/>
    <line x1="650" y1="244" x2="886" y2="244"/>
    <line x1="650" y1="284" x2="886" y2="284"/>
    <line x1="650" y1="324" x2="886" y2="324"/>
  </g>
  <g stroke-linecap="round" stroke-width="3">
    <line x1="670" y1="318" x2="670" y2="350" stroke="#26c281"/><rect x="661" y="330" width="18" height="12" rx="2" fill="#26c281"/>
    <line x1="702" y1="302" x2="702" y2="342" stroke="#26c281"/><rect x="693" y="316" width="18" height="18" rx="2" fill="#26c281"/>
    <line x1="734" y1="262" x2="734" y2="326" stroke="#26c281"/><rect x="725" y="280" width="18" height="34" rx="2" fill="#26c281"/>
    <line x1="766" y1="220" x2="766" y2="306" stroke="#ef5350"/><rect x="757" y="242" width="18" height="46" rx="2" fill="#ef5350"/>
    <line x1="798" y1="238" x2="798" y2="316" stroke="#26c281"/><rect x="789" y="260" width="18" height="36" rx="2" fill="#26c281"/>
    <line x1="830" y1="260" x2="830" y2="330" stroke="#ef5350"/><rect x="821" y="276" width="18" height="34" rx="2" fill="#ef5350"/>
    <line x1="862" y1="278" x2="862" y2="340" stroke="#ef5350"/><rect x="853" y="292" width="18" height="30" rx="2" fill="#ef5350"/>
  </g>
  <text x="650" y="366" fill="#8fa7c8" font-family="Arial, sans-serif" font-size="12">Reaction still needs volume, level, and spread context.</text>

  <rect x="52" y="414" width="856" height="76" rx="10" fill="#081323" stroke="#172a46"/>
  <text x="78" y="444" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Context Prompt</text>
  <text x="78" y="470" fill="#8fa7c8" font-family="Arial, sans-serif" font-size="13">Specific details improve context, but no press release detail guarantees continuation or clean execution.</text>
</svg>
