<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Trading Halt Timeline</title>
  <desc id="desc">Dark trading dashboard chart showing realistic red and green candles before a trading halt, a paused period, resume candles, and volume bars with context labels.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.panel{fill:#0f1a2b;stroke:#203651;stroke-width:1.5}.txt{fill:#d7e3f4;font-family:Arial,Helvetica,sans-serif}.small{font-size:12px}.label{font-size:13px;font-weight:700}.muted{fill:#8ea1bd}.grid{stroke:#22364f;opacity:.65}.halt{fill:rgba(245,158,11,.16);stroke:#f59e0b;stroke-width:1.5;stroke-dasharray:7 5}.zone{fill:rgba(56,189,248,.12);stroke:#38bdf8;stroke-width:1.5}.green{fill:#22c55e;stroke:#22c55e}.red{fill:#ef4444;stroke:#ef4444}.wickG{stroke:#22c55e;stroke-width:2}.wickR{stroke:#ef4444;stroke-width:2}.volG{fill:#22c55e;opacity:.45}.volR{fill:#ef4444;opacity:.45}
    </style>
  </defs>
  <rect class="bg" width="760" height="430"/>
  <rect class="panel" x="14" y="14" width="732" height="402" rx="8"/>
  <text class="txt label" x="34" y="42">Trading Halt Timeline: Pause, Imbalance, Resume</text>
  <text class="txt small muted" x="34" y="64">A halt interrupts trading. It does not tell the trader what will happen after resume.</text>
  <g transform="translate(54 94)">
    <rect x="0" y="0" width="650" height="230" fill="#0c1626" stroke="#203651"/>
    <line class="grid" x1="0" y1="46" x2="650" y2="46"/><line class="grid" x1="0" y1="92" x2="650" y2="92"/><line class="grid" x1="0" y1="138" x2="650" y2="138"/><line class="grid" x1="0" y1="184" x2="650" y2="184"/>
    <rect class="zone" x="40" y="126" width="190" height="18"/><text class="txt small" x="48" y="140">Known level before halt</text>
    <rect class="halt" x="260" y="0" width="150" height="230"/><text class="txt label" x="315" y="110">HALT</text><text class="txt small" x="286" y="130">No regular trading</text>
    <line class="wickG" x1="38" y1="148" x2="38" y2="178"/><rect class="green" x="31" y="158" width="14" height="10"/>
    <line class="wickG" x1="70" y1="128" x2="70" y2="170"/><rect class="green" x="63" y="142" width="14" height="18"/>
    <line class="wickG" x1="102" y1="96" x2="102" y2="160"/><rect class="green" x="95" y="118" width="14" height="30"/>
    <line class="wickR" x1="134" y1="82" x2="134" y2="156"/><rect class="red" x="127" y="98" width="14" height="40"/>
    <line class="wickG" x1="166" y1="64" x2="166" y2="146"/><rect class="green" x="159" y="92" width="14" height="36"/>
    <line class="wickR" x1="198" y1="52" x2="198" y2="152"/><rect class="red" x="191" y="76" width="14" height="54"/>
    <line class="wickG" x1="230" y1="42" x2="230" y2="136"/><rect class="green" x="223" y="72" width="14" height="42"/>
    <line class="wickR" x1="444" y1="54" x2="444" y2="170"/><rect class="red" x="434" y="92" width="20" height="44"/>
    <line class="wickG" x1="490" y1="82" x2="490" y2="166"/><rect class="green" x="480" y="110" width="20" height="30"/>
    <line class="wickR" x1="536" y1="104" x2="536" y2="178"/><rect class="red" x="526" y="126" width="20" height="28"/>
    <line class="wickG" x1="582" y1="92" x2="582" y2="160"/><rect class="green" x="572" y="116" width="20" height="22"/>
    <text class="txt small" x="430" y="38">Resume can be unstable</text>
    <g transform="translate(0 246)">
      <rect class="volG" x="31" y="32" width="14" height="16"/><rect class="volG" x="63" y="24" width="14" height="24"/><rect class="volG" x="95" y="12" width="14" height="36"/><rect class="volR" x="127" y="8" width="14" height="40"/><rect class="volG" x="159" y="4" width="14" height="44"/><rect class="volR" x="191" y="0" width="14" height="48"/><rect class="volG" x="223" y="2" width="14" height="46"/>
      <rect class="volR" x="434" y="0" width="20" height="48"/><rect class="volG" x="480" y="10" width="20" height="38"/><rect class="volR" x="526" y="20" width="20" height="28"/><rect class="volG" x="572" y="24" width="20" height="24"/>
    </g>
  </g>
</svg>
