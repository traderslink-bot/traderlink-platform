  </svg><text x="20" y="1564" font-size="30" fill="#e8f1ff" font-family="Arial,sans-serif">6. Too many small levels</text><text x="20" y="1620" font-size="30" fill="#e8f1ff" font-family="Arial,sans-serif">7. Far-away levels</text><text x="20" y="1676" font-size="30" fill="#e8f1ff" font-family="Arial,sans-serif">8. Repeated lines inside one zone</text><text x="20" y="1732" font-size="30" fill="#e8f1ff" font-family="Arial,sans-serif">9. Harder to read</text><text x="20" y="1788" font-size="30" fill="#8ea6c8" font-family="Arial,sans-serif">A good level map should make price</text><text x="20" y="1828" font-size="30" fill="#8ea6c8" font-family="Arial,sans-serif">location clearer.</text></svg>