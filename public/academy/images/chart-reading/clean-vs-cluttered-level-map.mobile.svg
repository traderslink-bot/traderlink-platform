  </svg><text x="20" y="779" font-size="30" fill="#9cc8ff" font-family="Arial,sans-serif">1. Nearest support</text><text x="20" y="835" font-size="30" fill="#fcd34d" font-family="Arial,sans-serif">2. Nearest resistance</text><text x="20" y="891" font-size="30" fill="#fecaca" font-family="Arial,sans-serif">3. Next trouble area</text><text x="20" y="947" font-size="30" fill="#fecaca" font-family="Arial,sans-serif">4. Clear invalidation area</text><text x="20" y="1003" font-size="30" fill="#e8f1ff" font-family="Arial,sans-serif">5. Current price</text><text x="20" y="1063" font-size="34" fill="#e8f1ff" font-family="Arial,sans-serif">Cluttered level map</text><svg x="20" y="1079" width="560" height="420" viewBox="0 0 400 300"><g xmlns="http://www.w3.org/2000/svg">
