<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Trade Replay Review Timeline</title>
  <desc id="desc">Dark trading dashboard chart showing a replay review timeline with candles revealed in steps, volume bars, marked pause points, and notes.</desc>
  <defs><style>
    .bg{fill:#0b1220}.panel{fill:#0f1a2b;stroke:#203651;stroke-width:1.5}.txt{fill:#d7e3f4;font-family:Arial,Helvetica,sans-serif}.small{font-size:12px}.label{font-size:13px;font-weight:700}.muted{fill:#8ea1bd}.grid{stroke:#22364f;opacity:.65}.zone{fill:rgba(56,189,248,.12);stroke:#38bdf8;stroke-width:1.5}.pause{stroke:#f59e0b;stroke-width:2;stroke-dasharray:5 4}.green{fill:#22c55e;stroke:#22c55e}.red{fill:#ef4444;stroke:#ef4444}.wickG{stroke:#22c55e;stroke-width:2}.wickR{stroke:#ef4444;stroke-width:2}.volG{fill:#22c55e;opacity:.45}.volR{fill:#ef4444;opacity:.45}.mask{fill:#101827;opacity:.72}.note{fill:#12263f;stroke:#2f80ed;stroke-width:1}
  </style></defs>
  <rect class="bg" width="760" height="430"/><rect class="panel" x="14" y="14" width="732" height="402" rx="8"/>
  <text class="txt label" x="34" y="42">Replay Review: Pause Before The Next Candle</text>
  <text class="txt small muted" x="34" y="64">Practice decisions with the information available at that moment.</text>
  <g transform="translate(50 92)">
    <rect x="0" y="0" width="560" height="230" fill="#0c1626" stroke="#203651"/>
    <line class="grid" x1="0" y1="46" x2="560" y2="46"/><line class="grid" x1="0" y1="92" x2="560" y2="92"/><line class="grid" x1="0" y1="138" x2="560" y2="138"/><line class="grid" x1="0" y1="184" x2="560" y2="184"/>
    <rect class="zone" x="40" y="74" width="340" height="18"/><text class="txt small" x="48" y="88">Level known before replay step</text>
    <line class="wickG" x1="34" y1="146" x2="34" y2="176"/><rect class="green" x="27" y="156" width="14" height="10"/>
    <line class="wickG" x1="66" y1="128" x2="66" y2="166"/><rect class="green" x="59" y="140" width="14" height="16"/>
    <line class="wickR" x1="98" y1="116" x2="98" y2="166"/><rect class="red" x="91" y="130" width="14" height="22"/>
    <line class="wickG" x1="130" y1="94" x2="130" y2="152"/><rect class="green" x="123" y="116" width="14" height="24"/>
    <line class="wickR" x1="162" y1="82" x2="162" y2="156"/><rect class="red" x="155" y="98" width="14" height="40"/>
    <line class="wickG" x1="194" y1="86" x2="194" y2="140"/><rect class="green" x="187" y="104" width="14" height="22"/>
    <line class="wickG" x1="226" y1="70" x2="226" y2="132"/><rect class="green" x="219" y="92" width="14" height="28"/>
    <line class="wickR" x1="258" y1="68" x2="258" y2="142"/><rect class="red" x="251" y="88" width="14" height="36"/>
    <line class="wickG" x1="290" y1="82" x2="290" y2="134"/><rect class="green" x="283" y="100" width="14" height="20"/>
    <line class="wickR" x1="322" y1="90" x2="322" y2="148"/><rect class="red" x="315" y="108" width="14" height="22"/>
    <line class="wickG" x1="354" y1="76" x2="354" y2="132"/><rect class="green" x="347" y="96" width="14" height="22"/>
    <line class="wickR" x1="386" y1="84" x2="386" y2="154"/><rect class="red" x="379" y="104" width="14" height="30"/>
    <rect class="mask" x="402" y="1" width="157" height="228"/>
    <line class="pause" x1="150" y1="0" x2="150" y2="230"/><text class="txt small" x="116" y="18">Pause 1</text>
    <line class="pause" x1="302" y1="0" x2="302" y2="230"/><text class="txt small" x="268" y="18">Pause 2</text>
    <line class="pause" x1="402" y1="0" x2="402" y2="230"/><text class="txt small" x="368" y="18">Hide future</text>
    <g transform="translate(0 246)">
      <rect class="volG" x="27" y="32" width="14" height="16"/><rect class="volG" x="59" y="26" width="14" height="22"/><rect class="volR" x="91" y="22" width="14" height="26"/><rect class="volG" x="123" y="16" width="14" height="32"/><rect class="volR" x="155" y="10" width="14" height="38"/><rect class="volG" x="187" y="18" width="14" height="30"/><rect class="volG" x="219" y="12" width="14" height="36"/><rect class="volR" x="251" y="16" width="14" height="32"/><rect class="volG" x="283" y="22" width="14" height="26"/><rect class="volR" x="315" y="24" width="14" height="24"/><rect class="volG" x="347" y="18" width="14" height="30"/><rect class="volR" x="379" y="28" width="14" height="20"/>
    </g>
  </g>
  <g>
    <rect class="note" x="634" y="106" width="92" height="58" rx="6"/><text class="txt small" x="648" y="130">Pause</text><text class="txt small muted" x="648" y="148">What is known?</text>
    <rect class="note" x="634" y="184" width="92" height="58" rx="6"/><text class="txt small" x="648" y="208">Plan</text><text class="txt small muted" x="648" y="226">Risk first</text>
    <rect class="note" x="634" y="262" width="92" height="58" rx="6"/><text class="txt small" x="648" y="286">Reveal</text><text class="txt small muted" x="648" y="304">Review only</text>
  </g>
</svg>
