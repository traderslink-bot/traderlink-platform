<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Uptrend Structure Break</title>
  <desc id="desc">Educational candlestick chart showing higher highs and higher lows before price breaks below the latest higher low.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Uptrend Structure Break</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Example only: a structure break changes context.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="332" y="236" width="220" height="34" fill="#1d4ed8" opacity=".18"/>
  <line x1="332" y1="236" x2="552" y2="236" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="332" y1="270" x2="552" y2="270" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="340" y="230" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Latest higher low zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="258" x2="96" y2="318"/><rect x="86" y="276" width="20" height="28"/>
      <line x1="162" y1="210" x2="162" y2="280"/><rect x="152" y="230" width="20" height="34"/>
      <line x1="228" y1="222" x2="228" y2="290"/><rect x="218" y="240" width="20" height="30"/>
      <line x1="294" y1="162" x2="294" y2="242"/><rect x="284" y="182" width="20" height="40"/>
      <line x1="360" y1="236" x2="360" y2="286"/><rect x="350" y="250" width="20" height="24"/>
      <line x1="426" y1="126" x2="426" y2="216"/><rect x="416" y="146" width="20" height="48"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="492" y1="142" x2="492" y2="268"/><rect x="482" y="174" width="20" height="70"/>
      <line x1="558" y1="242" x2="558" y2="326"/><rect x="548" y="262" width="20" height="42"/>
      <line x1="624" y1="262" x2="624" y2="338"/><rect x="614" y="280" width="20" height="36"/>
    </g>
  </g>
  <path d="M96 304 L162 245 L228 268 L294 202 L360 264 L426 170 L492 244 L558 304 L624 316" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="148" y="204" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">HH</text>
  <text x="214" y="308" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">HL</text>
  <text x="410" y="118" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">Higher high</text>
  <text x="535" y="348" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Break below structure</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Did the plan depend on the latest higher low holding?</text>
</svg>
