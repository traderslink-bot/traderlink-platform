<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Same candle shape in different locations</title>
  <desc id="desc">Three simple panels showing the same long upper wick candle shape in different chart locations.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Same candle shape, different location</text>
  <text x="44" y="88" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">The same candle can read differently by level, trend, and volume.</text>

  <g transform="translate(44 120)">
    <rect width="270" height="330" rx="10" fill="#0b1626" stroke="#1b3558"/>
    <text x="24" y="42" fill="#9cc7ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Near resistance</text>
    <rect x="28" y="78" width="214" height="30" fill="#1f6feb" opacity=".2"/>
    <line x1="135" y1="86" x2="135" y2="238" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="96" y="178" width="78" height="50" rx="5" fill="#ef4444"/>
    <text x="42" y="286" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="16">Same upper-wick candle</text>
  </g>

  <g transform="translate(345 120)">
    <rect width="270" height="330" rx="10" fill="#0b1626" stroke="#1b3558"/>
    <text x="24" y="42" fill="#9cc7ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">In the middle</text>
    <path d="M38 240L82 182L126 218L170 152L226 196" fill="none" stroke="#1b3558" stroke-width="4"/>
    <line x1="135" y1="86" x2="135" y2="238" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="96" y="178" width="78" height="50" rx="5" fill="#ef4444"/>
    <text x="42" y="286" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="16">Same upper-wick candle</text>
  </g>

  <g transform="translate(646 120)">
    <rect width="270" height="330" rx="10" fill="#0b1626" stroke="#1b3558"/>
    <text x="24" y="42" fill="#9cc7ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Near support</text>
    <rect x="28" y="230" width="214" height="30" fill="#1f6feb" opacity=".2"/>
    <line x1="135" y1="86" x2="135" y2="238" stroke="#d6e4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="96" y="178" width="78" height="50" rx="5" fill="#ef4444"/>
    <text x="42" y="286" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="16">Same upper-wick candle</text>
  </g>
</svg>
