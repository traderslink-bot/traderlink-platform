<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Same Candle Different Context</title>
  <desc id="desc">Three educational chart panels showing the same candle shape at resistance, in random chop, and at support.</desc>
  <rect width="960" height="500" rx="18" fill="#07111f"/>
  <text x="40" y="54" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Same candle, different context</text>
  <text x="40" y="80" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Candle meaning changes with location and follow-through.</text>
  <g transform="translate(40 112)">
    <rect width="270" height="300" rx="14" fill="#0b1626" stroke="#1f3554"/>
    <text x="20" y="36" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">At resistance</text>
    <g stroke="#18304e" stroke-width="1"><line x1="24" y1="86" x2="246" y2="86"/><line x1="24" y1="142" x2="246" y2="142"/><line x1="24" y1="198" x2="246" y2="198"/></g>
    <rect x="34" y="82" width="202" height="26" fill="#f59e0b" opacity=".16"/>
    <line x1="34" y1="108" x2="236" y2="108" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 7"/>
    <g stroke-linecap="round" stroke-width="3">
      <g stroke="#21c784" fill="#21c784"><line x1="58" y1="190" x2="58" y2="238"/><rect x="49" y="204" width="18" height="22" rx="2"/><line x1="100" y1="154" x2="100" y2="212"/><rect x="91" y="172" width="18" height="26" rx="2"/></g>
      <g stroke="#ef4444" fill="#ef4444"><line x1="144" y1="74" x2="144" y2="158"/><rect x="135" y="96" width="18" height="42" rx="2"/><line x1="186" y1="104" x2="186" y2="184"/><rect x="177" y="124" width="18" height="40" rx="2"/></g>
    </g>
    <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
      <text x="42" y="264" fill="#c8d7ee">Same candle shape</text>
      <text x="42" y="282" fill="#fecaca">Price fails near resistance</text>
      <text x="42" y="300" fill="#8ea6c8">Watch follow-through</text>
    </g>
  </g>
  <g transform="translate(345 112)">
    <rect width="270" height="300" rx="14" fill="#0b1626" stroke="#1f3554"/>
    <text x="20" y="36" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">In random chop</text>
    <g stroke="#18304e" stroke-width="1"><line x1="24" y1="86" x2="246" y2="86"/><line x1="24" y1="142" x2="246" y2="142"/><line x1="24" y1="198" x2="246" y2="198"/></g>
    <path d="M38 154 C72 126 98 188 128 150 C156 114 184 196 226 162" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 7" opacity=".45"/>
    <g stroke-linecap="round" stroke-width="3">
      <g stroke="#21c784" fill="#21c784"><line x1="58" y1="122" x2="58" y2="194"/><rect x="49" y="144" width="18" height="30" rx="2"/><line x1="100" y1="168" x2="100" y2="224"/><rect x="91" y="184" width="18" height="24" rx="2"/></g>
      <g stroke="#ef4444" fill="#ef4444"><line x1="144" y1="98" x2="144" y2="182"/><rect x="135" y="120" width="18" height="42" rx="2"/><line x1="186" y1="150" x2="186" y2="228"/><rect x="177" y="170" width="18" height="38" rx="2"/></g>
    </g>
    <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
      <text x="42" y="264" fill="#c8d7ee">Same candle shape</text>
      <text x="42" y="282" fill="#fecaca">No clear level</text>
      <text x="42" y="300" fill="#8ea6c8">May be noise</text>
    </g>
  </g>
  <g transform="translate(650 112)">
    <rect width="270" height="300" rx="14" fill="#0b1626" stroke="#1f3554"/>
    <text x="20" y="36" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">At support</text>
    <g stroke="#18304e" stroke-width="1"><line x1="24" y1="86" x2="246" y2="86"/><line x1="24" y1="142" x2="246" y2="142"/><line x1="24" y1="198" x2="246" y2="198"/></g>
    <rect x="34" y="192" width="202" height="26" fill="#1d4ed8" opacity=".18"/>
    <line x1="34" y1="192" x2="236" y2="192" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
    <g stroke-linecap="round" stroke-width="3">
      <g stroke="#ef4444" fill="#ef4444"><line x1="58" y1="104" x2="58" y2="176"/><rect x="49" y="124" width="18" height="34" rx="2"/><line x1="100" y1="138" x2="100" y2="206"/><rect x="91" y="156" width="18" height="34" rx="2"/><line x1="144" y1="148" x2="144" y2="232"/><rect x="135" y="170" width="18" height="42" rx="2"/></g>
      <g stroke="#21c784" fill="#21c784"><line x1="186" y1="144" x2="186" y2="220"/><rect x="177" y="166" width="18" height="34" rx="2"/></g>
    </g>
    <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
      <text x="42" y="264" fill="#c8d7ee">Same candle shape</text>
      <text x="42" y="282" fill="#bbf7d0">Price reacts near support</text>
      <text x="42" y="300" fill="#8ea6c8">Next candles matter</text>
    </g>
  </g>
  <rect x="40" y="432" width="880" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="58" y="456" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Candle meaning changes with location.</text>
</svg>
