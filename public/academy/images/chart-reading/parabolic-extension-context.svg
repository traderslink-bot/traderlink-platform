<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Parabolic extension context</title><desc id="desc">Candlestick chart showing an accelerating parabolic move far above support with volume and extension-risk review labels.</desc><rect width="960" height="540" fill="#07111f"/><rect x="48" y="40" width="864" height="350" rx="10" fill="#0b1626" stroke="#1b3558"/><g stroke="#19304d"><path d="M80 100H880M80 160H880M80 220H880M80 280H880M80 340H880"/></g><rect x="100" y="312" width="650" height="30" fill="#1f6feb" opacity=".18"/><text x="112" y="366" fill="#9cc7ff" font-family="Arial" font-size="18">Nearest structure is far below</text><g stroke-width="3" stroke-linecap="round"><g stroke="#22c55e" fill="#22c55e"><line x1="145" y1="302" x2="145" y2="346"/><rect x="134" y="314" width="22" height="20" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="205" y1="270" x2="205" y2="332"/><rect x="194" y="284" width="22" height="36" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="265" y1="220" x2="265" y2="306"/><rect x="254" y="238" width="22" height="54" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="325" y1="160" x2="325" y2="272"/><rect x="314" y="182" width="22" height="76" rx="2"/></g><g stroke="#22c55e" fill="#22c55e"><line x1="385" y1="95" x2="385" y2="230"/><rect x="374" y="118" width="22" height="94" rx="2"/></g><g stroke="#ef4444" fill="#ef4444"><line x1="445" y1="82" x2="445" y2="205"/><rect x="434" y="118" width="22" height="62" rx="2"/></g></g><path d="M132 332C210 318 285 270 390 112" fill="none" stroke="#9cc7ff" stroke-width="3"/><text x="510" y="128" fill="#d6e4ff" font-family="Arial" font-size="20">Acceleration increases risk distance</text><text x="510" y="168" fill="#d6e4ff" font-family="Arial" font-size="18">Review chase behavior, halts, spread, and exits</text><rect x="48" y="414" width="864" height="82" rx="10" fill="#0b1626" stroke="#1b3558"/><g><rect x="137" y="468" width="22" height="15" fill="#22c55e" opacity=".75"/><rect x="197" y="455" width="22" height="28" fill="#22c55e" opacity=".75"/><rect x="257" y="438" width="22" height="45" fill="#22c55e" opacity=".75"/><rect x="317" y="420" width="22" height="63" fill="#22c55e" opacity=".75"/><rect x="377" y="414" width="22" height="69" fill="#22c55e" opacity=".75"/><rect x="437" y="424" width="22" height="59" fill="#ef4444" opacity=".75"/></g><text x="515" y="464" fill="#d6e4ff" font-family="Arial" font-size="19">Fast movement is not the same as clean risk.</text></svg>
