<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Level Breakout Failed Hold Example</title>
  <desc id="desc">Educational candlestick chart showing price breaking above a level and then failing back below the breakout zone.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Breakout Failed Hold</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Watch whether the breakout stayed above the level.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="190" width="626" height="40" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="190" x2="690" y2="190" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="230" x2="690" y2="230" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="520" y="184" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Breakout zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="258" x2="96" y2="312"/>
      <rect x="86" y="274" width="20" height="24"/>
      <line x1="162" y1="232" x2="162" y2="292"/>
      <rect x="152" y="248" width="20" height="28"/>
      <line x1="228" y1="204" x2="228" y2="270"/>
      <rect x="218" y="222" width="20" height="30"/>
      <line x1="294" y1="142" x2="294" y2="232"/>
      <rect x="284" y="164" width="20" height="44"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="360" y1="126" x2="360" y2="244"/>
      <rect x="350" y="154" width="20" height="66"/>
      <line x1="426" y1="198" x2="426" y2="286"/>
      <rect x="416" y="220" width="20" height="44"/>
      <line x1="492" y1="224" x2="492" y2="306"/>
      <rect x="482" y="244" width="20" height="40"/>
      <line x1="558" y1="236" x2="558" y2="314"/>
      <rect x="548" y="254" width="20" height="38"/>
      <line x1="624" y1="220" x2="624" y2="302"/>
      <rect x="614" y="240" width="20" height="40"/>
    </g>
  </g>
  <path d="M96 298 C153 268 198 239 229 237 C269 235 311 172 361 219 C400 255 443 264 493 284 C538 306 580 276 625 279" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="270" y="132" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">Break attempt</text>
  <text x="372" y="306" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Fails back below zone</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Check: did the plan respect the failed hold, or change after entry?</text>
</svg>
