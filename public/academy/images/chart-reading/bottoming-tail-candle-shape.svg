<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bottoming tail candle shape</title>
  <desc id="desc">Clean candle diagram showing a bottoming tail candle with a long lower tail and body near the upper part of the candle.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Bottoming tail candle shape</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Price traded lower, then closed back near the upper part of the candle range.</text>
  <g transform="translate(480 150)">
    <line x1="0" y1="58" x2="0" y2="280" stroke="#d6e4ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-54" y="42" width="108" height="64" rx="6" fill="#22c55e"/>
    <text x="-178" y="320" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="16">Long lower tail, body near the top.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#8ea6c8">
    <text x="626" y="222">Body closes away from the low</text>
    <path d="M620 216L538 218" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="538" cy="218" r="4" fill="#38bdf8"/>
    <text x="234" y="386">Lower tail is the feature</text>
    <path d="M384 380L474 410" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="474" cy="410" r="4" fill="#38bdf8"/>
  </g>
</svg>
