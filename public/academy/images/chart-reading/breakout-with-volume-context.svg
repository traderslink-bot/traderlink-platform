  <path d="M96 290 C154 262 204 240 229 236 C268 230 310 209 361 189 C407 171 447 155 492 191 C528 220 577 148 625 128" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="332" y="136" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">Break above level</text>
  <text x="500" y="232" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Watch whether it holds</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Volume expands into breakout</text>
  <g fill="#1d4ed8" opacity=".8">
