<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Resistance Level Break Example</title>
  <desc id="desc">Educational candlestick chart showing price breaking above a resistance zone and holding above it with volume context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Resistance Level Break</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Example only: volume, hold, and risk matter after a break.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="174" width="626" height="42" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="174" x2="690" y2="174" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="216" x2="690" y2="216" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="514" y="168" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Prior resistance zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="244" x2="96" y2="306"/>
      <rect x="86" y="264" width="20" height="28" rx="2"/>
      <line x1="162" y1="214" x2="162" y2="284"/>
      <rect x="152" y="232" width="20" height="34" rx="2"/>
      <line x1="294" y1="188" x2="294" y2="256"/>
      <rect x="284" y="208" width="20" height="30" rx="2"/>
      <line x1="360" y1="138" x2="360" y2="230"/>
      <rect x="350" y="158" width="20" height="48" rx="2"/>
      <line x1="426" y1="112" x2="426" y2="196"/>
      <rect x="416" y="132" width="20" height="42" rx="2"/>
      <line x1="558" y1="116" x2="558" y2="208"/>
      <rect x="548" y="138" width="20" height="42" rx="2"/>
      <line x1="624" y1="88" x2="624" y2="178"/>
      <rect x="614" y="108" width="20" height="44" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="228" y1="190" x2="228" y2="274"/>
      <rect x="218" y="212" width="20" height="40" rx="2"/>
      <line x1="492" y1="130" x2="492" y2="224"/>
      <rect x="482" y="154" width="20" height="46" rx="2"/>
    </g>
  </g>
  <path d="M96 288 C146 259 194 224 229 246 C263 269 312 214 361 181 C407 151 447 167 492 199 C535 221 576 157 625 132" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="338" y="126" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">Break above zone</text>
  <text x="492" y="238" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Retest holds above old resistance</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Volume expands into break</text>
  <g fill="#1d4ed8" opacity=".8">
    <rect x="178" y="391" width="20" height="12"/>
    <rect x="218" y="389" width="20" height="14"/>
    <rect x="258" y="386" width="20" height="17"/>
    <rect x="298" y="379" width="20" height="24"/>
    <rect x="338" y="368" width="20" height="35"/>
    <rect x="378" y="371" width="20" height="32"/>
    <rect x="418" y="376" width="20" height="27"/>
    <rect x="458" y="388" width="20" height="15"/>
    <rect x="498" y="384" width="20" height="19"/>
    <rect x="538" y="379" width="20" height="24"/>
    <rect x="578" y="374" width="20" height="29"/>
  </g>
</svg>
