<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.0 0.0 760.0 540.0" role="img" aria-labelledby="title desc">
  <title id="title">Resistance Level Rejection Example</title>
  <desc id="desc">Educational candlestick chart showing price testing a resistance zone and rejecting with volume context.</desc>
  <rect width="760" height="540.0" rx="18" fill="#07111f" />
