<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Resistance Level Rejection Example</title>
  <desc id="desc">Educational candlestick chart showing price testing a resistance zone and rejecting with volume context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Resistance Level Rejection</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Example only: resistance is a review zone, not automatic reversal.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="118" width="626" height="44" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="118" x2="690" y2="118" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="162" x2="690" y2="162" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="520" y="112" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Resistance zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="260" x2="96" y2="320"/>
      <rect x="86" y="278" width="20" height="28" rx="2"/>
      <line x1="162" y1="220" x2="162" y2="292"/>
      <rect x="152" y="238" width="20" height="36" rx="2"/>
      <line x1="228" y1="184" x2="228" y2="258"/>
      <rect x="218" y="204" width="20" height="34" rx="2"/>
      <line x1="294" y1="140" x2="294" y2="230"/>
      <rect x="284" y="166" width="20" height="40" rx="2"/>
      <line x1="426" y1="132" x2="426" y2="236"/>
      <rect x="416" y="158" width="20" height="46" rx="2"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="360" y1="100" x2="360" y2="214"/>
      <rect x="350" y="124" width="20" height="64" rx="2"/>
      <line x1="492" y1="108" x2="492" y2="244"/>
      <rect x="482" y="138" width="20" height="70" rx="2"/>
      <line x1="558" y1="164" x2="558" y2="270"/>
      <rect x="548" y="188" width="20" height="54" rx="2"/>
      <line x1="624" y1="198" x2="624" y2="292"/>
      <rect x="614" y="218" width="20" height="46" rx="2"/>
    </g>
  </g>
  <path d="M96 304 C160 264 205 232 229 222 C265 203 310 164 361 151 C410 139 449 168 492 207 C535 244 579 241 625 257" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="306" y="98" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Wick into resistance</text>
  <text x="498" y="282" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Rejects back below zone</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Volume context</text>
  <g fill="#1d4ed8" opacity=".8">
    <rect x="178" y="390" width="20" height="13"/>
    <rect x="218" y="384" width="20" height="19"/>
    <rect x="258" y="379" width="20" height="24"/>
    <rect x="298" y="371" width="20" height="32"/>
    <rect x="338" y="366" width="20" height="37"/>
    <rect x="378" y="374" width="20" height="29"/>
    <rect x="418" y="382" width="20" height="21"/>
    <rect x="458" y="388" width="20" height="15"/>
    <rect x="498" y="390" width="20" height="13"/>
    <rect x="538" y="386" width="20" height="17"/>
    <rect x="578" y="391" width="20" height="12"/>
  </g>
</svg>
