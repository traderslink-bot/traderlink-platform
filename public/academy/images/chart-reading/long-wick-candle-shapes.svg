<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Long wick candle shapes</title>
  <desc id="desc">Clean candle diagram showing long upper wick and long lower wick candle shapes.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Long wick candle shapes</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">A long wick means price traded far beyond the body before closing back inside the range.</text>
  <g transform="translate(330 170)">
    <text x="-82" y="-22" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Long upper wick</text>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#d6e4ff" stroke-width="9" stroke-linecap="round"/>
    <rect x="-46" y="136" width="92" height="58" rx="6" fill="#ef4444"/>
    <text x="-116" y="260" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Body near the lower part.</text>
  </g>
  <g transform="translate(650 170)">
    <text x="-82" y="-22" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="21" font-weight="700">Long lower wick</text>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#d6e4ff" stroke-width="9" stroke-linecap="round"/>
    <rect x="-46" y="28" width="92" height="58" rx="6" fill="#22c55e"/>
    <text x="-116" y="260" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">Body near the upper part.</text>
  </g>
</svg>
