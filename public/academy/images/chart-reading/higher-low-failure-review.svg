<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Higher Low Failure Context</title>
  <desc id="desc">Educational candlestick chart showing an uptrend losing the latest higher low and shifting into a spread/depth area with volume context.</desc>
