  <line x1="154" y1="274" x2="344" y2="274" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="164" y="236" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Nearest support / higher low</text>
