<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">New High Of Day Chase Risk</title>
  <desc id="desc">Educational candlestick chart showing repeated new high of day pushes getting farther from support and creating chase-risk context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="318" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">New High Of Day Chase Risk</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Repeated new highs can become extended far from structure.</text>
  <g stroke="#18304e" stroke-width="1">
