  <text x="44" y="385" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Context: was the entry near structure, or far above the level after repeated alerts?</text>
  <text x="44" y="404" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Strength can still be poor trade location when price is extended.</text>
