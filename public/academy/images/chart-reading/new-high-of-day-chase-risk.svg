    <text x="508" y="280" fill="#fecaca">Far from support</text>
    <text x="566" y="124" fill="#fecaca">Volume fading</text>
    <text x="414" y="330" fill="#fecaca">Alert-driven chase risk</text>
  </g>
  <g>
    <rect x="70" y="326" width="14" height="18" fill="#21c784" opacity=".75"/><rect x="96" y="318" width="14" height="26" fill="#21c784" opacity=".8"/><rect x="122" y="330" width="14" height="14" fill="#ef4444" opacity=".65"/><rect x="148" y="306" width="14" height="38" fill="#21c784" opacity=".86"/><rect x="174" y="300" width="14" height="44" fill="#21c784" opacity=".9"/><rect x="200" y="318" width="14" height="26" fill="#ef4444" opacity=".7"/><rect x="226" y="294" width="14" height="50" fill="#21c784" opacity=".95"/><rect x="252" y="306" width="14" height="38" fill="#21c784" opacity=".86"/><rect x="278" y="318" width="14" height="26" fill="#ef4444" opacity=".68"/><rect x="304" y="302" width="14" height="42" fill="#21c784" opacity=".88"/><rect x="330" y="316" width="14" height="28" fill="#21c784" opacity=".7"/><rect x="356" y="322" width="14" height="22" fill="#ef4444" opacity=".65"/>
