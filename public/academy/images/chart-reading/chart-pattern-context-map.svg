ure</text><rect x="44" y="414" width="872" height="82" rx="10" fill="#0b1626" stroke="#1b3558"/><g><rect x="128" y="462" width="22" height="21" fill="#22c55e" opacity=".75"/><rect x="178" y="450" width="22" height="33" fill="#22c55e" opacity=".75"/><rect x="228" y="456" width="22" height="27" fill="#ef4444" opacity=".75"/><rect x="278" y="438" width="22" height="45" fill="#22c55e" opacity=".75"/><rect x="328" y="446" width="22" height="37" fill="#ef4444" opacity=".75"/><rect x="378" y="422" width="22" height="61" fill="#22c55e" opacity=".75"/></g><text x="470" y="464" fill="#d6e4ff" font-family="Arial" font-size="19">Patterns organize level, volume, risk, and failure.</text></svg>
