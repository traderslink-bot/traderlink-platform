<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Support Level Break Example</title>
  <desc id="desc">Educational candlestick chart showing price breaking below a support zone, with higher volume and a later retest.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Support Level Break</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A break changes the level map and risk.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="214" width="626" height="40" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="214" x2="690" y2="214" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="254" x2="690" y2="254" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="518" y="208" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Prior support zone</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="176" x2="96" y2="248"/>
      <rect x="86" y="198" width="20" height="34"/>
      <line x1="162" y1="164" x2="162" y2="238"/>
      <rect x="152" y="186" width="20" height="32"/>
      <line x1="294" y1="166" x2="294" y2="242"/>
      <rect x="284" y="188" width="20" height="36"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="129" y1="152" x2="129" y2="252"/>
      <rect x="119" y="172" width="20" height="54"/>
      <line x1="228" y1="150" x2="228" y2="260"/>
      <rect x="218" y="174" width="20" height="62"/>
      <line x1="360" y1="178" x2="360" y2="304"/>
      <rect x="350" y="206" width="20" height="70"/>
      <line x1="426" y1="232" x2="426" y2="326"/>
      <rect x="416" y="252" width="20" height="48"/>
      <line x1="492" y1="222" x2="492" y2="298"/>
      <rect x="482" y="238" width="20" height="42"/>
      <line x1="558" y1="194" x2="558" y2="280"/>
      <rect x="548" y="216" width="20" height="38"/>
      <line x1="624" y1="204" x2="624" y2="306"/>
      <rect x="614" y="226" width="20" height="54"/>
    </g>
  </g>
  <path d="M95 229 C153 202 202 193 229 229 C255 261 310 212 360 272 C411 331 452 268 493 252 C538 232 578 245 625 278" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="78" y="288" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Support tests</text>
  <text x="348" y="330" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Break below the zone</text>
  <text x="525" y="185" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Retest area</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Volume expands on break</text>
  <g fill="#1d4ed8" opacity=".8">
    <rect x="178" y="391" width="20" height="12"/>
    <rect x="218" y="386" width="20" height="17"/>
    <rect x="258" y="390" width="20" height="13"/>
    <rect x="298" y="384" width="20" height="19"/>
    <rect x="338" y="372" width="20" height="31"/>
    <rect x="378" y="368" width="20" height="35"/>
    <rect x="418" y="376" width="20" height="27"/>
    <rect x="458" y="386" width="20" height="17"/>
    <rect x="498" y="390" width="20" height="13"/>
    <rect x="538" y="388" width="20" height="15"/>
    <rect x="578" y="384" width="20" height="19"/>
  </g>
</svg>
