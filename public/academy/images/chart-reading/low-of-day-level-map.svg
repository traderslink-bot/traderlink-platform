<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Low Of Day Level Map</title>
  <desc id="desc">Educational candlestick chart showing low of day as an intraday reference level with nearby premarket low and previous day low context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="318" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Low Of Day Level Map</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">LOD sits beside PML, PDL, volume, and distance from lower highs.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="116" x2="704" y2="116"/><line x1="58" y1="166" x2="704" y2="166"/><line x1="58" y1="216" x2="704" y2="216"/><line x1="58" y1="266" x2="704" y2="266"/>
  </g>
  <rect x="70" y="248" width="620" height="34" fill="#1d4ed8" opacity=".18"/>
  <line x1="70" y1="248" x2="690" y2="248" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="70" y1="282" x2="690" y2="282" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="70" y1="226" x2="690" y2="226" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 7" opacity=".8"/>
  <line x1="70" y1="300" x2="690" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7" opacity=".75"/>
  <text x="82" y="242" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Current LOD zone</text>
  <text x="548" y="222" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12">PML nearby</text>
  <text x="548" y="318" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">PDL below</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="96" y1="128" x2="96" y2="208"/><rect x="86" y="148" width="20" height="40" rx="2"/>
      <line x1="150" y1="170" x2="150" y2="250"/><rect x="140" y="190" width="20" height="40" rx="2"/>
      <line x1="204" y1="214" x2="204" y2="294"/><rect x="194" y="234" width="20" height="40" rx="2"/>
      <line x1="312" y1="230" x2="312" y2="310"/><rect x="302" y="250" width="20" height="40" rx="2"/>
      <line x1="420" y1="236" x2="420" y2="318"/><rect x="410" y="258" width="20" height="40" rx="2"/>
      <line x1="528" y1="242" x2="528" y2="320"/><rect x="518" y="262" width="20" height="38" rx="2"/>
    </g>
    <g stroke="#21c784" fill="#21c784">
      <line x1="258" y1="196" x2="258" y2="268"/><rect x="248" y="216" width="20" height="34" rx="2"/>
      <line x1="366" y1="206" x2="366" y2="280"/><rect x="356" y="226" width="20" height="34" rx="2"/>
      <line x1="474" y1="216" x2="474" y2="288"/><rect x="464" y="236" width="20" height="34" rx="2"/>
      <line x1="582" y1="220" x2="582" y2="292"/><rect x="572" y="240" width="20" height="34" rx="2"/>
    </g>
  </g>
  <path d="M96 168 L150 230 L204 274 L258 234 L312 290 L366 244 L420 298 L474 254 L528 300 L582 258" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".5"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="190" y="318" fill="#fecaca">LOD test</text>
    <text x="322" y="194" fill="#fecaca">Lower highs above level</text>
    <text x="516" y="336" fill="#bbf7d0">Reclaim risk</text>
  </g>
  <g>
    <rect x="70" y="326" width="14" height="18" fill="#ef4444" opacity=".7"/><rect x="96" y="316" width="14" height="28" fill="#ef4444" opacity=".82"/><rect x="122" y="330" width="14" height="14" fill="#21c784" opacity=".62"/><rect x="148" y="306" width="14" height="38" fill="#ef4444" opacity=".88"/><rect x="174" y="296" width="14" height="48" fill="#ef4444" opacity=".95"/><rect x="200" y="318" width="14" height="26" fill="#21c784" opacity=".7"/><rect x="226" y="302" width="14" height="42" fill="#ef4444" opacity=".9"/><rect x="252" y="312" width="14" height="32" fill="#ef4444" opacity=".78"/><rect x="278" y="322" width="14" height="22" fill="#21c784" opacity=".65"/><rect x="304" y="300" width="14" height="44" fill="#ef4444" opacity=".9"/><rect x="330" y="314" width="14" height="30" fill="#21c784" opacity=".72"/>
  </g>
  <rect x="28" y="362" width="704" height="50" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="385" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Context: did price pressure LOD with lower highs, or was the move already extended?</text>
  <text x="44" y="404" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">LOD is a reference level for intraday weakness.</text>
</svg>
