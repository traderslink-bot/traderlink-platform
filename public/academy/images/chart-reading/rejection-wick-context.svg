<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Rejection Wick With Context</title>
  <desc id="desc">Educational candlestick chart showing a long wick at a key level with follow-through context.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Rejection Wick Needs Context</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A wick matters more when it happens at a real level and has follow-through.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="150" width="626" height="38" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="150" x2="690" y2="150" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="188" x2="690" y2="188" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="532" y="144" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Key level</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="248" x2="96" y2="302"/>
      <rect x="86" y="264" width="20" height="24"/>
      <line x1="162" y1="224" x2="162" y2="284"/>
      <rect x="152" y="240" width="20" height="28"/>
      <line x1="228" y1="196" x2="228" y2="262"/>
      <rect x="218" y="214" width="20" height="30"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="294" y1="96" x2="294" y2="230"/>
      <rect x="284" y="158" width="20" height="46"/>
      <line x1="360" y1="154" x2="360" y2="252"/>
      <rect x="350" y="182" width="20" height="46"/>
      <line x1="426" y1="192" x2="426" y2="278"/>
      <rect x="416" y="212" width="20" height="42"/>
      <line x1="492" y1="210" x2="492" y2="294"/>
      <rect x="482" y="230" width="20" height="40"/>
      <line x1="558" y1="218" x2="558" y2="300"/>
      <rect x="548" y="238" width="20" height="38"/>
    </g>
    <g stroke="#21c784" fill="#21c784">
      <line x1="624" y1="232" x2="624" y2="300"/>
      <rect x="614" y="250" width="20" height="30"/>
    </g>
  </g>
  <path d="M96 285 C144 258 193 233 229 232 C261 231 285 160 295 203 C316 247 344 219 361 228 C398 247 442 252 493 270 C538 289 584 275 625 272" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="300" y="112" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Long wick at level</text>
  <text x="354" y="304" fill="#c8d7ee" font-family="Arial, sans-serif" font-size="13">Follow-through matters</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Context: was the wick at a known level, or just noise in the middle?</text>
</svg>
