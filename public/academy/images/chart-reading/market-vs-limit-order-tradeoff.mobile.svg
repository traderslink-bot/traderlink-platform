<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1136" viewBox="0 0 600 1136" role="img"><title>Buy orders: Market and limit</title><rect width="600" height="1136" fill="#08111f"/><text x="24" y="55" font-family="Arial,sans-serif" font-size="42" fill="#e8f1ff">Buy orders: Market and</text><text x="24" y="107" font-family="Arial,sans-serif" font-size="42" fill="#e8f1ff">limit</text><rect x="14" y="153" width="572" height="81" rx="8" fill="#101e30"/><text x="24" y="188" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">Quote: bid $1.98 / ask $2.08</text><rect x="14" y="244" width="572" height="81" rx="8" fill="#101e30"/><text x="24" y="279" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">Ask size: 500 shares</text><rect x="14" y="335" width="572" height="81" rx="8" fill="#101e30"/><text x="24" y="370" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">Market buy: 100 shares; no limit</text><rect x="14" y="426" width="572" height="81" rx="8" fill="#101e30"/><text x="24" y="461" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">Limit buy: 100 shares; limit $2.00</text><rect x="14" y="517" width="572" height="81" rx="8" fill="#101e30"/><text x="24" y="552" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">With this quote unchanged</text><rect x="14" y="608" width="572" height="81" rx="8" fill="#101e30"/><text x="24" y="643" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">Market buy: 100 × $2.08 = $208.00</text><rect x="14" y="699" width="572" height="121" rx="8" fill="#101e30"/><text x="24" y="734" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">Limit buy at $2.00: remains</text><text x="24" y="774" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">unfilled</text><rect x="14" y="830" width="572" height="121" rx="8" fill="#101e30"/><text x="24" y="865" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">The buy limit sets the highest</text><text x="24" y="905" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">acceptable price.</text><rect x="14" y="961" width="572" height="121" rx="8" fill="#101e30"/><text x="24" y="996" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">The market fill depends on</text><text x="24" y="1036" font-family="Arial,sans-serif" font-size="30" fill="#e8f1ff">available sell orders.</text></svg>