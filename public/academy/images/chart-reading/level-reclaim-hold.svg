<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Level Reclaim And Hold Example</title>
  <desc id="desc">Educational candlestick chart showing price losing a key level, reclaiming it, and holding above the zone.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="332" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Level Reclaim And Hold</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">Example only: watch whether price holds above the reclaimed zone.</text>
  <g stroke="#18304e" stroke-width="1">
    <line x1="58" y1="118" x2="704" y2="118"/>
    <line x1="58" y1="170" x2="704" y2="170"/>
    <line x1="58" y1="222" x2="704" y2="222"/>
    <line x1="58" y1="274" x2="704" y2="274"/>
  </g>
  <rect x="64" y="206" width="626" height="40" fill="#1d4ed8" opacity=".2"/>
  <line x1="64" y1="206" x2="690" y2="206" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="64" y1="246" x2="690" y2="246" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="514" y="200" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Reclaimed level</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="96" y1="178" x2="96" y2="250"/>
      <rect x="86" y="198" width="20" height="34"/>
      <line x1="294" y1="224" x2="294" y2="306"/>
      <rect x="284" y="246" width="20" height="36"/>
      <line x1="360" y1="198" x2="360" y2="278"/>
      <rect x="350" y="218" width="20" height="40"/>
      <line x1="426" y1="170" x2="426" y2="248"/>
      <rect x="416" y="188" width="20" height="38"/>
      <line x1="492" y1="160" x2="492" y2="240"/>
      <rect x="482" y="178" width="20" height="40"/>
      <line x1="558" y1="138" x2="558" y2="226"/>
      <rect x="548" y="158" width="20" height="42"/>
      <line x1="624" y1="128" x2="624" y2="212"/>
      <rect x="614" y="146" width="20" height="38"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="162" y1="180" x2="162" y2="270"/>
      <rect x="152" y="202" width="20" height="46"/>
      <line x1="228" y1="238" x2="228" y2="326"/>
      <rect x="218" y="258" width="20" height="44"/>
    </g>
  </g>
  <path d="M96 229 C147 205 185 224 228 303 C259 358 310 270 361 239 C405 213 446 219 493 199 C541 178 579 166 625 168" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".55"/>
  <text x="150" y="330" fill="#fecaca" font-family="Arial, sans-serif" font-size="13">Level lost first</text>
  <text x="354" y="150" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13">Reclaim and hold</text>
  <rect x="28" y="374" width="704" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="398" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Context: lost level -> reclaim -> hold above zone</text>
</svg>
