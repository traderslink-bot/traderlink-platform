<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Clean Versus Cluttered Level Map</title>
  <desc id="desc">Two educational chart panels comparing a clean key-level map with a cluttered level map.</desc>
  <rect width="920" height="500" rx="18" fill="#07111f"/>
  <text x="40" y="54" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Clean map versus cluttered map</text>
  <text x="40" y="80" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A useful level map makes price location easier to read.</text>
  <g transform="translate(40 112)">
    <rect width="400" height="300" rx="14" fill="#0b1626" stroke="#1f3554"/>
    <text x="22" y="36" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Clean level map</text>
    <g stroke="#18304e" stroke-width="1">
      <line x1="28" y1="78" x2="372" y2="78"/><line x1="28" y1="126" x2="372" y2="126"/><line x1="28" y1="174" x2="372" y2="174"/><line x1="28" y1="222" x2="372" y2="222"/>
    </g>
    <rect x="38" y="206" width="322" height="30" fill="#1d4ed8" opacity=".18"/>
    <line x1="38" y1="206" x2="360" y2="206" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
    <line x1="38" y1="236" x2="360" y2="236" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="48" y="200" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Nearest support</text>
    <rect x="38" y="92" width="322" height="30" fill="#f59e0b" opacity=".16"/>
    <line x1="38" y1="92" x2="360" y2="92" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 7"/>
    <line x1="38" y1="122" x2="360" y2="122" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="234" y="86" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12" font-weight="700">Nearest resistance</text>
    <line x1="38" y1="62" x2="360" y2="62" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 7"/>
    <text x="220" y="56" fill="#fecaca" font-family="Arial, sans-serif" font-size="12" font-weight="700">Next trouble area</text>
    <line x1="38" y1="254" x2="360" y2="254" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 7"/>
    <text x="48" y="272" fill="#fecaca" font-family="Arial, sans-serif" font-size="12" font-weight="700">Clear invalidation area</text>
    <g stroke-linecap="round" stroke-width="3">
      <g stroke="#21c784" fill="#21c784">
        <line x1="70" y1="220" x2="70" y2="258"/><rect x="61" y="230" width="18" height="16"/>
        <line x1="118" y1="196" x2="118" y2="244"/><rect x="109" y="210" width="18" height="22"/>
        <line x1="166" y1="166" x2="166" y2="224"/><rect x="157" y="182" width="18" height="28"/>
        <line x1="214" y1="132" x2="214" y2="198"/><rect x="205" y="150" width="18" height="32"/>
      </g>
      <g stroke="#ef4444" fill="#ef4444">
        <line x1="262" y1="116" x2="262" y2="184"/><rect x="253" y="134" width="18" height="34"/>
        <line x1="310" y1="126" x2="310" y2="190"/><rect x="301" y="144" width="18" height="30"/>
      </g>
    </g>
    <path d="M70 246 C112 224 139 202 166 202 C194 202 216 160 263 168 C285 172 298 166 310 174" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".52"/>
    <circle cx="214" cy="166" r="6" fill="#e8f1ff"/>
    <text x="225" y="171" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Current price</text>
  </g>
  <g transform="translate(480 112)">
    <rect width="400" height="300" rx="14" fill="#0b1626" stroke="#1f3554"/>
    <text x="22" y="36" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Cluttered level map</text>
    <g stroke="#18304e" stroke-width="1">
      <line x1="28" y1="78" x2="372" y2="78"/><line x1="28" y1="126" x2="372" y2="126"/><line x1="28" y1="174" x2="372" y2="174"/><line x1="28" y1="222" x2="372" y2="222"/>
    </g>
    <g stroke-width="2" stroke-dasharray="5 6" opacity=".78">
      <line x1="38" y1="58" x2="360" y2="58" stroke="#fbbf24"/><line x1="38" y1="86" x2="360" y2="86" stroke="#60a5fa"/>
      <line x1="38" y1="102" x2="360" y2="102" stroke="#fbbf24"/><line x1="38" y1="118" x2="360" y2="118" stroke="#60a5fa"/>
      <line x1="38" y1="136" x2="360" y2="136" stroke="#fbbf24"/><line x1="38" y1="152" x2="360" y2="152" stroke="#60a5fa"/>
      <line x1="38" y1="170" x2="360" y2="170" stroke="#fbbf24"/><line x1="38" y1="188" x2="360" y2="188" stroke="#60a5fa"/>
      <line x1="38" y1="206" x2="360" y2="206" stroke="#fbbf24"/><line x1="38" y1="226" x2="360" y2="226" stroke="#60a5fa"/>
      <line x1="38" y1="254" x2="360" y2="254" stroke="#ef4444"/>
    </g>
    <g stroke-linecap="round" stroke-width="3">
      <g stroke="#21c784" fill="#21c784">
        <line x1="70" y1="220" x2="70" y2="258"/><rect x="61" y="230" width="18" height="16"/>
        <line x1="118" y1="196" x2="118" y2="244"/><rect x="109" y="210" width="18" height="22"/>
        <line x1="166" y1="166" x2="166" y2="224"/><rect x="157" y="182" width="18" height="28"/>
        <line x1="214" y1="132" x2="214" y2="198"/><rect x="205" y="150" width="18" height="32"/>
      </g>
      <g stroke="#ef4444" fill="#ef4444">
        <line x1="262" y1="116" x2="262" y2="184"/><rect x="253" y="134" width="18" height="34"/>
        <line x1="310" y1="126" x2="310" y2="190"/><rect x="301" y="144" width="18" height="30"/>
      </g>
    </g>
    <path d="M70 246 C112 224 139 202 166 202 C194 202 216 160 263 168 C285 172 298 166 310 174" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".42"/>
    <g fill="#fecaca" font-family="Arial, sans-serif" font-size="12" font-weight="700">
      <text x="50" y="276">Too many small levels</text>
      <text x="180" y="72">Far-away levels</text>
      <text x="188" y="142">Repeated lines inside one zone</text>
      <text x="202" y="244">Harder to read</text>
    </g>
  </g>
  <rect x="40" y="432" width="840" height="38" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="58" y="456" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">A good level map should make price location clearer.</text>
</svg>
