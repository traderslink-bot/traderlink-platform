<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Stock catalyst quality review dashboard</title>
  <desc id="desc">Dark trading dashboard showing a catalyst quality checklist beside a realistic red and green candlestick reaction chart with volume bars.</desc>
  <rect width="960" height="560" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="904" height="504" rx="14" fill="#0b1628" stroke="#1d3557"/>
  <text x="52" y="66" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Catalyst Quality Context</text>
  <text x="52" y="92" fill="#8fa7c8" font-family="Arial, sans-serif" font-size="14">Context the details, source, filings, and market reaction before judging the news.</text>

  <rect x="52" y="120" width="360" height="370" rx="10" fill="#081323" stroke="#172a46"/>
  <text x="78" y="154" fill="#e6f0ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Catalyst Detail Panel</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="78" y="180" width="306" height="44" rx="7" fill="#10233c" stroke="#2d8cff"/>
    <text x="96" y="207" fill="#d8eaff">Specific terms included?</text>
    <text x="354" y="207" fill="#26c281" text-anchor="end">Context</text>
    <rect x="78" y="238" width="306" height="44" rx="7" fill="#10233c" stroke="#2d8cff"/>
    <text x="96" y="265" fill="#d8eaff">Named party or source?</text>
    <text x="354" y="265" fill="#26c281" text-anchor="end">Check</text>
    <rect x="78" y="296" width="306" height="44" rx="7" fill="#10233c" stroke="#2d8cff"/>
    <text x="96" y="323" fill="#d8eaff">Related SEC filing?</text>
    <text x="354" y="323" fill="#f5c26b" text-anchor="end">Verify</text>
    <rect x="78" y="354" width="306" height="44" rx="7" fill="#10233c" stroke="#2d8cff"/>
    <text x="96" y="381" fill="#d8eaff">Dilution language?</text>
    <text x="354" y="381" fill="#f5c26b" text-anchor="end">Context</text>
    <rect x="78" y="412" width="306" height="44" rx="7" fill="#10233c" stroke="#2d8cff"/>
    <text x="96" y="439" fill="#d8eaff">Volume still building?</text>
    <text x="354" y="439" fill="#8fa7c8" text-anchor="end">Observe</text>
  </g>

  <rect x="438" y="120" width="470" height="254" rx="10" fill="#081323" stroke="#172a46"/>
  <g stroke="#172a46" stroke-width="1">
    <line x1="462" y1="164" x2="884" y2="164"/>
    <line x1="462" y1="206" x2="884" y2="206"/>
    <line x1="462" y1="248" x2="884" y2="248"/>
    <line x1="462" y1="290" x2="884" y2="290"/>
    <line x1="462" y1="332" x2="884" y2="332"/>
  </g>
  <text x="462" y="146" fill="#6f86a7" font-family="Arial, sans-serif" font-size="12">Price reaction</text>

  <g stroke-linecap="round" stroke-width="3">
    <line x1="482" y1="304" x2="482" y2="336" stroke="#26c281"/>
    <rect x="472" y="316" width="20" height="12" rx="2" fill="#26c281"/>
    <line x1="515" y1="296" x2="515" y2="330" stroke="#ef5350"/>
    <rect x="505" y="306" width="20" height="17" rx="2" fill="#ef5350"/>
    <line x1="548" y1="282" x2="548" y2="322" stroke="#26c281"/>
    <rect x="538" y="296" width="20" height="17" rx="2" fill="#26c281"/>
    <line x1="581" y1="242" x2="581" y2="306" stroke="#26c281"/>
    <rect x="571" y="260" width="20" height="32" rx="2" fill="#26c281"/>
    <line x1="614" y1="202" x2="614" y2="276" stroke="#26c281"/>
    <rect x="604" y="222" width="20" height="39" rx="2" fill="#26c281"/>
    <line x1="647" y1="176" x2="647" y2="260" stroke="#ef5350"/>
    <rect x="637" y="198" width="20" height="46" rx="2" fill="#ef5350"/>
    <line x1="680" y1="184" x2="680" y2="264" stroke="#26c281"/>
    <rect x="670" y="206" width="20" height="37" rx="2" fill="#26c281"/>
    <line x1="713" y1="198" x2="713" y2="276" stroke="#ef5350"/>
    <rect x="703" y="216" width="20" height="45" rx="2" fill="#ef5350"/>
    <line x1="746" y1="218" x2="746" y2="292" stroke="#ef5350"/>
    <rect x="736" y="236" width="20" height="38" rx="2" fill="#ef5350"/>
    <line x1="779" y1="232" x2="779" y2="304" stroke="#26c281"/>
    <rect x="769" y="250" width="20" height="32" rx="2" fill="#26c281"/>
    <line x1="812" y1="238" x2="812" y2="312" stroke="#ef5350"/>
    <rect x="802" y="256" width="20" height="37" rx="2" fill="#ef5350"/>
    <line x1="845" y1="248" x2="845" y2="318" stroke="#ef5350"/>
    <rect x="835" y="266" width="20" height="32" rx="2" fill="#ef5350"/>
  </g>
  <rect x="590" y="146" width="116" height="34" rx="7" fill="#15345c" stroke="#2d8cff"/>
  <text x="648" y="168" fill="#d8eaff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">News release</text>

  <rect x="438" y="388" width="470" height="102" rx="10" fill="#081323" stroke="#172a46"/>
  <text x="462" y="414" fill="#6f86a7" font-family="Arial, sans-serif" font-size="12">Volume response</text>
  <g>
    <rect x="472" y="460" width="20" height="16" fill="#26c281" opacity=".58"/>
    <rect x="505" y="458" width="20" height="18" fill="#ef5350" opacity=".58"/>
    <rect x="538" y="452" width="20" height="24" fill="#26c281" opacity=".65"/>
    <rect x="571" y="426" width="20" height="50" fill="#26c281" opacity=".9"/>
    <rect x="604" y="398" width="20" height="78" fill="#26c281"/>
    <rect x="637" y="412" width="20" height="64" fill="#ef5350" opacity=".9"/>
    <rect x="670" y="420" width="20" height="56" fill="#26c281" opacity=".78"/>
    <rect x="703" y="438" width="20" height="38" fill="#ef5350" opacity=".72"/>
    <rect x="736" y="450" width="20" height="26" fill="#ef5350" opacity=".65"/>
    <rect x="769" y="454" width="20" height="22" fill="#26c281" opacity=".6"/>
    <rect x="802" y="458" width="20" height="18" fill="#ef5350" opacity=".58"/>
    <rect x="835" y="461" width="20" height="15" fill="#ef5350" opacity=".55"/>
  </g>
</svg>
