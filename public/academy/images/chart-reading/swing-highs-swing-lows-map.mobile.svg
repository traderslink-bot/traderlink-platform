  <text x="36" y="194.5" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="36">Mark the major turns that define</text>
  <text x="36" y="239.5" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="36">structure, not every candle.</text>
