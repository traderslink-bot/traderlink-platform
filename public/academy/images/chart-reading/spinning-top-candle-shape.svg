<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Spinning top candle shape</title>
  <desc id="desc">Clean candle diagram showing a spinning top candle with a small body and wicks on both sides.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="48" y="40" width="864" height="420" rx="10" fill="#0b1626" stroke="#1b3558"/>
  <g stroke="#19304d" stroke-width="1">
    <path d="M88 130H872M88 220H872M88 310H872M88 400H872"/>
  </g>
  <text x="64" y="88" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Spinning top candle shape</text>
  <text x="64" y="120" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="15">A spinning top has a small body with wicks on both sides.</text>

  <g transform="translate(480 164)">
    <line x1="0" y1="0" x2="0" y2="245" stroke="#d6e4ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-58" y="96" width="116" height="54" rx="6" fill="#22c55e"/>
    <text x="-170" y="292" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="16">Small body: neither side closes in clear control.</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#8ea6c8">
    <text x="230" y="218">Upper wick</text>
    <path d="M314 212L470 180" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="470" cy="180" r="4" fill="#38bdf8"/>
    <text x="624" y="282">Small body</text>
    <path d="M620 276L540 286" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="540" cy="286" r="4" fill="#38bdf8"/>
    <text x="230" y="388">Lower wick</text>
    <path d="M314 382L470 394" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="470" cy="394" r="4" fill="#38bdf8"/>
  </g>
</svg>
