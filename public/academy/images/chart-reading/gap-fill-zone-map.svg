<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Gap Fill Zone Map</title>
  <desc id="desc">Educational candlestick chart showing a gap zone between prior close and current open with price moving into the gap area.</desc>
  <rect width="760" height="440" rx="18" fill="#07111f"/>
  <rect x="28" y="28" width="704" height="318" rx="14" fill="#0b1626" stroke="#1f3554"/>
  <text x="44" y="58" fill="#e8f1ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Gap Fill Zone Map</text>
  <text x="44" y="82" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="14">The gap area becomes a reference zone, not a required target.</text>
  <g stroke="#18304e" stroke-width="1"><line x1="58" y1="116" x2="704" y2="116"/><line x1="58" y1="166" x2="704" y2="166"/><line x1="58" y1="216" x2="704" y2="216"/><line x1="58" y1="266" x2="704" y2="266"/></g>
  <rect x="78" y="154" width="600" height="100" fill="#1d4ed8" opacity=".14"/>
  <line x1="78" y1="154" x2="678" y2="154" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="78" y1="254" x2="678" y2="254" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="78" y1="204" x2="678" y2="204" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 7" opacity=".85"/>
  <text x="88" y="146" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Current open</text>
  <text x="88" y="276" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Prior close</text>
  <text x="520" y="198" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12">Partial fill</text>
  <text x="526" y="236" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="12">Gap area</text>
  <text x="500" y="276" fill="#9cc8ff" font-family="Arial, sans-serif" font-size="12">Full fill area</text>
  <g stroke-linecap="round" stroke-width="3">
    <g stroke="#21c784" fill="#21c784">
      <line x1="112" y1="260" x2="112" y2="318"/><rect x="102" y="278" width="20" height="26"/>
      <line x1="166" y1="238" x2="166" y2="306"/><rect x="156" y="258" width="20" height="30"/>
      <line x1="274" y1="132" x2="274" y2="206"/><rect x="264" y="152" width="20" height="34"/>
    </g>
    <g stroke="#ef4444" fill="#ef4444">
      <line x1="220" y1="128" x2="220" y2="210"/><rect x="210" y="150" width="20" height="42"/>
      <line x1="328" y1="146" x2="328" y2="226"/><rect x="318" y="166" width="20" height="40"/>
      <line x1="382" y1="176" x2="382" y2="252"/><rect x="372" y="196" width="20" height="36"/>
      <line x1="436" y1="194" x2="436" y2="270"/><rect x="426" y="214" width="20" height="36"/>
      <line x1="490" y1="210" x2="490" y2="286"/><rect x="480" y="230" width="20" height="36"/>
    </g>
  </g>
  <path d="M112 304 L166 288 L220 192 M274 170 L328 206 L382 232 L436 250 L490 266" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".5"/>
  <g><rect x="84" y="326" width="14" height="18" fill="#21c784" opacity=".7"/><rect x="118" y="316" width="14" height="28" fill="#21c784" opacity=".8"/><rect x="152" y="292" width="14" height="52" fill="#21c784" opacity=".95"/><rect x="186" y="302" width="14" height="42" fill="#ef4444" opacity=".86"/><rect x="220" y="310" width="14" height="34" fill="#ef4444" opacity=".78"/><rect x="254" y="318" width="14" height="26" fill="#ef4444" opacity=".7"/></g>
  <rect x="28" y="376" width="704" height="36" rx="10" fill="#091827" stroke="#1f3554"/>
  <text x="44" y="399" fill="#8ea6c8" font-family="Arial, sans-serif" font-size="13">Context: did price enter the gap with volume, or only drift into it?</text>
</svg>
