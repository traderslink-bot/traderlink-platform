<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Halt Resume Spread Risk</title>
  <desc id="desc">Dark trading dashboard showing a halt resume with a realistic candlestick chart, wide bid ask spread, thin depth, and context labels for execution risk.</desc>
  <defs><style>
    .bg{fill:#0b1220}.panel{fill:#0f1a2b;stroke:#203651;stroke-width:1.5}.box{fill:#12263f;stroke:#2f80ed;stroke-width:1}.txt{fill:#d7e3f4;font-family:Arial,Helvetica,sans-serif}.small{font-size:12px}.label{font-size:13px;font-weight:700}.muted{fill:#8ea1bd}.grid{stroke:#22364f;opacity:.65}.green{fill:#22c55e;stroke:#22c55e}.red{fill:#ef4444;stroke:#ef4444}.wickG{stroke:#22c55e;stroke-width:2}.wickR{stroke:#ef4444;stroke-width:2}.volG{fill:#22c55e;opacity:.45}.volR{fill:#ef4444;opacity:.45}.warn{fill:rgba(245,158,11,.16);stroke:#f59e0b;stroke-width:1.5}
  </style></defs>
  <rect class="bg" width="760" height="430"/><rect class="panel" x="14" y="14" width="732" height="402" rx="8"/>
  <text class="txt label" x="34" y="42">Halt Resume: Spread, Depth, And Fill Risk</text>
  <text class="txt small muted" x="34" y="64">Resume conditions can change quickly. Context execution risk before interpreting the chart.</text>
  <g transform="translate(44 94)">
    <rect x="0" y="0" width="420" height="220" fill="#0c1626" stroke="#203651"/>
    <line class="grid" x1="0" y1="44" x2="420" y2="44"/><line class="grid" x1="0" y1="88" x2="420" y2="88"/><line class="grid" x1="0" y1="132" x2="420" y2="132"/><line class="grid" x1="0" y1="176" x2="420" y2="176"/>
    <rect class="warn" x="188" y="0" width="76" height="220"/><text class="txt small" x="200" y="110">Resume</text>
    <line class="wickG" x1="34" y1="142" x2="34" y2="172"/><rect class="green" x="27" y="152" width="14" height="10"/>
    <line class="wickG" x1="66" y1="112" x2="66" y2="164"/><rect class="green" x="59" y="132" width="14" height="20"/>
    <line class="wickR" x1="98" y1="90" x2="98" y2="166"/><rect class="red" x="91" y="112" width="14" height="36"/>
    <line class="wickG" x1="130" y1="58" x2="130" y2="150"/><rect class="green" x="123" y="88" width="14" height="42"/>
    <line class="wickR" x1="162" y1="50" x2="162" y2="154"/><rect class="red" x="155" y="76" width="14" height="54"/>
    <line class="wickR" x1="296" y1="62" x2="296" y2="178"/><rect class="red" x="286" y="98" width="20" height="42"/>
    <line class="wickG" x1="340" y1="94" x2="340" y2="168"/><rect class="green" x="330" y="118" width="20" height="24"/>
    <line class="wickR" x1="384" y1="102" x2="384" y2="184"/><rect class="red" x="374" y="126" width="20" height="32"/>
    <g transform="translate(0 238)">
      <rect class="volG" x="27" y="28" width="14" height="20"/><rect class="volG" x="59" y="18" width="14" height="30"/><rect class="volR" x="91" y="10" width="14" height="38"/><rect class="volG" x="123" y="2" width="14" height="46"/><rect class="volR" x="155" y="0" width="14" height="48"/>
      <rect class="volR" x="286" y="0" width="20" height="48"/><rect class="volG" x="330" y="16" width="20" height="32"/><rect class="volR" x="374" y="22" width="20" height="26"/>
    </g>
  </g>
  <g transform="translate(505 100)">
    <rect class="box" x="0" y="0" width="190" height="86" rx="6"/>
    <text class="txt label" x="18" y="24">Quote Context</text>
    <text class="txt small muted" x="18" y="48">Bid 2.42 x 300</text>
    <text class="txt small muted" x="18" y="68">Ask 2.67 x 200</text>
    <rect class="box" x="0" y="112" width="190" height="86" rx="6"/>
    <text class="txt label" x="18" y="136">Depth Can Thin</text>
    <text class="txt small muted" x="18" y="160">Visible size may change</text>
    <text class="txt small muted" x="18" y="180">fast after resume</text>
    <rect class="box" x="0" y="224" width="190" height="70" rx="6"/>
    <text class="txt label" x="18" y="248">Key Question</text>
    <text class="txt small muted" x="18" y="270">Was execution realistic?</text>
  </g>
</svg>
