<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1351" viewBox="0 0 600 1351" role="img"><title>Candlestick anatomy basics</title><desc>Enlarged labels with original plotted shapes for small screens.</desc><rect width="600" height="1351" rx="14" fill="#07111f"/><text x="20" y="70" font-size="42" fill="#e8f1ff" font-family="Arial,sans-serif">Candlestick anatomy basics</text><svg x="0" y="86" width="600" height="600" viewBox="0 0 480 480"><rect xmlns="http://www.w3.org/2000/svg" width="960" height="540" fill="#07111f" />
