<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">Watchlist · Dollar Volume</title><style>text{font-family:Arial,Helvetica,sans-serif} .num{font-family:Consolas,monospace}</style><rect x="0" y="0" width="720" height="410" fill="#10151e"/><rect x="0" y="0" width="720" height="54" fill="#283444"/><text x="18" y="36" font-size="26" fill="#e1e7ef" text-anchor="start">Watchlist · Dollar Volume</text><text x="681" y="35" font-size="26" fill="#aeb9c8" text-anchor="start">×</text><rect x="16" y="80" width="688" height="46" fill="#283444"/><text x="30" y="111" font-size="23" fill="#aeb9c8" text-anchor="start">Stock</text><text x="156" y="111" font-size="23" fill="#aeb9c8" text-anchor="start">Volume</text><text x="305" y="111" font-size="23" fill="#aeb9c8" text-anchor="start">Avg price</text><text x="443" y="111" font-size="23" fill="#aeb9c8" text-anchor="start">Dollar volume</text><rect x="16" y="126" width="688" height="48" fill="#121a25"/><text x="30" y="158" font-size="24" fill="#e1e7ef" text-anchor="start">A</text><text x="156" y="158" font-size="24" fill="#e1e7ef" text-anchor="start">1.00M</text><text x="305" y="158" font-size="24" fill="#e1e7ef" text-anchor="start">$0.50</text><text x="443" y="158" font-size="24" fill="#e1e7ef" text-anchor="start">$500,000</text><rect x="16" y="174" width="688" height="48" fill="#1c2532"/><text x="30" y="206" font-size="24" fill="#e1e7ef" text-anchor="start">B</text><text x="156" y="206" font-size="24" fill="#e1e7ef" text-anchor="start">1.00M</text><text x="305" y="206" font-size="24" fill="#e1e7ef" text-anchor="start">$20.00</text><text x="443" y="206" font-size="24" fill="#e1e7ef" text-anchor="start">$20,000,000</text><rect x="16" y="274" width="688" height="42" fill="#283444"/><text x="28" y="303" font-size="24" fill="#e1e7ef" text-anchor="start">Dollar volume = shares × average trade price</text><text x="28" y="358" font-size="25" fill="#e1e7ef" text-anchor="start">A: 1,000,000 × $0.50 = $500,000</text><text x="28" y="398" font-size="25" fill="#e1e7ef" text-anchor="start">B: 1,000,000 × $20.00 = $20,000,000</text></svg>