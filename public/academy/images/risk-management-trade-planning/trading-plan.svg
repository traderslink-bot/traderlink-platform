<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Trading Plan</title><rect width="900" height="720" fill="#09111e"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="66" fill="#19283c"/><text x="28" y="43" font-size="29" fill="#e2e8f0">Trading Plan</text><rect x="40" y="100" width="820" height="40" fill="#253449"/><text x="54" y="127" font-size="19" fill="#e2e8f0">Before placing the entry</text><text x="364" y="127" font-size="19" fill="#e2e8f0">Plan for this trade</text><rect x="40" y="140" width="820" height="48" fill="#101a28"/><text x="54" y="171" font-size="21" fill="#e2e8f0">Reason</text><text x="364" y="171" font-size="21" fill="#e2e8f0">Pullback holds support near $4.80</text><rect x="40" y="188" width="820" height="48" fill="#172232"/><text x="54" y="219" font-size="21" fill="#e2e8f0">Entry condition</text><text x="364" y="219" font-size="21" fill="#e2e8f0">Recovery to $5.00 after the pullback</text><rect x="40" y="236" width="820" height="48" fill="#101a28"/><text x="54" y="267" font-size="21" fill="#e2e8f0">Entry order</text><text x="364" y="267" font-size="21" fill="#e2e8f0">Buy limit $5.00; do not chase</text><rect x="40" y="284" width="820" height="48" fill="#172232"/><text x="54" y="315" font-size="21" fill="#e2e8f0">Losing exit</text><text x="364" y="315" font-size="21" fill="#e2e8f0">Sell stop $4.80</text><rect x="40" y="332" width="820" height="48" fill="#101a28"/><text x="54" y="363" font-size="21" fill="#e2e8f0">Size</text><text x="364" y="363" font-size="21" fill="#e2e8f0">Up to 250 shares; price risk $50</text><rect x="40" y="380" width="820" height="48" fill="#172232"/><text x="54" y="411" font-size="21" fill="#e2e8f0">Profit exit</text><text x="364" y="411" font-size="21" fill="#e2e8f0">Sell limit $5.40 for filled shares</text><rect x="40" y="428" width="820" height="48" fill="#101a28"/><text x="54" y="459" font-size="21" fill="#e2e8f0">Time limit</text><text x="364" y="459" font-size="21" fill="#e2e8f0">Close before regular-session close</text><rect x="40" y="476" width="820" height="48" fill="#172232"/><text x="54" y="507" font-size="21" fill="#e2e8f0">Management</text><text x="364" y="507" font-size="21" fill="#e2e8f0">No additions; do not lower stop</text><text x="40" y="565" font-size="25" fill="#e2e8f0">Support breaks before entry: cancel the idea</text><text x="40" y="620" font-size="25" fill="#e2e8f0">Check actual fills and active exit orders</text></g></svg>