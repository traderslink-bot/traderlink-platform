<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Win Rate And Expectancy</title><rect width="900" height="720" fill="#09111e"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="66" fill="#19283c"/><text x="28" y="43" font-size="29" fill="#e2e8f0">Win Rate And Expectancy</text><rect x="40" y="110" width="820" height="40" fill="#253449"/><text x="54" y="137" font-size="19" fill="#e2e8f0">Win rate</text><text x="234" y="137" font-size="19" fill="#e2e8f0">Average win</text><text x="434" y="137" font-size="19" fill="#e2e8f0">Average loss</text><text x="654" y="137" font-size="19" fill="#e2e8f0">Net total</text><rect x="40" y="150" width="820" height="48" fill="#101a28"/><text x="54" y="181" font-size="21" fill="#e2e8f0">55%</text><text x="234" y="181" font-size="21" fill="#e2e8f0">$100.00</text><text x="434" y="181" font-size="21" fill="#e2e8f0">$100.00</text><text x="654" y="181" font-size="21" fill="#e2e8f0">+$1,000.00</text><rect x="40" y="198" width="820" height="48" fill="#172232"/><text x="54" y="229" font-size="21" fill="#e2e8f0">60%</text><text x="234" y="229" font-size="21" fill="#e2e8f0">$100.00</text><text x="434" y="229" font-size="21" fill="#e2e8f0">$100.00</text><text x="654" y="229" font-size="21" fill="#e2e8f0">+$2,000.00</text><rect x="40" y="246" width="820" height="48" fill="#101a28"/><text x="54" y="277" font-size="21" fill="#e2e8f0">60%</text><text x="234" y="277" font-size="21" fill="#e2e8f0">$100.00</text><text x="434" y="277" font-size="21" fill="#e2e8f0">$175.00</text><text x="654" y="277" font-size="21" fill="#e2e8f0">−$1,000.00</text><text x="40" y="340" font-size="24" fill="#94a3b8">100 completed trades in each sample · after costs</text><text x="40" y="420" font-size="25" fill="#e2e8f0">55 wins × $100 − 45 losses × $100 = +$1,000</text><text x="40" y="490" font-size="25" fill="#e2e8f0">60 wins × $100 − 40 losses × $100 = +$2,000</text><text x="40" y="560" font-size="25" fill="#f87171">60 wins × $100 − 40 losses × $175 = −$1,000</text></g></svg>