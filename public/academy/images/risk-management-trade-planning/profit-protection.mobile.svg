<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1016" role="img"><title>Protecting Open Profits</title><rect width="720" height="1016" fill="#09111e"/><text x="28" y="64" font-family="Arial, sans-serif" font-size="50" fill="#e2e8f0">Protecting Open Profits</text><ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" x="0" y="98" width="720" height="310" viewBox="30 80 860 370"><ns0:g font-family="Arial, sans-serif"><ns0:rect x="40" y="90.0" width="820" height="340.0" fill="#101a28" /><ns0:line x1="60" y1="410.0" x2="780" y2="410.0" stroke="#334155" stroke-width="2" /><ns0:text x="795" y="416.0" font-size="42" fill="#94a3b8">5.00</ns0:text><ns0:line x1="60" y1="309.9999999999999" x2="780" y2="309.9999999999999" stroke="#334155" stroke-width="2" /><ns0:text x="795" y="315.9999999999999" font-size="42" fill="#94a3b8">5.20</ns0:text><ns0:line x1="60" y1="209.99999999999983" x2="780" y2="209.99999999999983" stroke="#334155" stroke-width="2" /><ns0:text x="795" y="215.99999999999983" font-size="42" fill="#94a3b8">5.40</ns0:text><ns0:line x1="60" y1="109.99999999999972" x2="780" y2="109.99999999999972" stroke="#334155" stroke-width="2" /><ns0:text x="795" y="115.99999999999972" font-size="42" fill="#94a3b8">5.60</ns0:text><ns0:line x1="90" y1="209.99999999999983" x2="330" y2="160.0" stroke="#60a5fa" stroke-width="2" /><ns0:line x1="330" y1="160.0" x2="570" y2="184.99999999999991" stroke="#60a5fa" stroke-width="2" /><ns0:line x1="570" y1="184.99999999999991" x2="750" y2="260.0000000000001" stroke="#60a5fa" stroke-width="2" /><ns0:line x1="90" y1="309.9999999999999" x2="330" y2="260.0000000000001" stroke="#fbbf24" stroke-width="2" /><ns0:line x1="330" y1="260.0000000000001" x2="750" y2="260.0000000000001" stroke="#fbbf24" stroke-width="2" /></ns0:g></ns0:svg><rect x="20" y="418" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="448" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Highest traded price rises to</text><text x="36" y="492" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">$5.50</text><rect x="20" y="530" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="560" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Stop rises from $5.20 to $5.30,</text><text x="36" y="604" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">then stays there</text><rect x="20" y="642" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="672" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Manual trailing rule: $0.20 below</text><text x="36" y="716" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">the highest traded price</text><rect x="20" y="754" width="680" height="58" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="784" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">New high $5.50: $5.30</text><rect x="20" y="822" width="680" height="58" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="852" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Price falls to $5.45: Still $5.30</text><rect x="20" y="890" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="920" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">A stop trigger starts the exit;</text><text x="36" y="964" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">the fill price can differ</text></svg>