, sans-serif" font-size="34" fill="#e2e8f0">Whole-share order: round down to</text><text x="36" y="786" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">166</text><rect x="20" y="824" width="680" height="58" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="854" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">166 × $0.30 = $49.80 before costs</text><rect x="20" y="892" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="922" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Including $4 fees: ($50 − $4) /</text><text x="36" y="966" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">$0.20 = 230 shares</text></svg>