<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Trading Rules</title><rect width="900" height="720" fill="#09111e"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="66" fill="#19283c"/><text x="28" y="43" font-size="29" fill="#e2e8f0">Trading Rules</text><rect x="40" y="110" width="820" height="40" fill="#253449"/><text x="54" y="137" font-size="19" fill="#e2e8f0">Trading rule</text><text x="509" y="137" font-size="19" fill="#e2e8f0">Action</text><rect x="40" y="150" width="820" height="48" fill="#101a28"/><text x="54" y="181" font-size="21" fill="#e2e8f0">Daily net loss reaches $150</text><text x="509" y="181" font-size="21" fill="#e2e8f0">Stop for the day</text><rect x="40" y="198" width="820" height="48" fill="#172232"/><text x="54" y="229" font-size="21" fill="#e2e8f0">Three trades opened today</text><text x="509" y="229" font-size="21" fill="#e2e8f0">No fourth trade</text><rect x="40" y="246" width="820" height="48" fill="#101a28"/><text x="54" y="277" font-size="21" fill="#e2e8f0">Entry window: 9:30–11:00 a.m. ET</text><text x="509" y="277" font-size="21" fill="#e2e8f0">Cancel pending entries at 11:00</text><rect x="40" y="294" width="820" height="48" fill="#172232"/><text x="54" y="325" font-size="21" fill="#e2e8f0">New position</text><text x="509" y="325" font-size="21" fill="#e2e8f0">Plan price risk ≤ $50</text><rect x="40" y="342" width="820" height="48" fill="#101a28"/><text x="54" y="373" font-size="21" fill="#e2e8f0">Position is losing</text><text x="509" y="373" font-size="21" fill="#e2e8f0">Do not add shares</text><text x="40" y="450" font-size="25" fill="#94a3b8">Chosen rules for this example</text><rect x="40" y="490" width="820" height="40" fill="#253449"/><text x="54" y="517" font-size="19" fill="#e2e8f0">Trade 1</text><text x="254" y="517" font-size="19" fill="#e2e8f0">Trade 2</text><text x="454" y="517" font-size="19" fill="#e2e8f0">Trade 3</text><text x="654" y="517" font-size="19" fill="#e2e8f0">Day total</text><rect x="40" y="530" width="820" height="48" fill="#101a28"/><text x="54" y="561" font-size="21" fill="#e2e8f0">−$50.00</text><text x="254" y="561" font-size="21" fill="#e2e8f0">+$25.00</text><text x="454" y="561" font-size="21" fill="#e2e8f0">−$50.00</text><text x="654" y="561" font-size="21" fill="#e2e8f0">−$75.00</text><text x="40" y="640" font-size="23" fill="#e2e8f0">Three trades completed → no fourth trade</text></g></svg>