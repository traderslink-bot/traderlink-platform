<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Daily Loss Limits</title><rect width="900" height="720" fill="#09111e"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="66" fill="#19283c"/><text x="28" y="43" font-size="29" fill="#e2e8f0">Daily Loss Limits</text><rect x="40" y="110" width="820" height="40" fill="#253449"/><text x="54" y="137" font-size="19" fill="#e2e8f0">Completed trade</text><text x="304" y="137" font-size="19" fill="#e2e8f0">Net result</text><text x="594" y="137" font-size="19" fill="#e2e8f0">Running total</text><rect x="40" y="150" width="820" height="48" fill="#101a28"/><text x="54" y="181" font-size="21" fill="#e2e8f0">1</text><text x="304" y="181" font-size="21" fill="#e2e8f0">−$50.00</text><text x="594" y="181" font-size="21" fill="#e2e8f0">−$50.00</text><rect x="40" y="198" width="820" height="48" fill="#172232"/><text x="54" y="229" font-size="21" fill="#e2e8f0">2</text><text x="304" y="229" font-size="21" fill="#e2e8f0">−$45.00</text><text x="594" y="229" font-size="21" fill="#e2e8f0">−$95.00</text><rect x="40" y="246" width="820" height="48" fill="#101a28"/><text x="54" y="277" font-size="21" fill="#e2e8f0">3</text><text x="304" y="277" font-size="21" fill="#e2e8f0">−$55.00</text><text x="594" y="277" font-size="21" fill="#e2e8f0">−$150.00</text><rect x="40" y="345" width="820" height="100" fill="#3a2530"/><text x="60" y="383" font-size="28" fill="#e2e8f0">Chosen daily limit: −$150.00</text><text x="60" y="425" font-size="23" fill="#e2e8f0">Cancel entries · Close day trades · No more trades</text><text x="40" y="510" font-size="24" fill="#e2e8f0">The rule also counts open day-trade P&amp;L:</text><text x="40" y="565" font-size="25" fill="#e2e8f0">−$95.00 realized + −$55.00 unrealized = −$150.00</text><text x="40" y="632" font-size="23" fill="#94a3b8">Threshold reached → exit; final fill can change the loss</text></g></svg>