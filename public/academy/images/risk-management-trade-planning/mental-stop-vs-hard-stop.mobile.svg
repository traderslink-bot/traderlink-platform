<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1116" role="img"><title>Mental Stops And Stop Orders</title><rect width="720" height="1116" fill="#09111e"/><text x="28" y="64" font-family="Arial, sans-serif" font-size="50" fill="#e2e8f0">Mental Stops And Stop</text><text x="28" y="118" font-family="Arial, sans-serif" font-size="50" fill="#e2e8f0">Orders</text><rect x="20" y="142" width="680" height="190" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="172" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Trader-managed exit: Monitor the</text><text x="36" y="216" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">planned exit condition</text><text x="36" y="260" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Submitted stop order: Broker</text><text x="36" y="304" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">checks the order trigger</text><rect x="20" y="342" width="680" height="190" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="372" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Trader-managed exit: Submit an</text><text x="36" y="416" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">exit order</text><text x="36" y="460" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Submitted stop order: Triggered</text><text x="36" y="504" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">stop becomes market order</text><rect x="20" y="542" width="680" height="190" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="572" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Trader-managed exit: Wait for</text><text x="36" y="616" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">acceptance and fill</text><text x="36" y="660" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Submitted stop order: Wait for the</text><text x="36" y="704" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">exit order to fill</text><rect x="20" y="742" width="680" height="58" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="772" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Trading halt</text><rect x="20" y="810" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="840" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Neither approach ensures an</text><text x="36" y="884" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">immediate exit</text><rect x="20" y="922" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="952" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">100 shares: entry $5.00 → fill</text><text x="36" y="996" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">$4.70</text><rect x="20" y="1034" width="680" height="58" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="1064" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Price loss $30.00 before costs</text></svg>