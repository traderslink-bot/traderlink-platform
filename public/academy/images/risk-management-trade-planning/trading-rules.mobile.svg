<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1042" role="img"><title>Trading Rules</title><rect width="720" height="1042" fill="#09111e"/><text x="28" y="64" font-family="Arial, sans-serif" font-size="50" fill="#e2e8f0">Trading Rules</text><rect x="20" y="88" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="118" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Daily net loss reaches $150: Stop</text><text x="36" y="162" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">for the day</text><rect x="20" y="200" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="230" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Three trades opened today: No</text><text x="36" y="274" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">fourth trade</text><rect x="20" y="312" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="342" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Entry window: 9:30–11:00 a.m. ET:</text><text x="36" y="386" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Cancel pending entries at 11:00</text><rect x="20" y="424" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="454" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">New position: Plan price risk ≤</text><text x="36" y="498" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">$50</text><rect x="20" y="536" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="566" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Position is losing: Do not add</text><text x="36" y="610" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">shares</text><rect x="20" y="648" width="680" height="58" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="678" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Chosen rules for this example</text><rect x="20" y="716" width="680" height="190" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="746" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Trade 1: −$50.00</text><text x="36" y="790" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Trade 2: +$25.00</text><text x="36" y="834" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Trade 3: −$50.00</text><text x="36" y="878" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Day total: −$75.00</text><rect x="20" y="916" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="946" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Three trades completed → no fourth</text><text x="36" y="990" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">trade</text></svg>