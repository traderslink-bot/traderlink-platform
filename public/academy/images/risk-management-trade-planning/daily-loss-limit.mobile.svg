<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1086" role="img"><title>Daily Loss Limits</title><rect width="720" height="1086" fill="#09111e"/><text x="28" y="64" font-family="Arial, sans-serif" font-size="50" fill="#e2e8f0">Daily Loss Limits</text><rect x="20" y="88" width="680" height="146" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="118" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Completed trade: 1</text><text x="36" y="162" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Net result: −$50.00</text><text x="36" y="206" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Running total: −$50.00</text><rect x="20" y="244" width="680" height="146" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="274" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Completed trade: 2</text><text x="36" y="318" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Net result: −$45.00</text><text x="36" y="362" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Running total: −$95.00</text><rect x="20" y="400" width="680" height="146" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="430" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Completed trade: 3</text><text x="36" y="474" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Net result: −$55.00</text><text x="36" y="518" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Running total: −$150.00</text><rect x="20" y="556" width="680" height="58" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="586" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Chosen daily limit: −$150.00</text><rect x="20" y="624" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="654" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Cancel entries · Close day trades</text><text x="36" y="698" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">· No more trades</text><rect x="20" y="736" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="766" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">The rule also counts open</text><text x="36" y="810" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">day-trade P&amp;L:</text><rect x="20" y="848" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="878" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">−$95.00 realized + −$55.00</text><text x="36" y="922" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">unrealized = −$150.00</text><rect x="20" y="960" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="990" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Threshold reached → exit; final</text><text x="36" y="1034" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">fill can change the loss</text></svg>