<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Mental Stops And Stop Orders</title><rect width="900" height="720" fill="#09111e"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="66" fill="#19283c"/><text x="28" y="43" font-size="29" fill="#e2e8f0">Mental Stops And Stop Orders</text><rect x="40" y="110" width="820" height="40" fill="#253449"/><text x="54" y="137" font-size="19" fill="#e2e8f0">Trader-managed exit</text><text x="454" y="137" font-size="19" fill="#e2e8f0">Submitted stop order</text><rect x="40" y="150" width="820" height="48" fill="#101a28"/><text x="54" y="181" font-size="21" fill="#e2e8f0">Monitor the planned exit condition</text><text x="454" y="181" font-size="21" fill="#e2e8f0">Broker checks the order trigger</text><rect x="40" y="198" width="820" height="48" fill="#172232"/><text x="54" y="229" font-size="21" fill="#e2e8f0">Submit an exit order</text><text x="454" y="229" font-size="21" fill="#e2e8f0">Triggered stop becomes market order</text><rect x="40" y="246" width="820" height="48" fill="#101a28"/><text x="54" y="277" font-size="21" fill="#e2e8f0">Wait for acceptance and fill</text><text x="454" y="277" font-size="21" fill="#e2e8f0">Wait for the exit order to fill</text><rect x="40" y="385" width="820" height="110" fill="#3a2530"/><text x="60" y="426" font-size="30" fill="#fbbf24">Trading halt</text><text x="60" y="468" font-size="25" fill="#e2e8f0">Neither approach ensures an immediate exit</text><text x="40" y="555" font-size="27" fill="#e2e8f0">100 shares: entry $5.00 → fill $4.70</text><text x="40" y="612" font-size="27" fill="#f87171">Price loss $30.00 before costs</text></g></svg>