$5.40 for</text><text x="36" y="748" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">filled shares</text><rect x="20" y="786" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="816" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Time limit: Close before</text><text x="36" y="860" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">regular-session close</text><rect x="20" y="898" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="928" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Management: No additions; do not</text><text x="36" y="972" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">lower stop</text><rect x="20" y="1010" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="1040" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Support breaks before entry:</text><text x="36" y="1084" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">cancel the idea</text><rect x="20" y="1122" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="1152" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Check actual fills and active exit</text><text x="36" y="1196" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">orders</text></svg>