<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Position Sizing</title><rect width="900" height="720" fill="#09111e"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="66" fill="#19283c"/><text x="28" y="43" font-size="29" fill="#e2e8f0">Position Sizing</text><rect x="40" y="120" width="820" height="40" fill="#253449"/><text x="54" y="147" font-size="19" fill="#e2e8f0">Entry</text><text x="204" y="147" font-size="19" fill="#e2e8f0">Stop</text><text x="354" y="147" font-size="19" fill="#e2e8f0">Distance</text><text x="504" y="147" font-size="19" fill="#e2e8f0">Shares</text><text x="644" y="147" font-size="19" fill="#e2e8f0">Price risk</text><rect x="40" y="160" width="820" height="48" fill="#101a28"/><text x="54" y="191" font-size="21" fill="#e2e8f0">$5.00</text><text x="204" y="191" font-size="21" fill="#e2e8f0">$4.80</text><text x="354" y="191" font-size="21" fill="#e2e8f0">$0.20</text><text x="504" y="191" font-size="21" fill="#e2e8f0">250</text><text x="644" y="191" font-size="21" fill="#e2e8f0">$50.00</text><rect x="40" y="208" width="820" height="48" fill="#172232"/><text x="54" y="239" font-size="21" fill="#e2e8f0">$5.10</text><text x="204" y="239" font-size="21" fill="#e2e8f0">$4.80</text><text x="354" y="239" font-size="21" fill="#e2e8f0">$0.30</text><text x="504" y="239" font-size="21" fill="#e2e8f0">166</text><text x="644" y="239" font-size="21" fill="#e2e8f0">$49.80</text><text x="40" y="345" font-size="30" fill="#e2e8f0">$50.00 / $0.20 = 250 shares</text><text x="40" y="420" font-size="30" fill="#e2e8f0">$50.00 / $0.30 = 166.666… shares</text><text x="40" y="485" font-size="27" fill="#e2e8f0">Whole-share order: round down to 166</text><text x="40" y="555" font-size="27" fill="#e2e8f0">166 × $0.30 = $49.80 before costs</text><text x="40" y="640" font-size="24" fill="#e2e8f0">Including $4 fees: ($50 − $4) / $0.20 = 230 shares</text></g></svg>