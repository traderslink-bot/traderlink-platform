<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Protecting Open Profits</title><rect width="900" height="720" fill="#09111e"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="66" fill="#19283c"/><text x="28" y="43" font-size="29" fill="#e2e8f0">Protecting Open Profits</text><rect x="40" y="100" width="820" height="340" fill="#101a28"/><line x1="60" y1="420" x2="780" y2="420" stroke="#334155" stroke-width="2" /><text x="795" y="426" font-size="18" fill="#94a3b8">5.00</text><line x1="60" y1="319.9999999999999" x2="780" y2="319.9999999999999" stroke="#334155" stroke-width="2" /><text x="795" y="325.9999999999999" font-size="18" fill="#94a3b8">5.20</text><line x1="60" y1="219.99999999999983" x2="780" y2="219.99999999999983" stroke="#334155" stroke-width="2" /><text x="795" y="225.99999999999983" font-size="18" fill="#94a3b8">5.40</text><line x1="60" y1="119.99999999999972" x2="780" y2="119.99999999999972" stroke="#334155" stroke-width="2" /><text x="795" y="125.99999999999972" font-size="18" fill="#94a3b8">5.60</text><line x1="90" y1="219.99999999999983" x2="330" y2="170" stroke="#60a5fa" stroke-width="2" /><line x1="330" y1="170" x2="570" y2="194.99999999999991" stroke="#60a5fa" stroke-width="2" /><line x1="570" y1="194.99999999999991" x2="750" y2="270.0000000000001" stroke="#60a5fa" stroke-width="2" /><line x1="90" y1="319.9999999999999" x2="330" y2="270.0000000000001" stroke="#fbbf24" stroke-width="2" /><line x1="330" y1="270.0000000000001" x2="750" y2="270.0000000000001" stroke="#fbbf24" stroke-width="2" /><text x="65" y="135" font-size="22" fill="#60a5fa">Highest traded price rises to $5.50</text><text x="65" y="385" font-size="22" fill="#fbbf24">Stop rises from $5.20 to $5.30, then stays there</text><text x="60" y="480" font-size="23" fill="#e2e8f0">Manual trailing rule: $0.20 below the highest traded price</text><rect x="40" y="520" width="820" height="40" fill="#253449"/><text x="54" y="547" font-size="19" fill="#e2e8f0">Price change</text><text x="629" y="547" font-size="19" fill="#e2e8f0">Stop</text><rect x="40" y="560" width="820" height="48" fill="#101a28"/><text x="54" y="591" font-size="21" fill="#e2e8f0">New high $5.50</text><text x="629" y="591" font-size="21" fill="#e2e8f0">$5.30</text><rect x="40" y="608" width="820" height="48" fill="#172232"/><text x="54" y="639" font-size="21" fill="#e2e8f0">Price falls to $5.45</text><text x="629" y="639" font-size="21" fill="#e2e8f0">Still $5.30</text><text x="40" y="690" font-size="23" fill="#e2e8f0">A stop trigger starts the exit; the fill price can differ</text></g></svg>