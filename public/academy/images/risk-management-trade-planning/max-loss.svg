<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Maximum Loss Rules</title><rect width="900" height="720" fill="#09111e"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="66" fill="#19283c"/><text x="28" y="43" font-size="29" fill="#e2e8f0">Maximum Loss Rules</text><rect x="40" y="110" width="820" height="40" fill="#253449"/><text x="54" y="137" font-size="19" fill="#e2e8f0">Day</text><text x="304" y="137" font-size="19" fill="#e2e8f0">Net realized result</text><text x="594" y="137" font-size="19" fill="#e2e8f0">Weekly total</text><rect x="40" y="150" width="820" height="48" fill="#101a28"/><text x="54" y="181" font-size="21" fill="#e2e8f0">Monday</text><text x="304" y="181" font-size="21" fill="#e2e8f0">−$80.00</text><text x="594" y="181" font-size="21" fill="#e2e8f0">−$80.00</text><rect x="40" y="198" width="820" height="48" fill="#172232"/><text x="54" y="229" font-size="21" fill="#e2e8f0">Tuesday</text><text x="304" y="229" font-size="21" fill="#e2e8f0">−$120.00</text><text x="594" y="229" font-size="21" fill="#e2e8f0">−$200.00</text><rect x="40" y="246" width="820" height="48" fill="#101a28"/><text x="54" y="277" font-size="21" fill="#e2e8f0">Wednesday</text><text x="304" y="277" font-size="21" fill="#e2e8f0">−$100.00</text><text x="594" y="277" font-size="21" fill="#e2e8f0">−$300.00</text><rect x="40" y="385" width="820" height="100" fill="#3a2530"/><text x="60" y="425" font-size="29" fill="#e2e8f0">Chosen weekly threshold: $300.00</text><text x="60" y="463" font-size="25" fill="#e2e8f0">Reached Wednesday → no new day trades</text><text x="40" y="560" font-size="24" fill="#e2e8f0">Open positions still need their written exit policy</text></g></svg>