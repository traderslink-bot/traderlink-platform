<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460.48" viewBox="0 0 900 460.48" role="img"><title>Maximum Loss Rules</title><rect width="900" height="460.48" fill="#09111e" y="0.0" /><g font-family="Arial, sans-serif"><rect x="0" y="0.0" width="900" height="66.0" fill="#19283c" /><text x="28" y="43.0" font-size="29" fill="#e2e8f0">Maximum Loss Rules</text><rect x="40" y="90.0" width="820" height="40.0" fill="#253449" /><text x="54" y="117.0" font-size="19" fill="#e2e8f0">Day</text><text x="304" y="117.0" font-size="19" fill="#e2e8f0">Net realized result</text><text x="594" y="117.0" font-size="19" fill="#e2e8f0">Weekly total</text><rect x="40" y="130.0" width="820" height="48.0" fill="#101a28" /><text x="54" y="161.0" font-size="21" fill="#e2e8f0">Monday</text><text x="304" y="161.0" font-size="21" fill="#e2e8f0">−$80.00</text><text x="594" y="161.0" font-size="21" fill="#e2e8f0">−$80.00</text><rect x="40" y="178.0" width="820" height="48.0" fill="#172232" /><text x="54" y="209.0" font-size="21" fill="#e2e8f0">Tuesday</text><text x="304" y="209.0" font-size="21" fill="#e2e8f0">−$120.00</text><text x="594" y="209.0" font-size="21" fill="#e2e8f0">−$200.00</text><rect x="40" y="226.0" width="820" height="48.0" fill="#101a28" /><text x="54" y="257.0" font-size="21" fill="#e2e8f0">Wednesday</text><text x="304" y="257.0" font-size="21" fill="#e2e8f0">−$100.00</text><text x="594" y="257.0" font-size="21" fill="#e2e8f0">−$300.00</text><rect x="40" y="298.0" width="820" height="100.0" fill="#3a2530" /><text x="60" y="338.0" font-size="29" fill="#e2e8f0">Chosen weekly threshold: $300.00</text><text x="60" y="376.0" font-size="25" fill="#e2e8f0">Reached Wednesday → no new day trades</text><text x="40" y="441.20000000000005" font-size="24" fill="#e2e8f0">Open positions still need their written exit policy</text></g></svg>