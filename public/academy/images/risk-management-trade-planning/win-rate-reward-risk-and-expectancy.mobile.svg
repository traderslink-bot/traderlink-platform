<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1150" role="img"><title>Win Rate And Expectancy</title><rect width="720" height="1150" fill="#09111e"/><text x="28" y="64" font-family="Arial, sans-serif" font-size="50" fill="#e2e8f0">Win Rate And Expectancy</text><rect x="20" y="88" width="680" height="190" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="118" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Win rate: 55%</text><text x="36" y="162" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Average win: $100.00</text><text x="36" y="206" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Average loss: $100.00</text><text x="36" y="250" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Net total: +$1,000.00</text><rect x="20" y="288" width="680" height="190" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="318" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Win rate: 60%</text><text x="36" y="362" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Average win: $100.00</text><text x="36" y="406" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Average loss: $100.00</text><text x="36" y="450" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Net total: +$2,000.00</text><rect x="20" y="488" width="680" height="190" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="518" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Win rate: 60%</text><text x="36" y="562" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Average win: $100.00</text><text x="36" y="606" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Average loss: $175.00</text><text x="36" y="650" font-family="Arial, sans-serif" font-size="34" fill="#e2e8f0">Net total: −$1,000.00</text><rect x="20" y="688" width="680" height="102" rx="12" fill="#101a28" stroke="#253449"/><text x="36" y="718" font-family="Arial, sans-serif" font-size="34" fill="#e