<svg xmlns="http://www.w3.org/2000/svg" width="600" height="715" viewBox="0 0 600 715" role="img"><title>How traded volume changes VWAP</title><desc>More shares at a price give that price more influence.. Enlarged labels for small screens.</desc><rect width="600" height="715" rx="12" fill="#091321"/><text x="20" y="77" font-family="Arial,sans-serif" font-size="40" fill="#e4edf7">How traded volume changes</text><text x="20" y="126" font-family="Arial,sans-serif" font-size="40" fill="#e4edf7">VWAP</text><text x="20" y="176" font-family="Arial,sans-serif" font-size="28" fill="#a9bdd4">More shares at a price give that</text><text x="20" y="213" font-family="Arial,sans-serif" font-size="28" fill="#a9bdd4">price more influence.</text><text x="20" y="263" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">$4.00 · 100 shares · $400 traded</text><text x="20" y="300" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">value</text><text x="20" y="350" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">$4.20 · 300 shares · $1,260 traded</text><text x="20" y="387" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">value</text><text x="20" y="437" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">$4.30 · 200 shares · $860 traded</text><text x="20" y="474" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">value</text><text x="20" y="524" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">First 400 shares</text><text x="20" y="574" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">$1,660 ÷ 400 = $4.15</text><text x="20" y="624" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">After the next 200 shares</text><text x="20" y="674" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">$2,520 ÷ 600 = $4.20</text></svg>