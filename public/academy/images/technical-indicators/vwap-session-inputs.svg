<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><rect width="1100" height="390" rx="12" fill="#091321"/><text x="30" y="36" fill="#e4edf7" font-size="25" font-family="Arial,sans-serif">Different session inputs, different VWAP</text><text x="30" y="62" fill="#a9bdd4" font-size="15" font-family="Arial,sans-serif">The comparison uses the same two groups of trades.</text><text x="50" y="125" fill="#e4edf7" font-size="22" font-family="Arial,sans-serif">Premarket</text><text x="50" y="165" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">1,000 shares at $4.00</text><text x="50" y="245" fill="#e4edf7" font-size="22" font-family="Arial,sans-serif">Regular session</text><text x="50" y="285" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">1,000 shares at $4.40</text><text x="580" y="135" fill="#e4edf7" font-size="22" font-family="Arial,sans-serif">Both groups included</text><text x="580" y="177" fill="#45c1ff" font-size="25" font-family="Arial,sans-serif">$8,400 ÷ 2,000 = $4.20</text><text x="580" y="265" fill="#e4edf7" font-size="22" font-family="Arial,sans-serif">Regular-session group only</text><text x="580" y="307" fill="#ffcf63" font-size="25" font-family="Arial,sans-serif">$4,400 ÷ 1,000 = $4.40</text></svg>
