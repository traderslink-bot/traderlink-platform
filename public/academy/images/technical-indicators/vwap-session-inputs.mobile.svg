<svg xmlns="http://www.w3.org/2000/svg" width="600" height="654" viewBox="0 0 600 654" role="img"><title>Different session inputs, different VWAP</title><desc>The comparison uses the same two groups of trades.. Enlarged labels for small screens.</desc><rect width="600" height="654" rx="12" fill="#091321"/><text x="20" y="77" font-family="Arial,sans-serif" font-size="40" fill="#e4edf7">Different session inputs,</text><text x="20" y="126" font-family="Arial,sans-serif" font-size="40" fill="#e4edf7">different VWAP</text><text x="20" y="176" font-family="Arial,sans-serif" font-size="28" fill="#a9bdd4">The comparison uses the same two</text><text x="20" y="213" font-family="Arial,sans-serif" font-size="28" fill="#a9bdd4">groups of trades.</text><text x="20" y="263" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">Premarket</text><text x="20" y="313" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">1,000 shares at $4.00</text><text x="20" y="363" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">Regular session</text><text x="20" y="413" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">1,000 shares at $4.40</text><text x="20" y="463" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">Both groups included</text><text x="20" y="513" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">$8,400 ÷ 2,000 = $4.20</text><text x="20" y="563" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">Regular-session group only</text><text x="20" y="613" font-family="Arial,sans-serif" font-size="28" fill="#e4edf7">$4,400 ÷ 1,000 = $4.40</text></svg>