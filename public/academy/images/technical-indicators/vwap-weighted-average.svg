<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="368" viewBox="0 0 1100 368"><rect width="1100" height="368" rx="12" fill="#091321"/><text x="30" y="36" fill="#e4edf7" font-size="25" font-family="Arial,sans-serif">How traded volume changes VWAP</text><text x="30" y="62" fill="#a9bdd4" font-size="15" font-family="Arial,sans-serif">More shares at a price give that price more influence.</text><text x="55" y="135" fill="#e4edf7" font-size="25" font-family="Arial,sans-serif">$4.00</text><text x="225" y="135" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">100 shares</text><text x="445" y="135" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">$400 traded value</text><rect x="225" y="150" width="100" height="18" fill="#45c1ff"/><text x="55" y="225" fill="#e4edf7" font-size="25" font-family="Arial,sans-serif">$4.20</text><text x="225" y="225" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">300 shares</text><text x="445" y="225" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">$1,260 traded value</text><rect x="225" y="240" width="300" height="18" fill="#45c1ff"/><text x="55" y="315" fill="#e4edf7" font-size="25" font-family="Arial,sans-serif">$4.30</text><text x="225" y="315" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">200 shares</text><text x="445" y="315" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">$860 traded value</text><rect x="225" y="330" width="200" height="18" fill="#45c1ff"/><text x="680" y="150" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">First 400 shares</text><text x="680" y="190" fill="#ffcf63" font-size="25" font-family="Arial,sans-serif">$1,660 ÷ 400 = $4.15</text><text x="680" y="285" fill="#e4edf7" font-size="21" font-family="Arial,sans-serif">After the next 200 shares</text><text x="680" y="325" fill="#ffcf63" font-size="25" font-family="Arial,sans-serif">$2,520 ÷ 600 = $4.20</text></svg>