<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img"><title>U.S. stock market sessions · Eastern Time</title><rect x="0" y="0" width="720" height="600" fill="#10151e" /><rect x="0" y="0" width="720" height="54" fill="#283443" /><text x="22" y="36" font-family="Arial, sans-serif" font-size="26" fill="#e1e7ef">U.S. stock market sessions · Eastern Time</text><rect x="18" y="80" width="684" height="42" fill="#171e29" /><text x="32" y="108" font-family="Arial, sans-serif" font-size="21" fill="#aeb9c8">Session</text><text x="367" y="108" font-family="Arial, sans-serif" font-size="21" fill="#aeb9c8">Time</text><rect x="18" y="122" width="684" height="46" fill="#1d2734" /><text x="32" y="153" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">Premarket</text><text x="367" y="153" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">4:00–9:30 a.m.</text><rect x="18" y="168" width="684" height="46" fill="#171e29" /><text x="32" y="199" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">Regular session</text><text x="367" y="199" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">9:30 a.m.–4:00 p.m.</text><rect x="18" y="214" width="684" height="46" fill="#1d2734" /><text x="32" y="245" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">After-hours</text><text x="367" y="245" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">4:00–8:00 p.m.</text><rect x="18" y="310" width="684" height="42" fill="#283443" /><text x="30" y="339" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">Within the regular session</text><rect x="18" y="352" width="684" height="42" fill="#171e29" /><text x="32" y="380" font-family="Arial, sans-serif" font-size="21" fill="#aeb9c8">Period</text><text x="367" y="380" font-family="Arial, sans-serif" font-size="21" fill="#aeb9c8">Time</text><rect x="18" y="394" width="684" height="46" fill="#1d2734" /><text x="32" y="425" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">Opening hour</text><text x="367" y="425" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">9:30–10:30 a.m.</text><rect x="18" y="440" width="684" height="46" fill="#171e29" /><text x="32" y="471" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">Middle of the day</text><text x="367" y="471" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">10:30 a.m.–3:00 p.m.</text><rect x="18" y="486" width="684" height="46" fill="#1d2734" /><text x="32" y="517" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">Final hour</text><text x="367" y="517" font-family="Arial, sans-serif" font-size="23" fill="#e1e7ef">3:00–4:00 p.m.</text><text x="30" y="563" font-family="Arial, sans-serif" font-size="22" fill="#aeb9c8">Broker access and holiday hours can differ.</text></svg>
