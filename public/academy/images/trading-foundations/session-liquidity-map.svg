<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Session Liquidity And Style Context Map</title>
  <desc id="desc">Trading dashboard showing premarket, open, midday, close, and after-hours conditions with liquidity, spread, and timeframe review labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .panel{fill:url(#bg);stroke:#24405f;stroke-width:1.5}
      .chart{fill:#0b1628;stroke:#2a3f5f;stroke-width:1.3}
      .zone{fill:#10233a;stroke:#334155;stroke-width:1}
      .txt{fill:#dbeafe;font-family:Arial,Helvetica,sans-serif}
      .title{font-size:18px;font-weight:700}
      .label{font-size:13px;font-weight:700}
      .small{font-size:12px}
      .muted{fill:#94a3b8}
      .green{fill:#22c55e;stroke:#22c55e}
      .red{fill:#ef4444;stroke:#ef4444}
      .wickG{stroke:#22c55e;stroke-width:2}
      .wickR{stroke:#ef4444;stroke-width:2}
      .vol{fill:#38bdf8;opacity:.28}
      .divider{stroke:#38bdf8;stroke-width:1.3;stroke-dasharray:5 5;opacity:.75}
      .grid{stroke:#24364f;stroke-width:1}
    </style>
  </defs>
  <rect class="panel" x="14" y="14" width="732" height="402" rx="8"/>
  <text class="txt title" x="34" y="46">Sessions change the trading environment</text>
  <text class="txt small muted" x="34" y="68">Time of day can affect liquidity, spread, volume, and how a trade should be reviewed.</text>
  <g transform="translate(52 102)">
    <rect class="chart" x="0" y="0" width="656" height="212" rx="6"/>
    <line class="grid" x1="0" y1="48" x2="656" y2="48"/>
    <line class="grid" x1="0" y1="96" x2="656" y2="96"/>
    <line class="grid" x1="0" y1="144" x2="656" y2="144"/>
    <line class="divider" x1="112" y1="0" x2="112" y2="212"/>
    <line class="divider" x1="252" y1="0" x2="252" y2="212"/>
    <line class="divider" x1="426" y1="0" x2="426" y2="212"/>
    <line class="divider" x1="548" y1="0" x2="548" y2="212"/>
    <g>
      <line class="wickG" x1="32" y1="114" x2="32" y2="150"/><rect class="green" x="25" y="126" width="14" height="14"/>
      <line class="wickR" x1="62" y1="88" x2="62" y2="154"/><rect class="red" x="55" y="104" width="14" height="36"/>
      <line class="wickG" x1="92" y1="80" x2="92" y2="138"/><rect class="green" x="85" y="96" width="14" height="28"/>
      <line class="wickR" x1="138" y1="44" x2="138" y2="154"/><rect class="red" x="130" y="62" width="16" height="72"/>
      <line class="wickG" x1="174" y1="58" x2="174" y2="132"/><rect class="green" x="166" y="84" width="16" height="34"/>
      <line class="wickR" x1="210" y1="72" x2="210" y2="148"/><rect class="red" x="202" y="92" width="16" height="38"/>
      <line class="wickG" x1="286" y1="102" x2="286" y2="136"/><rect class="green" x="279" y="112" width="14" height="12"/>
      <line class="wickR" x1="322" y1="104" x2="322" y2="140"/><rect class="red" x="315" y="114" width="14" height="14"/>
      <line class="wickG" x1="358" y1="96" x2="358" y2="136"/><rect class="green" x="351" y="110" width="14" height="12"/>
      <line class="wickR" x1="394" y1="100" x2="394" y2="142"/><rect class="red" x="387" y="112" width="14" height="18"/>
      <line class="wickG" x1="458" y1="78" x2="458" y2="132"/><rect class="green" x="450" y="96" width="16" height="24"/>
      <line class="wickG" x1="494" y1="58" x2="494" y2="126"/><rect class="green" x="486" y="82" width="16" height="28"/>
      <line class="wickR" x1="530" y1="70" x2="530" y2="138"/><rect class="red" x="522" y="90" width="16" height="34"/>
      <line class="wickG" x1="580" y1="92" x2="580" y2="136"/><rect class="green" x="573" y="104" width="14" height="14"/>
      <line class="wickR" x1="616" y1="96" x2="616" y2="146"/><rect class="red" x="609" y="110" width="14" height="22"/>
    </g>
    <g transform="translate(0 226)">
      <rect class="vol" x="25" y="26" width="14" height="18"/><rect class="vol" x="55" y="20" width="14" height="24"/><rect class="vol" x="85" y="22" width="14" height="22"/>
      <rect class="vol" x="130" y="0" width="16" height="44"/><rect class="vol" x="166" y="6" width="16" height="38"/><rect class="vol" x="202" y="10" width="16" height="34"/>
      <rect class="vol" x="279" y="34" width="14" height="10"/><rect class="vol" x="315" y="32" width="14" height="12"/><rect class="vol" x="351" y="33" width="14" height="11"/><rect class="vol" x="387" y="30" width="14" height="14"/>
      <rect class="vol" x="450" y="16" width="16" height="28"/><rect class="vol" x="486" y="10" width="16" height="34"/><rect class="vol" x="522" y="14" width="16" height="30"/>
      <rect class="vol" x="573" y="28" width="14" height="16"/><rect class="vol" x="609" y="25" width="14" height="19"/>
    </g>
  </g>
  <g class="txt small">
    <text x="68" y="386">Premarket: thinner liquidity</text>
    <text x="190" y="386">Open: fast price discovery</text>
    <text x="336" y="386">Midday: slower filtering</text>
    <text x="492" y="386">Close: reassessment</text>
    <text x="618" y="386">After-hours: limited liquidity</text>
  </g>
</svg>
