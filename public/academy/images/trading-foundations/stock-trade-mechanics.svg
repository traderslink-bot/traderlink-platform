<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Stock Trade Mechanics Dashboard</title>
  <desc id="desc">Trading dashboard illustration showing a stock quote, bid, ask, last price, spread, and how an order can match with available liquidity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .panel{fill:url(#bg);stroke:#24405f;stroke-width:1.5}
      .box{fill:#0f1b2d;stroke:#2a3f5f;stroke-width:1.3}
      .quote{fill:#0b1628;stroke:#334155;stroke-width:1}
      .txt{fill:#dbeafe;font-family:Arial,Helvetica,sans-serif}
      .title{font-size:18px;font-weight:700}
      .label{font-size:13px;font-weight:700}
      .small{font-size:12px}
      .num{font-size:18px;font-weight:700}
      .muted{fill:#94a3b8}
      .green{fill:#22c55e}
      .red{fill:#ef4444}
      .cyan{fill:#38bdf8}
      .amber{fill:#f59e0b}
      .line{stroke:#38bdf8;stroke-width:2;stroke-linecap:round}
      .grid{stroke:#24364f;stroke-width:1}
    </style>
  </defs>
  <rect class="panel" x="14" y="14" width="732" height="402" rx="8"/>
  <text class="txt title" x="34" y="46">How a stock trade works</text>
  <text class="txt small muted" x="34" y="68">A fill happens when an order interacts with available shares at a quoted price.</text>
  <g transform="translate(42 98)">
    <rect class="box" x="0" y="0" width="274" height="244" rx="7"/>
    <text class="txt label" x="18" y="28">Quote window</text>
    <rect class="quote" x="18" y="50" width="238" height="44" rx="5"/>
    <text class="txt small muted" x="32" y="68">Bid</text>
    <text class="txt num green" x="32" y="88">24.98</text>
    <text class="txt small muted" x="126" y="68">Ask</text>
    <text class="txt num red" x="126" y="88">25.02</text>
    <text class="txt small muted" x="204" y="68">Spread</text>
    <text class="txt num cyan" x="204" y="88">0.04</text>
    <rect class="quote" x="18" y="112" width="238" height="44" rx="5"/>
    <text class="txt small muted" x="32" y="130">Last trade</text>
    <text class="txt num" x="32" y="150">25.00</text>
    <text class="txt small muted" x="126" y="130">Session volume</text>
    <text class="txt num" x="126" y="150">1.8M</text>
    <rect class="quote" x="18" y="174" width="238" height="44" rx="5"/>
    <text class="txt small muted" x="32" y="193">Last price is history. Bid and ask show current visible interest.</text>
  </g>
  <g transform="translate(350 98)">
    <rect class="box" x="0" y="0" width="166" height="244" rx="7"/>
    <text class="txt label" x="18" y="28">Visible depth</text>
    <text class="txt small muted" x="18" y="52">Price</text>
    <text class="txt small muted" x="92" y="52">Shares</text>
    <rect class="quote" x="18" y="64" width="130" height="26" rx="4"/><text class="txt small red" x="30" y="82">25.04</text><text class="txt small" x="98" y="82">900</text>
    <rect class="quote" x="18" y="96" width="130" height="26" rx="4"/><text class="txt small red" x="30" y="114">25.02</text><text class="txt small" x="98" y="114">500</text>
    <rect class="quote" x="18" y="128" width="130" height="26" rx="4"/><text class="txt small green" x="30" y="146">24.98</text><text class="txt small" x="98" y="146">700</text>
    <rect class="quote" x="18" y="160" width="130" height="26" rx="4"/><text class="txt small green" x="30" y="178">24.96</text><text class="txt small" x="98" y="178">1,200</text>
    <text class="txt small muted" x="18" y="214">Depth can change quickly.</text>
  </g>
  <g transform="translate(552 98)">
    <rect class="box" x="0" y="0" width="160" height="244" rx="7"/>
    <text class="txt label" x="18" y="28">Order review</text>
    <circle class="cyan" cx="38" cy="70" r="12"/>
    <line class="line" x1="52" y1="70" x2="116" y2="70"/>
    <circle class="amber" cx="128" cy="70" r="12"/>
    <text class="txt small muted" x="18" y="110">Check fill price</text>
    <text class="txt small muted" x="18" y="132">Check spread</text>
    <text class="txt small muted" x="18" y="154">Check liquidity</text>
    <text class="txt small muted" x="18" y="176">Check slippage</text>
  </g>
  <g transform="translate(74 366)">
    <line class="grid" x1="0" y1="0" x2="608" y2="0"/>
    <text class="txt small muted" x="0" y="24">Bid, ask, spread, depth, and order type shape the fill.</text>
  </g>
</svg>
