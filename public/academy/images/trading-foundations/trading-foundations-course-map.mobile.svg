<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 832" role="img"><title>Position size and profit / loss</title><rect width="720" height="832" fill="#10151e"/><text x="32" y="58" font-family="Arial, sans-serif" font-size="50" fill="#e1e7ef">Position size and profit</text><text x="32" y="112" font-family="Arial, sans-serif" font-size="50" fill="#e1e7ef">/ loss</text><rect x="20" y="146" width="680" height="186" rx="10" fill="#172232"/><text x="32" y="176" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Action: Buy</text><text x="32" y="220" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Shares: 100</text><text x="32" y="264" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Price: $5.00</text><text x="32" y="308" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Value: $500.00</text><rect x="20" y="342" width="680" height="186" rx="10" fill="#172232"/><text x="32" y="372" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Action: Sell</text><text x="32" y="416" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Shares: 100</text><text x="32" y="460" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Price: $5.20</text><text x="32" y="504" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Value: $520.00</text><rect x="20" y="538" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="568" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Position: 100 shares after the</text><text x="32" y="612" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">buy; 0 after the sell</text><rect x="20" y="646" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="676" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Profit = $520.00 − $500.00 =</text><text x="32" y="720" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">$20.00</text><rect x="20" y="754" width="680" height="54" rx="10" fill="#172232"/><text x="32" y="784" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Before commissions and fees</text></svg>