<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img"><title>U.S. stock market sessions · Eastern Time</title><rect width="720" height="980" fill="#10151e"/><text x="32" y="58" font-family="Arial, sans-serif" font-size="50" fill="#e1e7ef">U.S. stock market</text><text x="32" y="112" font-family="Arial, sans-serif" font-size="50" fill="#e1e7ef">sessions · Eastern Time</text><rect x="20" y="146" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="176" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Session: Premarket</text><text x="32" y="220" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Time: 4:00–9:30 a.m.</text><rect x="20" y="254" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="284" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Session: Regular session</text><text x="32" y="328" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Time: 9:30 a.m.–4:00 p.m.</text><rect x="20" y="362" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="392" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Session: After-hours</text><text x="32" y="436" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Time: 4:00–8:00 p.m.</text><rect x="20" y="470" width="680" height="54" rx="10" fill="#172232"/><text x="32" y="500" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Within the regular session</text><rect x="20" y="534" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="564" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Period: Opening hour</text><text x="32" y="608" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Time: 9:30–10:30 a.m.</text><rect x="20" y="642" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="672" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Period: Middle of the day</text><text x="32" y="716" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Time: 10:30 a.m.–3:00 p.m.</text><rect x="20" y="750" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="780" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Period: Final hour</text><text x="32" y="824" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Time: 3:00–4:00 p.m.</text><rect x="20" y="858" width="680" height="98" rx="10" fill="#172232"/><text x="32" y="888" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Broker access and holiday hours</text><text x="32" y="932" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">can differ.</text></svg>