<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img"><title>Day trading / swing trading</title><rect width="720" height="670" fill="#10151e"/><text x="32" y="58" font-family="Arial, sans-serif" font-size="50" fill="#e1e7ef">Day trading / swing</text><text x="32" y="112" font-family="Arial, sans-serif" font-size="50" fill="#e1e7ef">trading</text><text x="32" y="176" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Day trade · Same trading day</text><path d="M70 230 H650" stroke="#77aaff" stroke-width="3"/><circle cx="130" cy="230" r="10" fill="#26b99a"/><circle cx="570" cy="230" r="10" fill="#f16c78"/><text x="32" y="284" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Open</text><text x="525" y="284" font-family="Arial" font-size="34" fill="#e1e7ef">Close</text><text x="32" y="348" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">Swing trade · Across trading</text><text x="32" y="392" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">days</text><path d="M70 466 H650" stroke="#77aaff" stroke-width="3"/><circle cx="130" cy="466" r="10" fill="#26b99a"/><circle cx="570" cy="466" r="10" fill="#f16c78"/><text x="86" y="520" font-family="Arial" font-size="34" fill="#e1e7ef">Day 1</text><text x="307" y="520" font-family="Arial" font-size="34" fill="#e1e7ef">Day 2</text><text x="526" y="520" font-family="Arial" font-size="34" fill="#e1e7ef">Day 3</text><text x="32" y="590" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">An overnight gap can change a</text><text x="32" y="634" font-family="Arial, sans-serif" font-size="34" fill="#e1e7ef">swing trade’s risk.</text></svg>