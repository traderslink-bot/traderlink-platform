<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img"><title>Day trading and swing trading holding periods</title><rect width="720" height="490" fill="#10151e" /><rect width="720" height="54" fill="#283443" /><g font-family="Arial, sans-serif" fill="#e1e7ef"><text x="24" y="36" font-size="26">Day trading / swing trading</text><text x="24" y="116" font-size="25">Day trade · Same trading day</text><path d="M70 165 H650" stroke="#77aaff" stroke-width="3" /><circle cx="130" cy="165" r="8" fill="#26b99a" /><circle cx="570" cy="165" r="8" fill="#f16c78" /><text x="90" y="207" font-size="23">Open</text><text x="530" y="207" font-size="23">Close</text><text x="24" y="277" font-size="25">Swing trade · Across trading days</text><path d="M70 325 H650" stroke="#77aaff" stroke-width="3" /><circle cx="130" cy="325" r="8" fill="#26b99a" /><circle cx="570" cy="325" r="8" fill="#f16c78" /><text x="86" y="367" font-size="23">Day 1</text><text x="307" y="367" font-size="23">Day 2</text><text x="526" y="367" font-size="23">Day 3</text><text x="24" y="443" font-size="23">An overnight gap can change a swing trade’s risk.</text></g></svg>
