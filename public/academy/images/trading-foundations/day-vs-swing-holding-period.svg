<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372.58" role="img"><title>Day trading and swing trading holding periods</title><rect width="720" height="372.58" fill="#10151e" y="0.0" /><rect width="720" height="54.0" fill="#283443" y="0.0" /><g font-family="Arial, sans-serif" fill="#e1e7ef"><text x="24" y="36.0" font-size="26">Day trading / swing trading</text><text x="24" y="98.0" font-size="25">Day trade · Same trading day</text><path d="M70 135.5 H650" stroke="#77aaff" stroke-width="3" /><circle cx="130" cy="135.5" r="8" fill="#26b99a" /><circle cx="570" cy="135.5" r="8" fill="#f16c78" /><text x="90" y="177.5" font-size="23">Open</text><text x="530" y="177.5" font-size="23">Close</text><text x="24" y="226.56" font-size="25">Swing trade · Across trading days</text><path d="M70 264.06 H650" stroke="#77aaff" stroke-width="3" /><circle cx="130" cy="264.06" r="8" fill="#26b99a" /><circle cx="570" cy="264.06" r="8" fill="#f16c78" /><text x="86" y="306.06" font-size="23">Day 1</text><text x="307" y="306.06" font-size="23">Day 2</text><text x="526" y="306.06" font-size="23">Day 3</text><text x="24" y="353.52" font-size="23">An overnight gap can change a swing trade’s risk.</text></g></svg>