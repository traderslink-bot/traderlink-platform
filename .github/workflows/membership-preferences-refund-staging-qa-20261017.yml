name: Membership Preferences refund staging verification

on:
  push:
    branches:
      - codex/membership-preferences-refund-staging-qa-20261017

permissions:
  contents: read

concurrency:
  group: membership-preferences-refund-staging-qa-20261017
  cancel-in-progress: false

jobs:
  release-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Collect complete TypeScript diagnostics
        run: npx tsc --noEmit --incremental false
      - name: Full application build and TypeScript
        run: npm run build
