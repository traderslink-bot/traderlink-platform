name: Coaching staging verification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/coaching-staging-integration-20260926
      - codex/coaching-parity-recovery-20261010
      - codex/coaching-production-parity-staging-20261010

permissions:
  contents: read

concurrency:
  group: coaching-staging-verification
  cancel-in-progress: false

jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx src/scripts/coaching-staging-maintenance.ts --rehearse
      - run: npm run build
