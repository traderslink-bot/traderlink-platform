name: Coaching staging verification

on:
  push:
    branches: [codex/coaching-staging-integration-20260926]

permissions:
  contents: read

concurrency:
  group: coaching-staging-verification
  cancel-in-progress: false

jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
