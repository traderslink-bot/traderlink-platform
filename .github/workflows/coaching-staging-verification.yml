name: Watchlist0146 release verification
on:
  push:
    branches: [codex/coaching-staging-integration-20260926]
permissions:
  contents: read
concurrency:
  group: watchlist0146-release-verification
  cancel-in-progress: false
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      matrix:
        source: [d1e11da83377051d7b1aa4b838e50a719a116965, 4770e0e4e29bed12b6b6e9a8d4e0204695236445]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Rehearse exact predecessor upgrade and compatible schema
        run: node --import ./app/node_modules/tsx/dist/loader.mjs .github/watchlist-0146-rehearsal.ts
      - name: Verify publication controls and notification failure handling offline
        if: matrix.source == '4770e0e4e29bed12b6b6e9a8d4e0204695236445'
        working-directory: app
        run: node src/scripts/verify-watchlist-automatic-refresh.cjs "$PWD/node_modules/typescript" "$PWD/node_modules/better-sqlite3" "$GITHUB_WORKSPACE/.github/watchlist-runtime"
      - run: npm run build
        working-directory: app
