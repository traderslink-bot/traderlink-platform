name: Coaching render and staging0146 verification
on:
  push:
    branches: [codex/coaching-staging-integration-20260926]
permissions:
  contents: read
concurrency:
  group: coaching-staging-render
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      matrix:
        source: [473997ac2ba16d6b5d03d0b5aaf4b275651beb68, c92a35a2022efdb40a7f437aff73e2a216c5728d]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rehearse staging141 to142 migration and row preservation
        run: node --import tsx src/scripts/coaching-staging-maintenance.ts --rehearse
      - run: npm run build
