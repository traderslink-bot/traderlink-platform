name: Integrity cooldown isolated verification
on:
  push:
    branches: [codex/coaching-staging-integration-20260926]
permissions:
  contents: read
concurrency:
  group: integrity-repair-verification
  cancel-in-progress: false
jobs:
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production Docker package
        run: docker build -t integrity-repair .
      - name: Native isolated integrity and termination verification
        run: docker run --rm --network none --entrypoint node -v "$PWD/src/modules/platform/server/database/open-platform-database.ts:/tmp/integrity-source.ts:ro" -v "$PWD/.github/integrity-native-smoke.cjs:/tmp/integrity-native-smoke.cjs:ro" integrity-repair /tmp/integrity-native-smoke.cjs
