name: Potential gain integrated release verification
on:
  push:
    branches: [codex/coaching-staging-integration-20260926]
permissions:
  contents: read
concurrency:
  group: potential-gain-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      matrix:
        source: [3a3486e55b53f869f165be85a2a905f7f1537b08, 1ccb44bbc51d113d3d2d3f30086d4ef031473571]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: node --import ./app/node_modules/tsx/dist/loader.mjs .github/potential-gain-rehearsal.ts
      - name: Offline integrated sender and route checks
        if: matrix.source == '1ccb44bbc51d113d3d2d3f30086d4ef031473571'
        working-directory: app
        run: node src/scripts/verify-watchlist-potential-gain-post.cjs "$PWD/node_modules/typescript" "$PWD/node_modules/better-sqlite3"
      - run: npm run build
        working-directory: app
