name: Potential gain integrated release verification
on:
  push:
    branches: [codex/coaching-staging-integration-20260926]
permissions:
  contents: read
concurrency:
  group: potential-gain-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      matrix:
        source: [74a92cc9327d0bbf4e1e9e9fe604779b53e4092f, 2dc2b53a79e3bc2ad3bdf6885e4efc6dc0c60bb9]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: node --import ./app/node_modules/tsx/dist/loader.mjs .github/potential-gain-rehearsal.ts
      - name: Offline integrated sender and route checks
        if: matrix.source == '2dc2b53a79e3bc2ad3bdf6885e4efc6dc0c60bb9'
        working-directory: app
        run: node src/scripts/verify-watchlist-potential-gain-post.cjs "$PWD/node_modules/typescript" "$PWD/node_modules/better-sqlite3"
      - run: npm run build
        working-directory: app
