name: Membership quota and trial verification

on:
  push:
    branches:
      - codex/membership-quota-trial-verification-20261010

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Rebuild the native SQLite dependency only
        run: npm rebuild better-sqlite3
      - name: Run deterministic in-memory quota and trial checks
        shell: bash
        run: |
          set +e
          output="$(node --import tsx scripts/check-membership-quota-trials.ts 2>&1)"
          status=$?
          printf '%s\n' "$output"
          {
            echo '### Membership quota and trial verification'
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
