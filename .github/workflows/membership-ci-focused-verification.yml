name: Membership CI focused verification

on:
  push:
    branches:
      - codex/membership-ci-focused-verification-20261010

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild SQLite native binding
        run: npm rebuild better-sqlite3

      - name: Run focused tests without external network
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          set +e
          sudo --preserve-env=PATH,GITHUB_WORKSPACE unshare --net -- bash -c '
            ip link set lo up
            cd "$GITHUB_WORKSPACE"
            npm exec -- vitest run \
              src/lib/academy/__tests__/academy-content.test.ts \
              src/lib/academy/__tests__/discord-auth-routes.test.ts \
              src/lib/academy/__tests__/discord-oauth.test.ts \
              src/lib/trade-candle-analysis/trend-momentum-execution-page.test.ts \
              src/lib/trade-candle-analysis/trend-momentum-qa-followup.test.ts \
              src/lib/live-watchlist/__tests__/watchlist-display-contract.test.ts \
              src/lib/live-watchlist/__tests__/live-watchlist-store.test.ts \
              src/lib/live-watchlist/__tests__/live-watchlist-store-neon-concurrency.test.ts \
              src/modules/journal-analytics/presentation/trade-explorer-ui-contract.test.ts \
              --maxWorkers=1 \
              --fileParallelism=false \
              --testTimeout=30000
          ' 2>&1 | tee "$log_file"
          test_status="${PIPESTATUS[0]}"
          set -e
          if [ "$test_status" -ne 0 ]; then
            {
              echo "### Focused Vitest failure output"
              echo '```text'
              tail -n 350 "$log_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            node - "$log_file" <<'NODE'
          const fs = require("node:fs");
          const lines = fs.readFileSync(process.argv[2], "utf8").split(/\r?\n/u);
          const tail = lines.slice(-220).join("\n").slice(-12000);
          const escaped = tail
            .replaceAll("%", "%25")
            .replaceAll("\r", "%0D")
            .replaceAll("\n", "%0A");
          console.log(`::error title=Focused Vitest failure::${escaped}`);
          NODE
          fi
          exit "$test_status"
