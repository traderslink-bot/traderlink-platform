name: Membership CI focused verification

on:
  push:
    branches:
      - codex/membership-ci-focused-verification-20261010

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild SQLite native binding
        run: npm rebuild better-sqlite3

      - name: Run focused tests without external network
        shell: bash
        run: |
          results_file="/tmp/focused-vitest-results.json"
          set +e
          sudo --preserve-env=PATH,GITHUB_WORKSPACE unshare --net -- bash -c '
            ip link set lo up
            cd "$GITHUB_WORKSPACE"
            npm exec -- vitest run \
              src/lib/academy/__tests__/academy-content.test.ts \
              src/lib/academy/__tests__/discord-auth-routes.test.ts \
              src/lib/academy/__tests__/discord-oauth.test.ts \
              src/lib/trade-candle-analysis/trend-momentum-execution-page.test.ts \
              src/lib/trade-candle-analysis/trend-momentum-qa-followup.test.ts \
              src/lib/live-watchlist/__tests__/watchlist-display-contract.test.ts \
              src/lib/live-watchlist/__tests__/live-watchlist-store.test.ts \
              src/lib/live-watchlist/__tests__/live-watchlist-store-neon-concurrency.test.ts \
              src/modules/journal-analytics/presentation/trade-explorer-ui-contract.test.ts \
              --maxWorkers=1 \
              --fileParallelism=false \
              --testTimeout=30000 \
              --reporter=json \
              --outputFile=/tmp/focused-vitest-results.json
          '
          test_status="$?"
          set -e
          if [ -f "$results_file" ]; then
            node - "$results_file" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const rows = [];
          for (const file of report.testResults ?? []) {
            for (const assertion of file.assertionResults ?? []) {
              if (assertion.status === "failed") {
                rows.push({
                  file: path.relative(process.cwd(), file.name).replaceAll("\\", "/"),
                  title: assertion.fullName || assertion.title || "Focused Vitest assertion",
                  message: (assertion.failureMessages ?? []).join("\n"),
                });
              }
            }
          }
          if (rows.length === 0 && report.success === false) {
            rows.push({file: ".github/workflows/membership-ci-focused-verification.yml", title: "Focused Vitest failure", message: JSON.stringify(report).slice(-10000)});
          }
          for (const row of rows) {
            const clean = row.message.replace(/\u001b\[[0-9;]*m/gu, "").slice(-8000);
            const escaped = clean.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
            console.log(`::error file=${row.file},title=${row.title.replaceAll(",", " ")}::${escaped}`);
          }
          console.log(`Focused results: ${report.numPassedTests ?? 0} passed, ${report.numFailedTests ?? 0} failed, ${report.numPendingTests ?? 0} pending.`);
          NODE
          fi
          exit "$test_status"
