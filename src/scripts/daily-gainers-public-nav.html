<!-- Navigation from the TradersLink public homepage. -->
<style>
#traderslink-homepage-review-v2 .tl2-header { align-items:center; background:#fff; border-bottom:1px solid #dbe4ef; box-shadow:0 9px 25px rgba(14,47,93,.08); display:flex; justify-content:space-between; min-height:76px; padding:0 4.5%; position:relative; z-index:1; }
    #traderslink-homepage-review-v2 .tl2-logo { display:block; text-decoration:none; }
    #traderslink-homepage-review-v2 .tl2-logo img { display:block; height:32px; width:auto; }
    #traderslink-homepage-review-v2 .tl2-nav { align-items:center; display:flex; gap:24px; }
    #traderslink-homepage-review-v2 .tl2-nav a { color:#385376; font-size:14px; font-weight:600; text-decoration:none; }
    #traderslink-homepage-review-v2 .tl2-features-menu { position:relative; }
    #traderslink-homepage-review-v2 .tl2-features-toggle { align-items:center; background:transparent; border:0; color:#385376; cursor:pointer; display:flex; font:inherit; font-size:14px; font-weight:600; gap:6px; padding:8px 0; white-space:nowrap; }
    #traderslink-homepage-review-v2 .tl2-features-chevron { border:solid currentColor; border-width:0 1.5px 1.5px 0; display:inline-block; height:6px; transform:translateY(-2px) rotate(45deg); transition:transform .2s ease; width:6px; }
    #traderslink-homepage-review-v2 .tl2-features-menu.is-open .tl2-features-chevron { transform:translateY(1px) rotate(225deg); }
    #traderslink-homepage-review-v2 .tl2-features-links { background:#fff; border:1px solid #dbe4ef; border-radius:10px; box-shadow:0 14px 28px rgba(14,47,93,.14); display:none; left:-18px; min-width:206px; padding:8px; position:absolute; top:calc(100% + 11px); z-index:3; }
    #traderslink-homepage-review-v2 .tl2-features-menu.is-open .tl2-features-links { display:grid; gap:2px; }
    #traderslink-homepage-review-v2 .tl2-features-links a { border-radius:7px; padding:10px; }
    #traderslink-homepage-review-v2 .tl2-features-links a:hover { background:#edf4fb; color:#062663; }
    #traderslink-homepage-review-v2 .tl2-nav .tl2-account-link { color:#fff; font-size:14px; margin-left:16px; padding:12px 17px; position:relative; transition:box-shadow .2s ease,transform .2s ease; }
    #traderslink-homepage-review-v2 .tl2-nav .tl2-account-link::before { background:#dbe4ef; content:""; height:24px; left:-16px; position:absolute; top:50%; transform:translateY(-50%); width:1px; }
    #traderslink-homepage-review-v2 .tl2-nav .tl2-account-link:hover { box-shadow:0 7px 15px rgba(6,38,99,.18); transform:translateY(-1px); }
    #traderslink-homepage-review-v2 .tl2-menu-toggle { align-items:center; background:#fff; border:1px solid #c9d6e5; border-radius:8px; cursor:pointer; display:none; height:40px; justify-content:center; padding:0; width:40px; }
    #traderslink-homepage-review-v2 .tl2-menu-toggle-lines { display:grid; gap:4px; width:18px; }
    #traderslink-homepage-review-v2 .tl2-menu-toggle-lines span { background:#173761; border-radius:2px; display:block; height:2px; transition:opacity .2s ease,transform .2s ease; }
    #traderslink-homepage-review-v2 .tl2-header.is-menu-open .tl2-menu-toggle-lines span:nth-child(1) { transform:translateY(6px) rotate(45deg); }
    #traderslink-homepage-review-v2 .tl2-header.is-menu-open .tl2-menu-toggle-lines span:nth-child(2) { opacity:0; }
    #traderslink-homepage-review-v2 .tl2-header.is-menu-open .tl2-menu-toggle-lines span:nth-child(3) { transform:translateY(-6px) rotate(-45deg); }
    #traderslink-homepage-review-v2 .tl2-account-link { background:#062663; border:1px solid #062663; border-radius:7px; color:#fff; display:inline-block; font-size:16px; font-weight:700; padding:14px 22px; text-decoration:none; }
@media (max-width: 760px) {
#traderslink-homepage-review-v2 .tl2-header { min-height:68px; padding:0 18px; z-index:30; }
      #traderslink-homepage-review-v2 .tl2-logo img { height:27px; }
      #traderslink-homepage-review-v2 .tl2-menu-toggle { display:flex; }
      #traderslink-homepage-review-v2 .tl2-nav { align-items:stretch; background:#fff; border:1px solid #d6e1ed; border-radius:12px; box-shadow:0 18px 38px rgba(14,47,93,.18); display:none; flex-direction:column; gap:2px; left:12px; padding:10px; position:absolute; right:12px; top:calc(100% + 8px); }
      #traderslink-homepage-review-v2 .tl2-header.is-menu-open .tl2-nav { display:flex; }
      #traderslink-homepage-review-v2 .tl2-nav > a:not(.tl2-account-link) { border-radius:8px; padding:10px 12px; }
      #traderslink-homepage-review-v2 .tl2-features-menu { display:block; }
      #traderslink-homepage-review-v2 .tl2-features-toggle { justify-content:space-between; padding:10px 12px; width:100%; }
      #traderslink-homepage-review-v2 .tl2-features-links { box-shadow:none; left:auto; margin:2px 0 6px; min-width:0; position:static; top:auto; }
      #traderslink-homepage-review-v2 .tl2-nav .tl2-account-link { align-self:flex-start; font-size:13px; margin:6px 0 0 12px; padding:8px 12px; }
      #traderslink-homepage-review-v2 .tl2-nav .tl2-account-link::before { display:none; }
      }
</style>
<div id="traderslink-homepage-review-v2">
<header class="tl2-header">
    <a aria-label="TradersLink home" class="tl2-logo" href="/"><img alt="TradersLink" src="/landing-assets/logo-horizontal-light.png" width="1760" height="361" decoding="async" /></a>
    <button aria-controls="tl2-primary-nav" aria-expanded="false" aria-label="Open navigation menu" class="tl2-menu-toggle" type="button"><span aria-hidden="true" class="tl2-menu-toggle-lines"><span></span><span></span><span></span></span></button>
    <nav aria-label="Primary" class="tl2-nav" id="tl2-primary-nav">
      <div class="tl2-features-menu">
        <button aria-controls="features-links" aria-expanded="false" class="tl2-features-toggle" type="button"><span>Features</span><span aria-hidden="true" class="tl2-features-chevron"></span></button>
        <div class="tl2-features-links" id="features-links">
          <a href="/trading-journal">Trading Journal</a>
          <a href="/trading-journal#daily-trade-tracker">Daily Trade Tracker</a>
          <a href="/trade-analyzer">Trade Analyzer</a>
          <a href="/trade-analytics">Trade Analytics</a>
        </div>
      </div>
      <a href="/stock-gainers/">Top Stock Gainers</a>
      <a href="/academy">Academy</a>
      <a href="https://traderslink.pro/help">Help</a>
      <a href="https://app.traderslink.pro/api/auth/discord/login?returnTo=%2Fworkspace">Log in</a>
      <a class="tl2-account-link" href="https://traderslink.pro/beta">Sign up free</a>
    </nav>
  </header>
</div>
<script>
(() => {
  const featuresMenu = document.querySelector('.tl2-features-menu');
  if (featuresMenu) {
    const featuresToggle = featuresMenu.querySelector('.tl2-features-toggle');
    const closeFeaturesMenu = () => {
      featuresMenu.classList.remove('is-open');
      featuresToggle.setAttribute('aria-expanded', 'false');
    };
    featuresToggle.addEventListener('click', () => {
      const isOpen = featuresMenu.classList.toggle('is-open');
      featuresToggle.setAttribute('aria-expanded', String(isOpen));
    });
    featuresMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeFeaturesMenu));
    document.addEventListener('click', (event) => {
      if (!featuresMenu.contains(event.target)) closeFeaturesMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeFeaturesMenu();
    });
  }
  const mobileHeader = document.querySelector('.tl2-header');
  const mobileMenuToggle = document.querySelector('.tl2-menu-toggle');
  const mobilePrimaryNav = document.querySelector('#tl2-primary-nav');
  if (mobileHeader && mobileMenuToggle && mobilePrimaryNav) {
    const closeMobileMenu = () => {
      mobileHeader.classList.remove('is-menu-open');
      mobileMenuToggle.setAttribute('aria-expanded', 'false');
      mobileMenuToggle.setAttribute('aria-label', 'Open navigation menu');
    };
    mobileMenuToggle.addEventListener('click', () => {
      const isOpen = mobileHeader.classList.toggle('is-menu-open');
      mobileMenuToggle.setAttribute('aria-expanded', String(isOpen));
      mobileMenuToggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
    });
    mobilePrimaryNav.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMobileMenu));
    document.addEventListener('click', (event) => {
      if (!mobileHeader.contains(event.target)) closeMobileMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeMobileMenu();
    });
    window.matchMedia('(min-width: 761px)').addEventListener('change', closeMobileMenu);
  }
})();
</script>
